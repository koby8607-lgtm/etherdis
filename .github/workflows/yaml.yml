name: Build USB0 Manager v1.8.1

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK_VERSION: '27.2.12479018'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./gradlew
          bash ./gradlew --version

      - name: Configure Kotlin and Java for JVM 17
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          if not p.exists():
              raise SystemExit("app/build.gradle not found")

          s = p.read_text()

          s = s.replace("jvmTarget = '1.8'", "jvmTarget = '17'")
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')

          if "kotlinOptions" not in s:
              block = """
          kotlinOptions {
              jvmTarget = '17'
          }
          """
              if "android {" in s:
                  s = s.replace("android {", "android {" + block, 1)
              else:
                  s += "\n" + block

          p.write_text(s)

          for f in (
              Path("android-build-fix.gradle"),
              Path("app/android-build-fix.gradle"),
          ):
              if f.exists():
                  f.unlink()

          print("Kotlin/Java configuration updated.")
          PY

      - name: Fix known Kotlin source compatibility issues
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          for p in Path("app/src").rglob("*.kt"):
              s = p.read_text()

              s = s.replace("singleLine = true", "isSingleLine = true")

              marker = "private fun runHelper(command: String)"
              pos = s.find(marker)

              if pos >= 0:
                  brace = s.find("{", pos)

                  if brace >= 0:
                      depth = 0
                      end = None

                      for i in range(brace, len(s)):
                          if s[i] == "{":
                              depth += 1
                          elif s[i] == "}":
                              depth -= 1
                              if depth == 0:
                                  end = i + 1
                                  break

                      if end is not None:
                          prefix = s[max(0, pos - 20):brace]

                          if " = try {" in prefix:
                              start = s.rfind("private fun", 0, pos)

                              replacement = """private fun runHelper(command: String): String {
          return try {
              val helper = HelperManager.install(this).helper
              val q = "'${helper.absolutePath.replace("'", "'\\\\''")}' $command"
              var last = "no su"

              for (su in listOf("/system/xbin/su", "/system/bin/su", "/vendor/bin/su", "su")) {
                  try {
                      val process = Runtime.getRuntime().exec(arrayOf(su, "-c", q))
                      val out = process.inputStream.bufferedReader().readText()
                      val err = process.errorStream.bufferedReader().readText()
                      process.waitFor()

                      if (process.exitValue() == 0 || out.isNotBlank()) {
                          return out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""
                      }

                      last = err.ifBlank {
                          "su exit=${process.exitValue()}"
                      }
                  } catch (e: Exception) {
                      last = e.message ?: "su failed"
                  }
              }

              "root-error=$last"
          } catch (e: Exception) {
              "root-error=${e.message}"
          }
      }"""

                              s = s[:start] + replacement + s[end:]
                              print("Updated", p)

              p.write_text(s)
          PY

      - name: Build and bundle BusyBox and helper tools
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets/tools/arm64-v8a

          if [ -f scripts/build-busybox.sh ]; then
            chmod 755 scripts/build-busybox.sh
            ./scripts/build-busybox.sh
          else
            echo "scripts/build-busybox.sh not found; keeping existing bundled tools."
          fi

          if [ -f app/src/main/cpp/usb0-native.c ]; then
            NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
            TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

            CLANG="$TOOLCHAIN/aarch64-linux-android30-clang"
            STRIP="$TOOLCHAIN/llvm-strip"
            READELF="$TOOLCHAIN/llvm-readelf"

            "$CLANG" \
              -O2 \
              -fPIE \
              -fstack-protector-strong \
              -DANDROID \
              -D__ANDROID_API__=30 \
              -pie \
              app/src/main/cpp/usb0-native.c \
              -o app/src/main/assets/tools/arm64-v8a/usb0-native

            "$STRIP" \
              app/src/main/assets/tools/arm64-v8a/usb0-native || true

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native

            "$READELF" \
              -h app/src/main/assets/tools/arm64-v8a/usb0-native |
              grep -E 'Class:|Machine:|Type:'
          fi

      - name: Verify embedded tools
        shell: bash
        run: |
          set -euo pipefail

          test -s app/src/main/assets/tools/arm64-v8a/busybox
          echo "BusyBox present."

          if [ -f app/src/main/assets/tools/arm64-v8a/usb0-native ]; then
            test -s app/src/main/assets/tools/arm64-v8a/usb0-native
            echo "usb0-native present."
          fi

          find app/src/main/assets/tools/arm64-v8a \
            -maxdepth 1 \
            -type f \
            -printf '%f\n' |
            sort

      - name: Compile Kotlin with full diagnostics
        shell: bash
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/kotlin-build.log"

          bash ./gradlew \
            :app:compileDebugKotlin \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$LOG"

          rc=${PIPESTATUS[0]}

          echo "===== KOTLIN ERRORS ====="

          grep -E \
            '(^e: |error:|\.kt:[0-9]+:[0-9]+)' \
            "$LOG" || true

          echo "===== END KOTLIN ERRORS ====="

          exit "$rc"

      - name: Build debug APK
        shell: bash
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/debug-build.log"

          bash ./gradlew \
            assembleDebug \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$LOG"

          rc=${PIPESTATUS[0]}

          echo "===== BUILD ERRORS ====="

          grep -E \
            '(^e: |error:|FAILED|\.kt:[0-9]+:[0-9]+)' \
            "$LOG" || true

          echo "===== END BUILD ERRORS ====="

          exit "$rc"

      - name: Build release APK
        shell: bash
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/release-build.log"

          bash ./gradlew \
            assembleRelease \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$LOG"

          rc=${PIPESTATUS[0]}

          echo "===== RELEASE BUILD ERRORS ====="

          grep -E \
            '(^e: |error:|FAILED|\.kt:[0-9]+:[0-9]+)' \
            "$LOG" || true

          echo "===== END RELEASE BUILD ERRORS ====="

          exit "$rc"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          find app/build/outputs/apk \
            -type f \
            -name '*.apk' \
            -print \
            -exec file {} \;

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp app/build/outputs/apk/debug/*.apk artifacts/
          cp app/build/outputs/apk/release/*.apk artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.8.1
          path: artifacts/*.apk
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.8.1-diagnostics
          path: |
            ${{ runner.temp }}/kotlin-build.log
            ${{ runner.temp }}/debug-build.log
            ${{ runner.temp }}/release-build.log
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
