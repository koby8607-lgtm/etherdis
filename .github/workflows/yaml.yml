name: Build USB0 Manager

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  BUSYBOX_VERSION: "1.37.0"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          chmod 755 ./gradlew
          test -x ./gradlew

          mkdir -p \
            app/src/main/assets/tools/arm64-v8a \
            third_party \
            build-tools

      - name: Download BusyBox
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/busybox
          mkdir -p third_party/busybox

          cd third_party/busybox

          FILE="busybox-${BUSYBOX_VERSION}.tar.bz2"
          URL="https://busybox.net/downloads/${FILE}"

          curl \
            --fail \
            --location \
            --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            "${URL}" \
            --output "${FILE}"

          test -s "${FILE}"

          tar -xjf "${FILE}"

          test -d "busybox-${BUSYBOX_VERSION}"

      - name: Configure minimal BusyBox
        shell: bash
        run: |
          set -euo pipefail

          cd "third_party/busybox/busybox-${BUSYBOX_VERSION}"

          #
          # IMPORTANT:
          # Do NOT start from defconfig/android_defconfig.
          #
          # Those configurations enable a huge amount of BusyBox,
          # including networking/tc and many Linux-host-oriented utilities
          # which are not necessary for USB0 recovery and can fail against
          # Android's Bionic toolchain.
          #
          make allnoconfig

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(".config")
          text = path.read_text()

          enable = [
              "STATIC",
              "FEATURE_PREFER_APPLETS",

              # Core networking.
              "IP",
              "FEATURE_IP_LINK",
              "FEATURE_IP_ROUTE",
              "FEATURE_IP_RULE",
              "FEATURE_IP_NEIGH",
              "FEATURE_IP_ADDRESS",

              "IFCONFIG",
              "ROUTE",

              # ARP / neighbour recovery.
              "ARP",
              "ARPING",

              # Connectivity testing.
              "PING",

              # DHCP.
              "UDHCPC",

              # Kernel module fallback.
              "MODPROBE",
              "INSMOD",
              "RMMOD",

              # Basic shell/runtime utilities used by the app.
              "SH",
              "ASH",
              "CAT",
              "CP",
              "MV",
              "RM",
              "MKDIR",
              "READLINK",
              "GREP",
              "SED",
              "AWK",
              "SLEEP",
              "DATE",
              "LOGGER",
              "ENV",
              "PRINTENV",
              "UNAME",
              "KILL",
              "PS",
          ]

          # Explicitly disable large/unneeded networking components.
          disable = [
              "TC",
              "IPCS",
              "NETSTAT",
              "TRACEROUTE",
              "TRACEROUTE6",
              "NC",
              "NCAT",
              "TELNET",
              "TELNETD",
              "FTPGET",
              "FTPPUT",
              "IFUP",
              "IFDOWN",

              # Avoid large system-management components.
              "INIT",
              "MDEV",
              "SWAPON",
              "SWAPOFF",
              "MOUNT",
              "UMOUNT",
              "FDISK",
              "FSCK",
              "BLKID",
              "CROND",
              "CRONTAB",
              "SYSLOGD",
              "KLOGD",
              "LOGIN",
              "SULOGIN",
              "SU",
          ]

          def set_symbol(src, symbol, value):
              name = f"CONFIG_{symbol}"

              pattern = re.compile(
                  rf"^(?:{re.escape(name)}=.*|# {re.escape(name)} is not set)$",
                  re.MULTILINE,
              )

              replacement = (
                  f"{name}=y"
                  if value
                  else f"# {name} is not set"
              )

              return pattern.sub(
                  replacement,
                  src,
                  count=1,
              )

          for symbol in enable:
              text = set_symbol(text, symbol, True)

          for symbol in disable:
              text = set_symbol(text, symbol, False)

          path.write_text(text)
          PY

          #
          # BusyBox does not have the kernel olddefconfig target.
          #
          # Resolve dependencies without using `yes`, avoiding the
          # SIGPIPE/Broken-pipe failure that happened previously.
          #
          make oldconfig < /dev/null

          #
          # Verify that the problematic tc target is disabled.
          #
          if grep -q '^CONFIG_TC=y' .config; then
            echo "ERROR: CONFIG_TC unexpectedly enabled"
            exit 1
          fi

          echo "BusyBox configuration:"
          grep -E \
            '^(CONFIG_(STATIC|IP|FEATURE_IP_|IFCONFIG|ROUTE|ARP|ARPING|PING|UDHCPC|MODPROBE|INSMOD|RMMOD))=' \
            .config || true

      - name: Build BusyBox ARM64
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "${TOOLCHAIN}/aarch64-linux-android30-clang"
          test -x "${TOOLCHAIN}/llvm-ar"
          test -x "${TOOLCHAIN}/llvm-ranlib"
          test -x "${TOOLCHAIN}/llvm-strip"
          test -x "${TOOLCHAIN}/llvm-readelf"

          cd "third_party/busybox/busybox-${BUSYBOX_VERSION}"

          #
          # Android clang must not receive GCC's -static-libgcc.
          #
          export CFLAGS="$(printf '%s' "${CFLAGS:-}" | sed 's/-static-libgcc//g')"
          export CXXFLAGS="$(printf '%s' "${CXXFLAGS:-}" | sed 's/-static-libgcc//g')"
          export LDFLAGS="$(printf '%s' "${LDFLAGS:-}" | sed 's/-static-libgcc//g')"

          #
          # Force the relevant build variables as well, because BusyBox
          # can otherwise inherit host distribution flags.
          #
          unset CC CXX AR AS LD RANLIB STRIP OBJCOPY

          make -j"$(nproc)" \
            ARCH=arm64 \
            CROSS_COMPILE="${TOOLCHAIN}/aarch64-linux-android30-" \
            CC="${TOOLCHAIN}/aarch64-linux-android30-clang" \
            AR="${TOOLCHAIN}/llvm-ar" \
            RANLIB="${TOOLCHAIN}/llvm-ranlib" \
            STRIP="${TOOLCHAIN}/llvm-strip" \
            HOSTCC="cc"

          test -f busybox

          "${TOOLCHAIN}/llvm-readelf" -h busybox |
            grep -q "Class:.*ELF64"

          "${TOOLCHAIN}/llvm-readelf" -h busybox |
            grep -q "Machine:.*AArch64"

          mkdir -p \
            "${GITHUB_WORKSPACE}/app/src/main/assets/tools/arm64-v8a"

          cp busybox \
            "${GITHUB_WORKSPACE}/app/src/main/assets/tools/arm64-v8a/busybox"

          chmod 755 \
            "${GITHUB_WORKSPACE}/app/src/main/assets/tools/arm64-v8a/busybox"

      - name: Build USB0 ARM64 helper
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p \
            app/src/main/assets/tools/arm64-v8a

          SRC=""

          if [[ -f app/src/main/cpp/usb0-native.c ]]; then
            SRC="app/src/main/cpp/usb0-native.c"
          elif [[ -f app/src/main/cpp/usb0_helper.c ]]; then
            SRC="app/src/main/cpp/usb0_helper.c"
          elif [[ -f app/src/main/cpp/native_helper.c ]]; then
            SRC="app/src/main/cpp/native_helper.c"
          fi

          if [[ -n "${SRC}" ]]; then
            "${TOOLCHAIN}/aarch64-linux-android30-clang" \
              -O2 \
              -fPIE \
              -pie \
              -DANDROID \
              -Wall \
              -Wextra \
              "${SRC}" \
              -o app/src/main/assets/tools/arm64-v8a/usb0-native

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          else
            cat > app/src/main/assets/tools/arm64-v8a/usb0-native <<'EOF'
          #!/system/bin/sh
          HERE="${0%/*}"
          exec "${HERE}/busybox" "$@"
          EOF

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          fi

      - name: Create helper manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/assets/tools/arm64-v8a/manifest.txt <<EOF
          USB0 Manager helper bundle
          ABI=arm64-v8a
          BUSYBOX=${BUSYBOX_VERSION}
          NATIVE_HELPER=usb0-native
          BUILD_TARGET=android-arm64
          EOF

      - name: Create JVM compatibility configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > ci-jvm-targets.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          gradle.projectsEvaluated {
              allprojects { project ->
                  project.tasks.configureEach { task ->

                      if (task instanceof JavaCompile) {
                          task.sourceCompatibility = "17"
                          task.targetCompatibility = "17"

                          try {
                              task.options.release.set(17)
                          } catch (Throwable ignored) {
                          }
                      }

                      if (task.class.name.contains("KotlinCompile")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Throwable ignored) {
                          }
                      }
                  }
              }
          }
          EOF

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          chmod 755 ./gradlew

          test -f settings.gradle || \
            test -f settings.gradle.kts

          test -f build.gradle || \
            test -f build.gradle.kts

          test -f \
            app/src/main/assets/tools/arm64-v8a/busybox

          test -f \
            app/src/main/assets/tools/arm64-v8a/usb0-native

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          bash ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            -I "${GITHUB_WORKSPACE}/ci-jvm-targets.gradle"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          bash ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            -I "${GITHUB_WORKSPACE}/ci-jvm-targets.gradle"

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

          found=0

          while IFS= read -r -d '' apk; do
            echo "Found APK: ${apk}"
            cp "${apk}" "artifacts/$(basename "${apk}")"
            found=1
          done < <(
            find . \
              -type f \
              -path '*/build/outputs/apk/*.apk' \
              -print0
          )

          if [[ "${found}" -eq 0 ]]; then
            echo "ERROR: No APKs produced"
            find . \
              -type f \
              -path '*/build/outputs/*' \
              -print || true
            exit 1
          fi

      - name: Verify BusyBox and helper in APK
        shell: bash
        run: |
          set -euo pipefail

          for apk in artifacts/*.apk; do
            echo "Checking ${apk}"

            unzip -l "${apk}" |
              grep -F \
                "assets/tools/arm64-v8a/busybox"

            unzip -l "${apk}" |
              grep -F \
                "assets/tools/arm64-v8a/usb0-native"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/**
            ~/.gradle/daemon/**
            third_party/busybox/busybox-${BUSYBOX_VERSION}/.config
            third_party/busybox/busybox-${BUSYBOX_VERSION}/.config.old
          if-no-files-found: ignore
          retention-days: 7

  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate workflow
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW=""

          for f in \
            .github/workflows/yaml.yml \
            .github/workflows/yaml.yaml \
            .github/workflows/build.yml \
            .github/workflows/build.yaml; do

            if [[ -f "${f}" ]]; then
              WORKFLOW="${f}"
              break
            fi
          done

          if [[ -z "${WORKFLOW}" ]]; then
            echo "ERROR: no workflow file found"

            find .github/workflows \
              -maxdepth 1 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "Using ${WORKFLOW}"

          if grep -nE \
            'packages:.*(^|[[:space:]])tools([[:space:]]|$)|^[[:space:]]*-[[:space:]]*tools[[:space:]]*$' \
            "${WORKFLOW}" 2>/dev/null; then

            echo "ERROR: obsolete Android SDK 'tools' package detected"
            exit 1
          fi

          grep -q "BUSYBOX_VERSION" "${WORKFLOW}"
          grep -q "make allnoconfig" "${WORKFLOW}"
          grep -q "make oldconfig" "${WORKFLOW}"
          grep -q "bash ./gradlew" "${WORKFLOW}"

          if grep -n "yes.*make oldconfig" "${WORKFLOW}" 2>/dev/null; then
            echo "ERROR: unsafe yes|make oldconfig pipeline detected"
            exit 1
          fi

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          chmod 755 ./gradlew
          test -x ./gradlew

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            bash -n "${file}"
          done < <(
            find . \
              -type f \
              \( -name '*.sh' -o -name '*.bash' \) \
              -not -path './.git/*' \
              -print0
          )
