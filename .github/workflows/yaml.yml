name: Build USB0 Manager

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  BUSYBOX_VERSION: "1.37.0"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          chmod 755 ./gradlew

          test -r ./gradlew
          test -x ./gradlew

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/assets/tools/arm64-v8a \
            third_party \
            build-tools

      - name: Download BusyBox
        shell: bash
        run: |
          set -euo pipefail

          cd third_party

          rm -rf busybox
          mkdir -p busybox
          cd busybox

          URL="https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2"
          FILE="busybox-${BUSYBOX_VERSION}.tar.bz2"

          echo "Downloading ${URL}"

          curl \
            --fail \
            --location \
            --show-error \
            --retry 8 \
            --retry-delay 3 \
            --retry-all-errors \
            "${URL}" \
            --output "${FILE}"

          test -s "${FILE}"

          echo "Downloaded:"
          ls -lh "${FILE}"

          tar -xjf "${FILE}"

          test -d "busybox-${BUSYBOX_VERSION}"

      - name: Configure BusyBox without scripts/config
        shell: bash
        run: |
          set -euo pipefail

          cd "third_party/busybox/busybox-${BUSYBOX_VERSION}"

          make defconfig

          python3 - <<'PY'
          from pathlib import Path
          import re

          config = Path(".config")
          text = config.read_text()

          symbols = [
              "STATIC",
              "FEATURE_PREFER_APPLETS",

              "IP",
              "FEATURE_IP_LINK",
              "FEATURE_IP_ROUTE",
              "FEATURE_IP_RULE",
              "FEATURE_IP_NEIGH",
              "FEATURE_IP_ADDRESS",

              "IFCONFIG",
              "IFUP",
              "IFDOWN",
              "ROUTE",

              "ARP",
              "ARPING",

              "PING",
              "PING6",

              "UDHCPC",
              "UDHCPD",

              "MODPROBE",
              "INSMOD",
              "RMMOD",

              "LS",
              "CAT",
              "CP",
              "MV",
              "RM",
              "MKDIR",
              "READLINK",
              "GREP",
              "SED",
              "AWK",
              "SLEEP",
              "DATE",
              "LOGGER",
              "SH",
              "ASH",
              "ENV",
              "PRINTENV",
              "UNAME",
              "KILL",
              "PS",
          ]

          def enable_symbol(src: str, symbol: str) -> str:
              pattern = rf'^(?:# )?CONFIG_{re.escape(symbol)}(?:=.*| is not set)$'
              replacement = f"CONFIG_{symbol}=y"

              if re.search(pattern, src, flags=re.MULTILINE):
                  return re.sub(
                      pattern,
                      replacement,
                      src,
                      count=1,
                      flags=re.MULTILINE
                  )

              # The symbol may legitimately not exist in this BusyBox
              # configuration/version. Do not inject unknown symbols.
              return src

          for symbol in symbols:
              text = enable_symbol(text, symbol)

          config.write_text(text)

          print("BusyBox configuration updated.")
          PY

          make olddefconfig

          echo
          echo "Enabled BusyBox applets:"
          grep -E \
            '^(CONFIG_(STATIC|IP|FEATURE_IP_|IFCONFIG|IFUP|IFDOWN|ROUTE|ARP|ARPING|PING|PING6|UDHCPC|UDHCPD|MODPROBE|INSMOD|RMMOD))=' \
            .config || true

      - name: Build BusyBox for ARM64 Android
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -d "${TOOLCHAIN}"

          test -x "${TOOLCHAIN}/aarch64-linux-android30-clang"
          test -x "${TOOLCHAIN}/llvm-ar"
          test -x "${TOOLCHAIN}/llvm-ranlib"
          test -x "${TOOLCHAIN}/llvm-strip"
          test -x "${TOOLCHAIN}/llvm-readelf"

          cd "third_party/busybox/busybox-${BUSYBOX_VERSION}"

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC="${TOOLCHAIN}/aarch64-linux-android30-clang" \
            AR="${TOOLCHAIN}/llvm-ar" \
            RANLIB="${TOOLCHAIN}/llvm-ranlib" \
            STRIP="${TOOLCHAIN}/llvm-strip"

          test -f busybox

          "${TOOLCHAIN}/llvm-readelf" -h busybox |
            grep -q "Class:.*ELF64"

          "${TOOLCHAIN}/llvm-readelf" -h busybox |
            grep -q "Machine:.*AArch64"

          cp \
            busybox \
            "${GITHUB_WORKSPACE}/app/src/main/assets/tools/arm64-v8a/busybox"

          chmod 755 \
            "${GITHUB_WORKSPACE}/app/src/main/assets/tools/arm64-v8a/busybox"

      - name: Build USB0 native ARM64 helper
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "${TOOLCHAIN}/aarch64-linux-android30-clang"

          SRC=""

          if [[ -f app/src/main/cpp/usb0-native.c ]]; then
            SRC="app/src/main/cpp/usb0-native.c"
          elif [[ -f app/src/main/cpp/usb0_helper.c ]]; then
            SRC="app/src/main/cpp/usb0_helper.c"
          elif [[ -f app/src/main/cpp/native_helper.c ]]; then
            SRC="app/src/main/cpp/native_helper.c"
          fi

          if [[ -z "${SRC}" ]]; then
            echo "No native C helper source found."
            echo "The bundled BusyBox will be used by the shell recovery layer."

            cat > app/src/main/assets/tools/arm64-v8a/usb0-native <<'EOF'
          #!/system/bin/sh
          HERE="${0%/*}"
          exec "${HERE}/busybox" "$@"
          EOF

            chmod 755 app/src/main/assets/tools/arm64-v8a/usb0-native

          else
            "${TOOLCHAIN}/aarch64-linux-android30-clang" \
              -O2 \
              -fPIE \
              -pie \
              -DANDROID \
              -Wall \
              -Wextra \
              "${SRC}" \
              -o app/src/main/assets/tools/arm64-v8a/usb0-native

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native

            "${TOOLCHAIN}/llvm-readelf" -h \
              app/src/main/assets/tools/arm64-v8a/usb0-native |
              grep -q "Class:.*ELF64"

            "${TOOLCHAIN}/llvm-readelf" -h \
              app/src/main/assets/tools/arm64-v8a/usb0-native |
              grep -q "Machine:.*AArch64"
          fi

      - name: Create helper manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/assets/tools/arm64-v8a/manifest.txt <<EOF
          USB0 Manager ARM64 helper bundle
          ABI=arm64-v8a
          BUSYBOX=${BUSYBOX_VERSION}
          NativeHelper=usb0-native
          EOF

          test -s \
            app/src/main/assets/tools/arm64-v8a/manifest.txt

      - name: Create JVM compatibility configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > ci-jvm-targets.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          gradle.projectsEvaluated {
              allprojects { project ->
                  project.tasks.configureEach { task ->

                      if (task instanceof JavaCompile) {
                          task.sourceCompatibility = "17"
                          task.targetCompatibility = "17"

                          try {
                              task.options.release.set(17)
                          } catch (Throwable ignored) {
                          }
                      }

                      if (task.class.name.contains("KotlinCompile")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Throwable ignored) {
                          }

                          try {
                              def compilerOptions = task.compilerOptions
                              def jvmTarget = compilerOptions.jvmTarget

                              def target17 =
                                  jvmTarget.get().class.enumConstants.find {
                                      it.toString() == "JVM_17"
                                  }

                              if (target17 != null) {
                                  jvmTarget.set(target17)
                              }
                          } catch (Throwable ignored) {
                          }
                      }
                  }
              }
          }
          EOF

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f settings.gradle && ! -f settings.gradle.kts ]]; then
            echo "ERROR: Android Gradle settings file not found"
            exit 1
          fi

          if [[ ! -f build.gradle && ! -f build.gradle.kts ]]; then
            echo "ERROR: Android Gradle build file not found"
            exit 1
          fi

      - name: Verify bundled tools
        shell: bash
        run: |
          set -euo pipefail

          test -f app/src/main/assets/tools/arm64-v8a/busybox
          test -f app/src/main/assets/tools/arm64-v8a/usb0-native

          chmod 755 \
            app/src/main/assets/tools/arm64-v8a/busybox \
            app/src/main/assets/tools/arm64-v8a/usb0-native

          file \
            app/src/main/assets/tools/arm64-v8a/busybox

          file \
            app/src/main/assets/tools/arm64-v8a/usb0-native

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          bash ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            -I "${GITHUB_WORKSPACE}/ci-jvm-targets.gradle"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          bash ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            -I "${GITHUB_WORKSPACE}/ci-jvm-targets.gradle"

      - name: Verify generated APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          DEBUG_APK=""
          RELEASE_APK=""

          while IFS= read -r -d '' apk; do
            case "${apk}" in
              */build/outputs/apk/debug/*.apk)
                DEBUG_APK="${apk}"
                ;;
              */build/outputs/apk/release/*.apk)
                RELEASE_APK="${apk}"
                ;;
            esac
          done < <(
            find . \
              -type f \
              -path '*/build/outputs/apk/*.apk' \
              -print0
          )

          if [[ -z "${DEBUG_APK}" ]]; then
            echo "ERROR: Debug APK was not produced"
            find . \
              -type f \
              -path '*/build/outputs/*' \
              -print || true
            exit 1
          fi

          if [[ -z "${RELEASE_APK}" ]]; then
            echo "ERROR: Release APK was not produced"
            find . \
              -type f \
              -path '*/build/outputs/*' \
              -print || true
            exit 1
          fi

          cp "${DEBUG_APK}" artifacts/app-debug.apk
          cp "${RELEASE_APK}" artifacts/app-release-unsigned.apk

          ls -lh artifacts/*.apk

      - name: Verify embedded BusyBox
        shell: bash
        run: |
          set -euo pipefail

          for apk in artifacts/*.apk; do
            echo "Checking ${apk}"

            unzip -l "${apk}" |
              grep -F \
                "assets/tools/arm64-v8a/busybox"

            unzip -l "${apk}" |
              grep -F \
                "assets/tools/arm64-v8a/usb0-native"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/**
            ~/.gradle/daemon/**
          if-no-files-found: ignore
          retention-days: 7
