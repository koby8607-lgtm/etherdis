name: Build USB0 Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: "30"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  BUSYBOX_VERSION: "1.37.0"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            binutils \
            clang \
            curl \
            file \
            make \
            python3 \
            unzip \
            zip

      - name: Fix Gradle wrapper permissions
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew --version

      - name: Fix MonitorService Kotlin return
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/r36s/usb0manager/MonitorService.kt"

          test -f "${FILE}"

          python3 - "${FILE}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          old = (
              'return out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""'
          )

          new = (
              'return@runHelper out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""'
          )

          if old in text and "return@runHelper out +" not in text:
              text = text.replace(old, new, 1)
              path.write_text(text)

          if "return@runHelper out +" not in path.read_text():
              raise SystemExit(
                  "ERROR: could not fix runHelper() return"
              )

          print("MonitorService Kotlin return verified.")
          PY

      - name: Prepare embedded tool directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/assets/tools/arm64-v8a

      - name: Build usb0-native
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_NDK_ROOT}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          SOURCE=""

          if [ -f app/src/main/cpp/usb0-native.c ]; then
            SOURCE="app/src/main/cpp/usb0-native.c"
          elif [ -f app/src/main/cpp/usb0-native.cpp ]; then
            SOURCE="app/src/main/cpp/usb0-native.cpp"
          fi

          if [ -n "${SOURCE}" ]; then
            if [[ "${SOURCE}" == *.cpp ]]; then
              "${TOOLCHAIN}/aarch64-linux-android30-clang++" \
                -O2 \
                -fPIE \
                -fstack-protector-strong \
                -DANDROID \
                -pie \
                "${SOURCE}" \
                -o app/src/main/assets/tools/arm64-v8a/usb0-native
            else
              "${TOOLCHAIN}/aarch64-linux-android30-clang" \
                -O2 \
                -fPIE \
                -fstack-protector-strong \
                -DANDROID \
                -pie \
                "${SOURCE}" \
                -o app/src/main/assets/tools/arm64-v8a/usb0-native
            fi

            "${TOOLCHAIN}/llvm-strip" \
              app/src/main/assets/tools/arm64-v8a/usb0-native || true

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          else
            cat > app/src/main/assets/tools/arm64-v8a/usb0-native <<'EOF'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$SELF/busybox" "$@"
          EOF

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          fi

      - name: Create BusyBox builder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p scripts

          cat > scripts/build-busybox.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          ROOT="$(CDPATH= cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"

          VERSION="${BUSYBOX_VERSION:-1.37.0}"
          WORK="${RUNNER_TEMP:-/tmp}/usb0-busybox"
          SRC="${WORK}/busybox-${VERSION}"

          ASSET_DIR="${ROOT}/app/src/main/assets/tools/arm64-v8a"
          OUT="${ASSET_DIR}/busybox"

          NDK="${ANDROID_NDK_ROOT:-${ANDROID_HOME}/ndk/27.2.12479018}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="${TOOLCHAIN}/aarch64-linux-android30-clang"
          STRIP="${TOOLCHAIN}/llvm-strip"

          rm -rf "${WORK}"
          mkdir -p "${WORK}"
          mkdir -p "${ASSET_DIR}"

          echo "Downloading BusyBox ${VERSION}"

          curl -fsSL --retry 5 \
            "https://busybox.net/downloads/busybox-${VERSION}.tar.bz2" \
            -o "${WORK}/busybox.tar.bz2"

          tar -xjf "${WORK}/busybox.tar.bz2" -C "${WORK}"

          test -d "${SRC}"

          cd "${SRC}"

          echo "Patching BusyBox SHA1 ARM64 issue"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("libbb/hash_md5_sha.c")
          text = p.read_text()

          target = "sha1_process_block64_shaNI"

          if target in text:
              lines = text.splitlines()

              for i, line in enumerate(lines):
                  if target not in line:
                      continue

                  nearby = "\n".join(
                      lines[max(0, i - 6):min(len(lines), i + 6)]
                  )

                  if "defined(__i386__)" not in nearby:
                      indent = line[:len(line) - len(line.lstrip())]

                      lines.insert(
                          i,
                          indent
                          + "#if defined(__GNUC__) && "
                          "(defined(__i386__) || defined(__x86_64__))"
                      )

                      lines.insert(
                          i + 2,
                          indent + "#endif"
                      )

                      p.write_text("\n".join(lines) + "\n")
                  break
          PY

          echo "Patching BusyBox ifconfig for Android Bionic"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("networking/ifconfig.c")
          text = p.read_text()

          # BusyBox 1.37.0 declares struct in6_ifreq itself.
          # Android NDK API 30 already provides the same structure in
          # linux/ipv6.h, producing:
          #
          # error: redefinition of 'in6_ifreq'
          #
          # Remove only the local declaration. IPv6 support remains enabled
          # and BusyBox uses the Android-provided definition.
          start = text.find("#if ENABLE_FEATURE_IPV6\nstruct in6_ifreq {")

          if start >= 0:
              end_marker = "#endif"
              end = text.find(end_marker, start)

              if end < 0:
                  raise SystemExit(
                      "ERROR: ifconfig in6_ifreq closing #endif not found"
                  )

              end += len(end_marker)

              replacement = (
                  "/* Android Bionic provides struct in6_ifreq via "
                  "<linux/ipv6.h>. */"
              )

              text = text[:start] + replacement + text[end:]
              p.write_text(text)

          # Verify the duplicate declaration is gone.
          remaining = [
              line for line in p.read_text().splitlines()
              if "struct in6_ifreq {" in line
          ]

          if remaining:
              raise SystemExit(
                  "ERROR: local struct in6_ifreq declaration remains"
              )

          print("ifconfig Android Bionic compatibility patch applied.")
          PY

          echo "Creating minimal BusyBox configuration"

          make allnoconfig

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".config")
          lines = path.read_text().splitlines()

          wanted = {
              "CONFIG_ASH": "y",
              "CONFIG_ASH_OPTIMIZE_FOR_SIZE": "y",
              "CONFIG_FEATURE_SH_STANDALONE": "y",

              "CONFIG_CAT": "y",
              "CONFIG_CHMOD": "y",
              "CONFIG_CP": "y",
              "CONFIG_CUT": "y",
              "CONFIG_ECHO": "y",
              "CONFIG_ENV": "y",
              "CONFIG_GREP": "y",
              "CONFIG_HEAD": "y",
              "CONFIG_KILL": "y",
              "CONFIG_LS": "y",
              "CONFIG_MKDIR": "y",
              "CONFIG_MV": "y",
              "CONFIG_PRINTF": "y",
              "CONFIG_PS": "y",
              "CONFIG_PWD": "y",
              "CONFIG_READLINK": "y",
              "CONFIG_RM": "y",
              "CONFIG_SLEEP": "y",
              "CONFIG_SORT": "y",
              "CONFIG_STAT": "y",
              "CONFIG_SYNC": "y",
              "CONFIG_TAIL": "y",
              "CONFIG_TEST": "y",
              "CONFIG_TOUCH": "y",
              "CONFIG_TR": "y",
              "CONFIG_UNAME": "y",
              "CONFIG_WC": "y",

              "CONFIG_IP": "y",
              "CONFIG_FEATURE_IP_ADDRESS": "y",
              "CONFIG_FEATURE_IP_LINK": "y",
              "CONFIG_FEATURE_IP_ROUTE": "y",
              "CONFIG_FEATURE_IP_RULE": "y",
              "CONFIG_FEATURE_IP_NEIGH": "y",
              "CONFIG_FEATURE_IP_TUNNEL": "y",
              "CONFIG_FEATURE_IP_SHORT_FORMS": "y",

              "CONFIG_IFCONFIG": "y",
              "CONFIG_FEATURE_IFCONFIG_HW": "y",
              "CONFIG_ROUTE": "y",
              "CONFIG_ARP": "y",
              "CONFIG_ARPING": "y",
              "CONFIG_PING": "y",

              # IPv6 is required for PING6.
              "CONFIG_FEATURE_IPV6": "y",
              "CONFIG_PING6": "y",

              "CONFIG_UDHCPC": "y",
              "CONFIG_UDHCPC_DEFAULT_SCRIPT": "y",

              "CONFIG_MODPROBE": "y",
              "CONFIG_INSMOD": "y",
              "CONFIG_RMMOD": "y",

              "CONFIG_DMESG": "y",
              "CONFIG_DF": "y",

              # Dynamic Android/Bionic binary.
              "CONFIG_STATIC": "n",

              # ARM64 does not use the x86 SHA acceleration.
              "CONFIG_SHA1_HWACCEL": "n",
              "CONFIG_SHA256_HWACCEL": "n",

              # Unneeded.
              "CONFIG_TC": "n",
              "CONFIG_HOSTID": "n",
              "CONFIG_NETSTAT": "n",
              "CONFIG_TRACEROUTE": "n",
              "CONFIG_NC": "n",

              # Android Bionic does not provide addmntent().
              "CONFIG_MOUNT": "n",
              "CONFIG_UMOUNT": "n",
              "CONFIG_PIVOT_ROOT": "n",
              "CONFIG_SWAPONOFF": "n",
              "CONFIG_LOSETUP": "n",
              "CONFIG_READAHEAD": "n",
              "CONFIG_SETSERIAL": "n",
              "CONFIG_FSTRIM": "n",
              "CONFIG_BLOCKDEV": "n",
              "CONFIG_EJECT": "n",

              # Not needed.
              "CONFIG_TAR": "n",
              "CONFIG_GZIP": "n",
              "CONFIG_BZIP2": "n",
              "CONFIG_XZ": "n",
              "CONFIG_CPIO": "n",
              "CONFIG_AR": "n",
              "CONFIG_UNZIP": "n",

              "CONFIG_FEATURE_USE_BSS_TAIL": "n",
              "CONFIG_FLOAT_DURATION": "n",
              "CONFIG_FEATURE_RTMINMAX": "n",
              "CONFIG_FEATURE_BUFFERS_GO_ON_STACK": "n",
              "CONFIG_FEATURE_BUFFERS_USE_MALLOC": "n",
              "CONFIG_FEATURE_BUFFERS_GO_IN_BSS": "y",
          }

          def emit(key, value):
              if value == "n":
                  return f"# {key} is not set"
              return f"{key}={value}"

          output = []
          seen = set()

          for line in lines:
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]

                  if key in wanted:
                      output.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              if (
                  line.startswith("# CONFIG_")
                  and line.endswith(" is not set")
              ):
                  key = line[2:-11]

                  if key in wanted:
                      output.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              output.append(line)

          for key, value in wanted.items():
              if key not in seen:
                  output.append(emit(key, value))

          path.write_text("\n".join(output) + "\n")
          PY

          echo "Normalizing BusyBox configuration"

          set +e

          yes "" | make oldconfig > "${WORK}/oldconfig.log" 2>&1

          pipe_status=("${PIPESTATUS[@]}")
          make_rc="${pipe_status[1]}"

          set -e

          cat "${WORK}/oldconfig.log"

          if [ "${make_rc}" -ne 0 ]; then
              echo "BusyBox oldconfig failed: ${make_rc}"
              exit "${make_rc}"
          fi

          echo "Checking final BusyBox configuration"

          grep -Eq \
            '^CONFIG_FEATURE_IPV6=y$' \
            .config

          grep -Eq \
            '^CONFIG_PING6=y$' \
            .config

          grep -Eq \
            '^CONFIG_IFCONFIG=y$' \
            .config

          if grep -Eq \
              '^CONFIG_(MOUNT|UMOUNT|PIVOT_ROOT)=y$' \
              .config; then
              echo "ERROR: Android-incompatible mount applet enabled"
              exit 1
          fi

          echo "Compiling BusyBox"

          # Do not add -D__ANDROID_API__ here.
          # The NDK target triple already defines the correct Android API,
          # and adding it again produces a macro-redefined warning.
          export CC="${CC}"
          export HOSTCC="cc"
          export AR="$(command -v ar)"
          export RANLIB="$(command -v ranlib)"
          export STRIP="${STRIP}"

          export CFLAGS="-Os -fPIE"
          export LDFLAGS="-pie"

          make V=1 -j1 \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            AR="${AR}" \
            RANLIB="${RANLIB}" \
            STRIP="${STRIP}" \
            CFLAGS="${CFLAGS}" \
            LDFLAGS="${LDFLAGS}"

          test -f busybox

          test -f include/autoconf.h

          # Never execute the AArch64 BusyBox binary on the x86_64 runner.
          # Verify applets through BusyBox's generated configuration header.
          required_symbols=(
              IP
              IFCONFIG
              ARP
              ARPING
              ROUTE
              UDHCPC
              PING
              PING6
              MODPROBE
              INSMOD
              RMMOD
          )

          for symbol in "${required_symbols[@]}"; do
              if ! grep -Eq \
                  "^#define ENABLE_${symbol} 1$" \
                  include/autoconf.h; then

                  echo "ERROR: BusyBox applet ${symbol} was not compiled"
                  grep -E \
                    "ENABLE_${symbol}" \
                    include/autoconf.h || true

                  exit 1
              fi
          done

          echo "Required BusyBox applets verified."

          mkdir -p "${ASSET_DIR}"

          cp busybox "${OUT}"

          chmod 755 "${OUT}"

          "${STRIP}" "${OUT}" || true

          file "${OUT}"

          "${TOOLCHAIN}/llvm-readelf" -h "${OUT}" \
            | grep -Eq "Class:.*ELF64"

          "${TOOLCHAIN}/llvm-readelf" -h "${OUT}" \
            | grep -Eq "Machine:.*AArch64"

          "${TOOLCHAIN}/llvm-readelf" -l "${OUT}" \
            | grep -q "Requesting program interpreter"

          echo "BusyBox ARM64 build completed successfully."
          SCRIPT

          chmod 755 scripts/build-busybox.sh
          bash -n scripts/build-busybox.sh

      - name: Build BusyBox
        shell: bash
        run: |
          set -euo pipefail

          export BUSYBOX_VERSION="${BUSYBOX_VERSION}"

          bash ./scripts/build-busybox.sh

      - name: Install helper scripts
        shell: bash
        run: |
          set -euo pipefail

          DIR="app/src/main/assets/tools/arm64-v8a"

          cat > "${DIR}/usb0-helper.sh" <<'EOF'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "${SELF}/busybox" "$@"
          EOF

          cat > "${DIR}/usb0-helper" <<'EOF'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "${SELF}/busybox" "$@"
          EOF

          chmod 755 \
            "${DIR}/usb0-helper.sh" \
            "${DIR}/usb0-helper"

          cat > "${DIR}/manifest.txt" <<EOF
          ARCH=arm64-v8a
          ANDROID_API=${ANDROID_API_LEVEL}
          BUSYBOX_VERSION=${BUSYBOX_VERSION}
          STATIC=NO
          IPV6=YES
          PING6=YES
          SHA1_HWACCEL=NO
          SHA256_HWACCEL=NO
          TC=NO
          MOUNT=NO
          UMOUNT=NO
          PIVOT_ROOT=NO
          TARGET_BINARY_MUST_NOT_RUN_ON_CI=YES
          EOF

      - name: Verify embedded tools
        shell: bash
        run: |
          set -euo pipefail

          DIR="app/src/main/assets/tools/arm64-v8a"

          test -s "${DIR}/busybox"
          test -s "${DIR}/usb0-native"
          test -s "${DIR}/usb0-helper"
          test -s "${DIR}/usb0-helper.sh"
          test -s "${DIR}/manifest.txt"

          file "${DIR}/busybox"
          file "${DIR}/usb0-native"

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > android-build-fix.gradle <<'EOF'
          import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release.set(17)
              }

              tasks.withType(KotlinCompile).configureEach {
                  compilerOptions {
                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                      )
                  }
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("build.gradle"),
              Path("build.gradle.kts"),
          ]

          existing = [p for p in files if p.exists()]

          if not existing:
              raise SystemExit("ERROR: root Gradle build file not found")

          build_file = existing[0]
          text = build_file.read_text()

          if "android-build-fix.gradle" not in text:
              text += '\napply from: "android-build-fix.gradle"\n'
              build_file.write_text(text)

          print(f"Gradle compatibility fix added to {build_file}")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find app/build/outputs \
              -type f \
              -name "*.apk" \
              | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
              echo "ERROR: no APK produced"
              exit 1
          fi

          for apk in "${APKS[@]}"; do
              echo "Checking ${apk}"

              unzip -l "${apk}" \
                | grep -q \
                  "assets/tools/arm64-v8a/busybox"

              unzip -l "${apk}" \
                | grep -q \
                  "assets/tools/arm64-v8a/usb0-native"

              unzip -l "${apk}" \
                | grep -q \
                  "assets/tools/arm64-v8a/usb0-helper.sh"

              unzip -l "${apk}" \
                | grep -q \
                  "assets/tools/arm64-v8a/manifest.txt"

              echo "Verified ${apk}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload BusyBox
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-BusyBox-ARM64
          path: |
            app/src/main/assets/tools/arm64-v8a/busybox
            app/src/main/assets/tools/arm64-v8a/manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-build-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/**
            /tmp/**
          if-no-files-found: ignore
          retention-days: 7
