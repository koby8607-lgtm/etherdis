name: Build USB0 Manager v1.8.1

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_API_LEVEL: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew
          test -x ./gradlew

          ./gradlew --version

      - name: Verify prebuilt ARM64 BusyBox
        shell: bash
        run: |
          set -euo pipefail

          BUSYBOX="app/src/main/assets/tools/arm64-v8a/busybox"

          echo "Using bundled BusyBox:"
          echo "$BUSYBOX"

          test -f "$BUSYBOX"
          test -s "$BUSYBOX"

          chmod 755 "$BUSYBOX"

          echo
          echo "BusyBox file information:"
          file "$BUSYBOX"

          echo
          echo "Verifying ARM64:"
          file "$BUSYBOX" | grep -Eiq 'ELF 64-bit.*ARM aarch64'

          echo
          echo "Verifying static linking:"
          file "$BUSYBOX" | grep -Eiq 'statically linked'

          echo
          echo "Verifying executable:"
          test -x "$BUSYBOX"

          echo
          echo "SHA256 of bundled BusyBox:"
          sha256sum "$BUSYBOX"

          echo
          echo "Prebuilt ARM64 BusyBox is valid."

      - name: Verify other bundled tools
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            app/src/main/assets/tools/arm64-v8a/usb0-native \
            app/src/main/assets/tools/arm64-v8a/usb0-helper \
            app/src/main/assets/tools/arm64-v8a/usb0-helper.sh \
            app/src/main/assets/r36s/lineageos_r36s_defconfig.txt \
            app/src/main/assets/r36s/kernel-capabilities.txt
          do
            test -f "$f"
            test -s "$f"
            echo "OK: $f"
          done

      - name: Fix Kotlin JVM target
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          text = p.read_text()

          text = text.replace(
              "jvmTarget = '1.8'",
              "jvmTarget = '17'"
          )

          text = text.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          p.write_text(text)

          print("Kotlin JVM target set to 17.")
          PY

          rm -f android-build-fix.gradle
          rm -f app/android-build-fix.gradle

      - name: Fix known Kotlin source issue
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path("app/src/main/java")

          for p in root.rglob("*.kt"):
              text = p.read_text()

              text = text.replace(
                  "singleLine = true",
                  "isSingleLine = true"
              )

              p.write_text(text)
          PY

      - name: Build ARM64 usb0-native
        shell: bash
        run: |
          set -euo pipefail

          SRC="app/src/main/cpp/usb0-native.c"
          OUT="app/src/main/assets/tools/arm64-v8a/usb0-native"

          test -f "$SRC"

          mkdir -p "$(dirname "$OUT")"

          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CLANG="$TOOLCHAIN/aarch64-linux-android30-clang"
          STRIP="$TOOLCHAIN/llvm-strip"
          READELF="$TOOLCHAIN/llvm-readelf"

          test -x "$CLANG"

          "$CLANG" \
            -O2 \
            -fPIE \
            -fstack-protector-strong \
            -DANDROID \
            -D__ANDROID_API__=30 \
            -pie \
            "$SRC" \
            -o "$OUT"

          "$STRIP" "$OUT"

          chmod 755 "$OUT"

          echo
          file "$OUT"

          "$READELF" -h "$OUT" |
            grep -E 'Class:|Machine:|Type:'

      - name: Verify no BusyBox build is being attempted
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking workflow and scripts for accidental BusyBox compilation..."

          if grep -RniE \
            'make[[:space:]]+.*busybox|make[[:space:]]+-j.*busybox|busybox_unstripped|busybox-1\.37\.0\.tar' \
            .github scripts 2>/dev/null; then
            echo "ERROR: A BusyBox compilation/download command is still present."
            exit 1
          fi

          echo "No BusyBox compilation/download command found."

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' f; do
            echo "Checking $f"
            bash -n "$f"
          done < <(
            find scripts app/src/main/assets \
              -type f \
              -name "*.sh" \
              -print0
          )

      - name: Check Gradle project
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew tasks \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain

      - name: Compile Kotlin
        shell: bash
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/kotlin.log"

          ./gradlew :app:compileDebugKotlin \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$LOG"

          RC=${PIPESTATUS[0]}

          echo
          echo "===== KOTLIN ERRORS ====="

          grep -E \
            '(^e: |error:|\.kt:[0-9]+:[0-9]+)' \
            "$LOG" || true

          echo "===== END KOTLIN ERRORS ====="

          exit "$RC"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain

      - name: Create CI signing key
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/usb0-manager-release.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias usb0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=USB0 Manager, OU=R36S, O=USB0 Manager, L=R36S, ST=R36S, C=GB" \
            -noprompt

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleRelease \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/usb0-manager-release.jks" \
            -PRELEASE_STORE_PASSWORD=changeit \
            -PRELEASE_KEY_ALIAS=usb0 \
            -PRELEASE_KEY_PASSWORD=changeit

      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          found=0

          for apk in \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk
          do
            [ -f "$apk" ] || continue

            found=1

            echo
            echo "===== VERIFYING $apk ====="

            "$APKSIGNER" verify --verbose "$apk"

            unzip -l "$apk" |
              grep -F 'assets/tools/arm64-v8a/busybox'

            unzip -l "$apk" |
              grep -F 'assets/tools/arm64-v8a/usb0-native'

            unzip -l "$apk" |
              grep -F 'assets/tools/arm64-v8a/usb0-helper'

            unzip -l "$apk" |
              grep -F 'assets/tools/arm64-v8a/usb0-helper.sh'

            echo
            echo "Embedded BusyBox:"
            unzip -p "$apk" \
              assets/tools/arm64-v8a/busybox |
              file -

            echo
            echo "Embedded usb0-native:"
            unzip -p "$apk" \
              assets/tools/arm64-v8a/usb0-native |
              file -
          done

          test "$found" -eq 1

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp app/build/outputs/apk/debug/*.apk artifacts/
          cp app/build/outputs/apk/release/*.apk artifacts/

          ls -lh artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.8.1
          path: artifacts/*.apk
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.8.1-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/**
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
