name: Build USB0 Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BUSYBOX_VERSION: "1.37.0"
  NDK_VERSION: "27.2.12479018"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            git \
            make \
            python3 \
            unzip \
            zip

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-30" "build-tools;35.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Prepare BusyBox source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf busybox-src
          mkdir -p busybox-src

          curl -L --fail --retry 5 \
            "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2" \
            -o busybox.tar.bz2

          tar -xjf busybox.tar.bz2
          mv "busybox-${BUSYBOX_VERSION}" busybox-src
          rm -f busybox.tar.bz2

      - name: Patch BusyBox for ARM64 Android
        shell: bash
        run: |
          set -euo pipefail
          cd busybox-src

          python3 - <<'PY'
          from pathlib import Path

          p = Path("libbb/hash_md5_sha.c")
          s = p.read_text()

          old = """#if ENABLE_SHA1_HWACCEL
              process_block = sha1_process_block64_shaNI;
          #endif
          """

          new = """#if ENABLE_SHA1_HWACCEL
          # if defined(__GNUC__) && (defined(__i386__) || defined(__x86_64__))
              process_block = sha1_process_block64_shaNI;
          # endif
          #endif
          """

          if "sha1_process_block64_shaNI" in s and "__i386__" not in s:
              s = s.replace(old, new)

          p.write_text(s)
          PY

      - name: Configure BusyBox
        shell: bash
        run: |
          set -euo pipefail
          cd busybox-src

          make allnoconfig

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".config")
          lines = path.read_text().splitlines()

          wanted = {
              "CONFIG_DESKTOP": "y",
              "CONFIG_FEATURE_BUFFERS_GO_IN_BSS": "y",
              "CONFIG_LONG_OPTS": "y",
              "CONFIG_FEATURE_SUID": "y",
              "CONFIG_FEATURE_SUID_CONFIG": "y",
              "CONFIG_FEATURE_SUID_CONFIG_QUIET": "y",

              "CONFIG_FEATURE_SH_STANDALONE": "y",
              "CONFIG_ASH": "y",
              "CONFIG_ASH_OPTIMIZE_FOR_SIZE": "y",

              "CONFIG_CAT": "y",
              "CONFIG_CHMOD": "y",
              "CONFIG_CHOWN": "y",
              "CONFIG_CP": "y",
              "CONFIG_CUT": "y",
              "CONFIG_ECHO": "y",
              "CONFIG_ENV": "y",
              "CONFIG_GREP": "y",
              "CONFIG_HEAD": "y",
              "CONFIG_KILL": "y",
              "CONFIG_LS": "y",
              "CONFIG_MKDIR": "y",
              "CONFIG_MV": "y",
              "CONFIG_PRINTF": "y",
              "CONFIG_PS": "y",
              "CONFIG_PWD": "y",
              "CONFIG_READLINK": "y",
              "CONFIG_RM": "y",
              "CONFIG_SLEEP": "y",
              "CONFIG_SORT": "y",
              "CONFIG_STAT": "y",
              "CONFIG_SYNC": "y",
              "CONFIG_TAIL": "y",
              "CONFIG_TEST": "y",
              "CONFIG_TOUCH": "y",
              "CONFIG_TR": "y",
              "CONFIG_UNAME": "y",
              "CONFIG_UNSET": "y",
              "CONFIG_USLEEP": "y",
              "CONFIG_WC": "y",

              "CONFIG_IP": "y",
              "CONFIG_FEATURE_IP_ADDRESS": "y",
              "CONFIG_FEATURE_IP_LINK": "y",
              "CONFIG_FEATURE_IP_ROUTE": "y",
              "CONFIG_FEATURE_IP_RULE": "y",
              "CONFIG_FEATURE_IP_NEIGH": "y",
              "CONFIG_FEATURE_IP_TUNNEL": "y",
              "CONFIG_FEATURE_IP_SHORT_FORMS": "y",

              "CONFIG_IFCONFIG": "y",
              "CONFIG_FEATURE_IFCONFIG_HW": "y",
              "CONFIG_ROUTE": "y",
              "CONFIG_ARP": "y",
              "CONFIG_ARPING": "y",
              "CONFIG_PING": "y",
              "CONFIG_PING6": "y",
              "CONFIG_UDHCPC": "y",
              "CONFIG_UDHCPC_DEFAULT_SCRIPT": "y",

              "CONFIG_MODPROBE": "y",
              "CONFIG_INSMOD": "y",
              "CONFIG_RMMOD": "y",

              "CONFIG_MOUNT": "y",
              "CONFIG_UMOUNT": "y",
              "CONFIG_DF": "y",
              "CONFIG_DMESG": "y",

              "CONFIG_DEVFSD": "n",
              "CONFIG_STATIC": "n",
              "CONFIG_SHA1_HWACCEL": "n",
              "CONFIG_SHA256_HWACCEL": "n",
              "CONFIG_TC": "n",
              "CONFIG_HOSTID": "n",
              "CONFIG_NETSTAT": "n",
              "CONFIG_TRACEROUTE": "n",
              "CONFIG_NC": "n",
          }

          out = []
          seen = set()

          for line in lines:
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]
                  if key in wanted:
                      out.append(f"{key}={wanted[key]}")
                      seen.add(key)
                      continue

              if line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  key = line[2:-11]
                  if key in wanted:
                      out.append(f"{key}={wanted[key]}")
                      seen.add(key)
                      continue

              out.append(line)

          for key, value in wanted.items():
              if key not in seen:
                  out.append(f"{key}={value}")

          path.write_text("\n".join(out) + "\n")
          PY

          make oldconfig </dev/null || {
            echo "BusyBox oldconfig failed"
            exit 1
          }

      - name: Build BusyBox for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          cd busybox-src

          NDK="${ANDROID_NDK_ROOT}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export PATH="${TOOLCHAIN}:${PATH}"

          export CC="${TOOLCHAIN}/aarch64-linux-android30-clang"
          export HOSTCC="cc"
          export AR="${TOOLCHAIN}/llvm-ar"
          export RANLIB="${TOOLCHAIN}/llvm-ranlib"
          export STRIP="${TOOLCHAIN}/llvm-strip"

          export CFLAGS="${CFLAGS:-}"
          export CXXFLAGS="${CXXFLAGS:-}"
          export LDFLAGS="${LDFLAGS:-}"

          CFLAGS="$(printf '%s' "$CFLAGS" | sed 's/-static-libgcc//g; s/-static-libstdc++//g')"
          CXXFLAGS="$(printf '%s' "$CXXFLAGS" | sed 's/-static-libgcc//g; s/-static-libstdc++//g')"
          LDFLAGS="$(printf '%s' "$LDFLAGS" | sed 's/-static-libgcc//g; s/-static-libstdc++//g')"

          export CFLAGS
          export CXXFLAGS
          export LDFLAGS

          make -j"$(nproc)" \
            CC="$CC" \
            HOSTCC="$HOSTCC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP"

          file busybox
          readelf -h busybox | grep -E "Class:.*ELF64|Machine:.*AArch64"
          readelf -l busybox | grep -q "Requesting program interpreter" || {
            echo "BusyBox is unexpectedly static"
            exit 1
          }

      - name: Install embedded tools
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets/tools/arm64-v8a
          cp busybox-src/busybox app/src/main/assets/tools/arm64-v8a/busybox
          chmod 755 app/src/main/assets/tools/arm64-v8a/busybox

          if [ -f app/src/main/jni/arm64-v8a/usb0-native ]; then
            cp app/src/main/jni/arm64-v8a/usb0-native \
              app/src/main/assets/tools/arm64-v8a/usb0-native
            chmod 755 app/src/main/assets/tools/arm64-v8a/usb0-native
          elif [ -f app/src/main/cpp/arm64-v8a/usb0-native ]; then
            cp app/src/main/cpp/arm64-v8a/usb0-native \
              app/src/main/assets/tools/arm64-v8a/usb0-native
            chmod 755 app/src/main/assets/tools/arm64-v8a/usb0-native
          else
            cat > app/src/main/assets/tools/arm64-v8a/usb0-native <<'EOF'
          #!/system/bin/sh
          exec "$(dirname "$0")/busybox" "$@"
          EOF
            chmod 755 app/src/main/assets/tools/arm64-v8a/usb0-native
          fi

          cat > app/src/main/assets/tools/arm64-v8a/manifest.txt <<EOF
          ARCH=arm64-v8a
          BUSYBOX_VERSION=${BUSYBOX_VERSION}
          ANDROID_API=30
          STATIC=NO
          SHA1_HWACCEL=NO
          SHA256_HWACCEL=NO
          TC=NO
          EOF

      - name: Fix Gradle permissions and JVM targets
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew 2>/dev/null || true

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > build.gradle.kts.tmp <<'EOF'
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew \
            clean \
            assembleDebug \
            assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find . -type f \( -name '*-debug.apk' -o -name '*-release.apk' \) | head -n 1)"

          test -n "$APK"

          unzip -l "$APK" | grep -q "assets/tools/arm64-v8a/busybox"
          unzip -l "$APK" | grep -q "assets/tools/arm64-v8a/usb0-native"
          unzip -l "$APK" | grep -q "assets/tools/arm64-v8a/manifest.txt"

          echo "Verified APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload BusyBox
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-BusyBox-ARM64
          path: |
            busybox-src/busybox
            app/src/main/assets/tools/arm64-v8a/manifest.txt

  validate-workflow:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow YAML
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import sys

          workflows = sorted(Path(".github/workflows").glob("*.yml"))
          workflows += sorted(Path(".github/workflows").glob("*.yaml"))

          if not workflows:
              print("No workflow files found")
              sys.exit(1)

          print("Workflow files:")
          for wf in workflows:
              print(f" - {wf}")

              text = wf.read_text()

              if "sdkmanager \"tools\"" in text:
                  print(f"ERROR: obsolete Android SDK tools package in {wf}")
                  sys.exit(1)

              if "setup-android@v2" in text:
                  print(f"ERROR: obsolete setup-android action in {wf}")
                  sys.exit(1)

          print("Workflow source validation passed")
          PY
