name: Build USB0 Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BUSYBOX_VERSION: "1.37.0"
  NDK_VERSION: "27.2.12479018"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platforms;android-30" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            git \
            make \
            binutils \
            python3 \
            unzip \
            zip

      - name: Download BusyBox
        shell: bash
        run: |
          set -euo pipefail

          rm -rf busybox-src
          rm -f busybox.tar.bz2

          curl -L --fail --retry 5 \
            "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2" \
            -o busybox.tar.bz2

          tar -xjf busybox.tar.bz2

          mv \
            "busybox-${BUSYBOX_VERSION}" \
            busybox-src

          rm -f busybox.tar.bz2

      - name: Verify BusyBox source
        shell: bash
        run: |
          set -euo pipefail

          test -f busybox-src/libbb/hash_md5_sha.c
          test -f busybox-src/util-linux/mount.c

      - name: Apply ARM64 SHA1 compatibility patch
        shell: bash
        run: |
          set -euo pipefail

          cd busybox-src

          python3 - <<'PY'
          from pathlib import Path
          import sys

          path = Path("libbb/hash_md5_sha.c")
          text = path.read_text()

          target = "sha1_process_block64_shaNI"

          if target not in text:
              print("No SHA-NI reference present; no patch required.")
              sys.exit(0)

          lines = text.splitlines()

          for i, line in enumerate(lines):
              if target not in line:
                  continue

              # Already guarded.
              if i > 0 and "defined(__i386__)" in lines[i - 1]:
                  print("SHA-NI ARM64 guard already present.")
                  sys.exit(0)

              if i > 1 and "defined(__i386__)" in lines[i - 2]:
                  print("SHA-NI ARM64 guard already present.")
                  sys.exit(0)

              # Insert only a complete nested preprocessor guard around
              # the x86-only SHA-NI expression.
              indent = line[:len(line) - len(line.lstrip())]

              lines.insert(
                  i,
                  f"{indent}#if defined(__GNUC__) && (defined(__i386__) || defined(__x86_64__))"
              )

              lines.insert(
                  i + 2,
                  f"{indent}#endif"
              )

              path.write_text("\n".join(lines) + "\n")
              print("Applied SHA-NI ARM64 guard.")
              sys.exit(0)

          print("ERROR: SHA-NI reference was not patchable.")
          sys.exit(1)
          PY

      - name: Disable Android-incompatible BusyBox applets
        shell: bash
        run: |
          set -euo pipefail

          cd busybox-src

          make allnoconfig

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".config")
          lines = path.read_text().splitlines()

          # Only enable utilities required by USB0 Manager.
          # In particular, DO NOT enable mount/umount:
          # BusyBox mount.c uses addmntent(), which Android Bionic's
          # mntent.h does not provide.
          wanted = {
              # Core / shell
              "CONFIG_DESKTOP": "y",
              "CONFIG_LONG_OPTS": "y",
              "CONFIG_ASH": "y",
              "CONFIG_ASH_OPTIMIZE_FOR_SIZE": "y",
              "CONFIG_FEATURE_SH_STANDALONE": "y",

              # Basic shell utilities
              "CONFIG_CAT": "y",
              "CONFIG_CHMOD": "y",
              "CONFIG_CHOWN": "y",
              "CONFIG_CP": "y",
              "CONFIG_CUT": "y",
              "CONFIG_ECHO": "y",
              "CONFIG_ENV": "y",
              "CONFIG_GREP": "y",
              "CONFIG_HEAD": "y",
              "CONFIG_KILL": "y",
              "CONFIG_LS": "y",
              "CONFIG_MKDIR": "y",
              "CONFIG_MV": "y",
              "CONFIG_PRINTF": "y",
              "CONFIG_PS": "y",
              "CONFIG_PWD": "y",
              "CONFIG_READLINK": "y",
              "CONFIG_RM": "y",
              "CONFIG_SLEEP": "y",
              "CONFIG_SORT": "y",
              "CONFIG_STAT": "y",
              "CONFIG_SYNC": "y",
              "CONFIG_TAIL": "y",
              "CONFIG_TEST": "y",
              "CONFIG_TOUCH": "y",
              "CONFIG_TR": "y",
              "CONFIG_UNAME": "y",
              "CONFIG_UNSET": "y",
              "CONFIG_USLEEP": "y",
              "CONFIG_WC": "y",

              # Network configuration
              "CONFIG_IP": "y",
              "CONFIG_FEATURE_IP_ADDRESS": "y",
              "CONFIG_FEATURE_IP_LINK": "y",
              "CONFIG_FEATURE_IP_ROUTE": "y",
              "CONFIG_FEATURE_IP_RULE": "y",
              "CONFIG_FEATURE_IP_NEIGH": "y",
              "CONFIG_FEATURE_IP_TUNNEL": "y",
              "CONFIG_FEATURE_IP_SHORT_FORMS": "y",

              "CONFIG_IFCONFIG": "y",
              "CONFIG_FEATURE_IFCONFIG_HW": "y",
              "CONFIG_ROUTE": "y",
              "CONFIG_ARP": "y",
              "CONFIG_ARPING": "y",
              "CONFIG_PING": "y",
              "CONFIG_PING6": "y",
              "CONFIG_UDHCPC": "y",
              "CONFIG_UDHCPC_DEFAULT_SCRIPT": "y",

              # Root / kernel module helpers
              "CONFIG_MODPROBE": "y",
              "CONFIG_INSMOD": "y",
              "CONFIG_RMMOD": "y",

              # Diagnostics
              "CONFIG_DMESG": "y",
              "CONFIG_DF": "y",

              # Android / ARM64 compatibility
              "CONFIG_STATIC": "n",
              "CONFIG_SHA1_HWACCEL": "n",
              "CONFIG_SHA256_HWACCEL": "n",
              "CONFIG_TC": "n",
              "CONFIG_HOSTID": "n",
              "CONFIG_NETSTAT": "n",
              "CONFIG_TRACEROUTE": "n",
              "CONFIG_NC": "n",

              # Explicitly disable util-linux functions that are not
              # required by USB0 Manager and can pull Android-incompatible
              # libc APIs into the build.
              "CONFIG_MOUNT": "n",
              "CONFIG_UMOUNT": "n",
              "CONFIG_PIVOT_ROOT": "n",
              "CONFIG_SWAPONOFF": "n",
              "CONFIG_FREERAMDISK": "n",
              "CONFIG_LOSETUP": "n",
              "CONFIG_READAHEAD": "n",
              "CONFIG_SETSERIAL": "n",
              "CONFIG_MKFS_EXT2": "n",
              "CONFIG_MKFS_MINIX": "n",
              "CONFIG_MKFS_REISER": "n",
              "CONFIG_FSTRIM": "n",
              "CONFIG_BLOCKDEV": "n",
              "CONFIG_RDATE": "n",
              "CONFIG_EJECT": "n",
              "CONFIG_IPCRM": "n",
              "CONFIG_IPCS": "n",
              "CONFIG_LSPCI": "n",
              "CONFIG_LSUSB": "n",

              # Avoid optional libc-heavy features.
              "CONFIG_FEATURE_USE_BSS_TAIL": "n",
              "CONFIG_FLOAT_DURATION": "n",
              "CONFIG_FEATURE_RTMINMAX": "n",
              "CONFIG_FEATURE_BUFFERS_GO_ON_STACK": "n",
              "CONFIG_FEATURE_BUFFERS_USE_MALLOC": "n",
              "CONFIG_FEATURE_BUFFERS_GO_IN_BSS": "y",

              # Disable optional filesystem / password / archive code.
              "CONFIG_TAR": "n",
              "CONFIG_GZIP": "n",
              "CONFIG_BZIP2": "n",
              "CONFIG_XZ": "n",
              "CONFIG_CPIO": "n",
              "CONFIG_AR": "n",
              "CONFIG_UNZIP": "n",
              "CONFIG_CRYPTPW": "n",
              "CONFIG_LOGIN": "n",
              "CONFIG_SU": "n",
              "CONFIG_SULOGIN": "n",
              "CONFIG_PASSWD": "n",
              "CONFIG_ADDUSER": "n",
              "CONFIG_DELUSER": "n",
              "CONFIG_ADDGROUP": "n",
              "CONFIG_DELGROUP": "n",
              "CONFIG_CHGRP": "n",
          }

          out = []
          seen = set()

          def emit(key, value):
              if value == "n":
                  return f"# {key} is not set"
              return f"{key}={value}"

          for line in lines:
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]

                  if key in wanted:
                      out.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              if line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  key = line[2:-11]

                  if key in wanted:
                      out.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              out.append(line)

          for key, value in wanted.items():
              if key not in seen:
                  out.append(emit(key, value))

          path.write_text("\n".join(out) + "\n")
          PY

      - name: Normalize BusyBox configuration
        shell: bash
        run: |
          set -euo pipefail

          cd busybox-src

          rm -f /tmp/busybox-oldconfig.log

          # Feed default answers, but explicitly ignore the producer's
          # SIGPIPE. We care only about make's return code.
          set +e
          yes "" | make oldconfig > /tmp/busybox-oldconfig.log 2>&1
          status=("${PIPESTATUS[@]}")
          make_rc="${status[1]}"
          set -e

          cat /tmp/busybox-oldconfig.log

          if [ "${make_rc}" -ne 0 ]; then
            echo "BusyBox Kconfig failed with exit code ${make_rc}"
            exit "${make_rc}"
          fi

          # Verify no accidentally-enabled mount code remains.
          if grep -Eq '^CONFIG_MOUNT=y$|^CONFIG_UMOUNT=y$|^CONFIG_PIVOT_ROOT=y$' .config; then
            echo "ERROR: Android-incompatible mount functionality was enabled"
            grep -E '^CONFIG_(MOUNT|UMOUNT|PIVOT_ROOT)=' .config || true
            exit 1
          fi

          echo "BusyBox configuration accepted."

      - name: Verify BusyBox source does not contain an enabled mount target
        shell: bash
        run: |
          set -euo pipefail

          cd busybox-src

          echo "Enabled relevant configuration:"
          grep -E \
            '^CONFIG_(MOUNT|UMOUNT|PIVOT_ROOT|IP|IFCONFIG|ARP|ARPING|ROUTE|UDHCPC|MODPROBE|INSMOD|RMMOD|STATIC)=' \
            .config \
            || true

          if grep -Eq '^CONFIG_MOUNT=y$' .config; then
            echo "ERROR: CONFIG_MOUNT=y is forbidden for Android Bionic build"
            exit 1
          fi

      - name: Build BusyBox for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          cd busybox-src

          TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export PATH="${TOOLCHAIN}:${PATH}"

          export CC="${TOOLCHAIN}/aarch64-linux-android30-clang"
          export HOSTCC="cc"
          export AR="$(command -v ar)"
          export RANLIB="$(command -v ranlib)"
          export STRIP="${TOOLCHAIN}/llvm-strip"

          export CFLAGS="${CFLAGS:-}"
          export CXXFLAGS="${CXXFLAGS:-}"
          export LDFLAGS="${LDFLAGS:-}"

          CFLAGS="$(printf '%s' "$CFLAGS" \
            | sed 's/-static-libgcc//g; s/-static-libstdc++//g')"

          CXXFLAGS="$(printf '%s' "$CXXFLAGS" \
            | sed 's/-static-libgcc//g; s/-static-libstdc++//g')"

          LDFLAGS="$(printf '%s' "$LDFLAGS" \
            | sed 's/-static-libgcc//g; s/-static-libstdc++//g')"

          export CFLAGS
          export CXXFLAGS
          export LDFLAGS

          echo "Compiler: $CC"
          echo "Android NDK: ${ANDROID_NDK_ROOT}"
          echo "BusyBox: ${BUSYBOX_VERSION}"

          "$CC" --version

          make V=1 -j1 \
            CC="$CC" \
            HOSTCC="$HOSTCC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP"

          test -x busybox

          file busybox

          readelf -h busybox | grep -E \
            "Class:.*ELF64|Machine:.*AArch64"

          readelf -l busybox \
            | grep -q "Requesting program interpreter"

      - name: Smoke-test BusyBox binary
        shell: bash
        run: |
          set -euo pipefail

          cd busybox-src

          # Validate the binary without executing the Android target binary
          # on the Ubuntu runner.
          file busybox
          readelf -h busybox
          readelf -l busybox

          # Confirm expected applets were compiled.
          strings busybox | grep -q "udhcpc"
          strings busybox | grep -q "arping"
          strings busybox | grep -q "ifconfig"
          strings busybox | grep -q "route"

      - name: Install embedded ARM64 tools
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/assets/tools/arm64-v8a

          cp \
            busybox-src/busybox \
            app/src/main/assets/tools/arm64-v8a/busybox

          chmod 755 \
            app/src/main/assets/tools/arm64-v8a/busybox

          if [ -f app/src/main/jni/arm64-v8a/usb0-native ]; then
            cp \
              app/src/main/jni/arm64-v8a/usb0-native \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          elif [ -f app/src/main/cpp/arm64-v8a/usb0-native ]; then
            cp \
              app/src/main/cpp/arm64-v8a/usb0-native \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          else
            cat > \
              app/src/main/assets/tools/arm64-v8a/usb0-native <<'EOF'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$SELF/busybox" "$@"
          EOF
          fi

          chmod 755 \
            app/src/main/assets/tools/arm64-v8a/usb0-native

          cat > \
            app/src/main/assets/tools/arm64-v8a/manifest.txt <<EOF
          ARCH=arm64-v8a
          ANDROID_API=30
          BUSYBOX_VERSION=${BUSYBOX_VERSION}
          STATIC=NO
          SHA1_HWACCEL=NO
          SHA256_HWACCEL=NO
          TC=NO
          MOUNT=NO
          UMOUNT=NO
          PIVOT_ROOT=NO
          EOF

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew \
            clean \
            assembleDebug \
            assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find . -type f -name "*.apk" | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK produced"
            exit 1
          fi

          for APK in "${APKS[@]}"; do
            echo "Checking ${APK}"

            unzip -l "${APK}" \
              | grep -q "assets/tools/arm64-v8a/busybox"

            unzip -l "${APK}" \
              | grep -q "assets/tools/arm64-v8a/usb0-native"

            unzip -l "${APK}" \
              | grep -q "assets/tools/arm64-v8a/manifest.txt"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload BusyBox build
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-BusyBox-ARM64
          path: |
            busybox-src/busybox
            busybox-src/.config
            app/src/main/assets/tools/arm64-v8a/manifest.txt

  validate-workflow:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import sys

          directory = Path(".github/workflows")

          workflows = sorted(directory.glob("*.yml"))
          workflows += sorted(directory.glob("*.yaml"))

          if not workflows:
              print("No workflow files found")
              sys.exit(1)

          for workflow in workflows:
              text = workflow.read_text()

              forbidden = (
                  "sdkmanager tools",
                  "packages: 'tools",
                  'packages: "tools',
                  "android-actions/setup-android@v2",
                  "CONFIG_MOUNT=y",
                  "CONFIG_UMOUNT=y",
                  "CONFIG_PIVOT_ROOT=y",
                  "yes | make oldconfig",
              )

              for item in forbidden:
                  if item in text:
                      print(f"ERROR: forbidden pattern {item!r} found in {workflow}")
                      sys.exit(1)

          print("Workflow validation passed")
          PY
