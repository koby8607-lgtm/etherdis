name: Build USB0 Manager

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: "30"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  BUSYBOX_VERSION: "1.37.0"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Prepare workspace
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          chmod 755 ./gradlew
          test -x ./gradlew

          mkdir -p \
            app/src/main/assets/tools/arm64-v8a \
            third_party \
            build-tools

      - name: Download BusyBox
        shell: bash
        run: |
          set -euo pipefail

          rm -rf third_party/busybox
          mkdir -p third_party/busybox

          cd third_party/busybox

          FILE="busybox-${BUSYBOX_VERSION}.tar.bz2"
          URL="https://busybox.net/downloads/${FILE}"

          curl \
            --fail \
            --location \
            --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            "${URL}" \
            --output "${FILE}"

          test -s "${FILE}"

          tar -xjf "${FILE}"

          test -d "busybox-${BUSYBOX_VERSION}"

      - name: Configure BusyBox for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          cd "third_party/busybox/busybox-${BUSYBOX_VERSION}"

          #
          # Use BusyBox's Android configuration as the starting point.
          # BusyBox's Android configs intentionally avoid the static
          # Bionic problems encountered by generic defconfig builds.
          #
          if make android_502_defconfig; then
            echo "Using android_502_defconfig"
          elif make android_defconfig; then
            echo "Using android_defconfig"
          else
            echo "ERROR: BusyBox Android configuration target not found"
            echo "Available Android configs:"
            find configs -maxdepth 1 -type f \
              -iname '*android*' \
              -print || true
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(".config")
          text = path.read_text()

          enable = [
              "IP",
              "FEATURE_IP_LINK",
              "FEATURE_IP_ROUTE",
              "FEATURE_IP_RULE",
              "FEATURE_IP_NEIGH",
              "FEATURE_IP_ADDRESS",

              "IFCONFIG",
              "ROUTE",

              "ARP",
              "ARPING",

              "PING",
              "PING6",

              "UDHCPC",

              "MODPROBE",
              "INSMOD",
              "RMMOD",

              "SH",
              "ASH",
              "CAT",
              "CP",
              "MV",
              "RM",
              "MKDIR",
              "READLINK",
              "GREP",
              "SED",
              "AWK",
              "SLEEP",
              "DATE",
              "ENV",
              "PRINTENV",
              "UNAME",
              "KILL",
              "PS",
          ]

          disable = [
              #
              # Do not enable static linking on Android/Bionic.
              # The previous build failed because static libc.a exports
              # strchrnul through Android's dispatch object while BusyBox
              # also supplied its own implementation.
              #
              "STATIC",

              #
              # Large/unneeded networking utilities.
              #
              "TC",
              "NETSTAT",
              "TRACEROUTE",
              "TRACEROUTE6",
              "NC",
              "NCAT",
              "TELNET",
              "TELNETD",

              #
              # Unnecessary services/system utilities.
              #
              "INIT",
              "MDEV",
              "SWAPON",
              "SWAPOFF",
              "MOUNT",
              "UMOUNT",
              "FDISK",
              "FSCK",
              "BLKID",
              "CROND",
              "CRONTAB",
              "SYSLOGD",
              "KLOGD",
              "LOGIN",
              "SULOGIN",
              "SU",

              #
              # Avoid BusyBox's syslog dependency. The Android app has
              # its own logging system.
              #
              "LOGGER",
              "LOGREAD",
          ]

          def set_symbol(src, symbol, enabled):
              name = f"CONFIG_{symbol}"

              pattern = re.compile(
                  rf"^(?:{re.escape(name)}=.*|# {re.escape(name)} is not set)$",
                  re.MULTILINE,
              )

              replacement = (
                  f"{name}=y"
                  if enabled
                  else f"# {name} is not set"
              )

              if pattern.search(src):
                  return pattern.sub(replacement, src, count=1)

              return src

          for symbol in enable:
              text = set_symbol(text, symbol, True)

          for symbol in disable:
              text = set_symbol(text, symbol, False)

          #
          # Bionic exposes a number of libc functions through static
          # dispatch objects. Keep BusyBox dynamically linked and avoid
          # the duplicate strchrnul collision.
          #
          extra_ldflags = "-Wl,-z,muldefs"

          extra_pattern = re.compile(
              r'^CONFIG_EXTRA_LDFLAGS=.*$',
              re.MULTILINE,
          )

          if extra_pattern.search(text):
              text = extra_pattern.sub(
                  f'CONFIG_EXTRA_LDFLAGS="{extra_ldflags}"',
                  text,
                  count=1,
              )
          else:
              text += (
                  f'\nCONFIG_EXTRA_LDFLAGS="{extra_ldflags}"\n'
              )

          #
          # Make sure static linking is really off.
          #
          text = re.sub(
              r'^CONFIG_STATIC=.*$',
              '# CONFIG_STATIC is not set',
              text,
              flags=re.MULTILINE,
          )

          text = re.sub(
              r'^# CONFIG_STATIC is not set$',
              '# CONFIG_STATIC is not set',
              text,
              flags=re.MULTILINE,
          )

          path.write_text(text)
          PY

          #
          # Resolve BusyBox dependencies without the `yes | make oldconfig`
          # pipeline that previously caused SIGPIPE/Broken-pipe failures.
          #
          set +e
          make oldconfig < /dev/null
          status=$?
          set -e

          if [[ "${status}" -ne 0 ]]; then
            echo "ERROR: BusyBox oldconfig failed with ${status}"
            exit "${status}"
          fi

          #
          # Hard checks for the two previously failing configurations.
          #
          if grep -q '^CONFIG_STATIC=y' .config; then
            echo "ERROR: CONFIG_STATIC is enabled"
            exit 1
          fi

          if grep -q '^CONFIG_TC=y' .config; then
            echo "ERROR: CONFIG_TC is enabled"
            exit 1
          fi

          grep -E \
            '^(CONFIG_(STATIC|IP|FEATURE_IP_|IFCONFIG|ROUTE|ARP|ARPING|PING|PING6|UDHCPC|MODPROBE|INSMOD|RMMOD))=' \
            .config || true

      - name: Build BusyBox ARM64
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "${TOOLCHAIN}/aarch64-linux-android30-clang"
          test -x "${TOOLCHAIN}/llvm-ar"
          test -x "${TOOLCHAIN}/llvm-ranlib"
          test -x "${TOOLCHAIN}/llvm-strip"
          test -x "${TOOLCHAIN}/llvm-readelf"

          cd "third_party/busybox/busybox-${BUSYBOX_VERSION}"

          #
          # Remove GCC-only options inherited from CI/Bionic configs.
          #
          export CFLAGS="$(
            printf '%s' "${CFLAGS:-}" |
            sed \
              -e 's/-static-libgcc//g' \
              -e 's/-static-libstdc++//g'
          )"

          export CXXFLAGS="$(
            printf '%s' "${CXXFLAGS:-}" |
            sed \
              -e 's/-static-libgcc//g' \
              -e 's/-static-libstdc++//g'
          )"

          export LDFLAGS="$(
            printf '%s' "${LDFLAGS:-}" |
            sed \
              -e 's/-static-libgcc//g' \
              -e 's/-static-libstdc++//g'
          )"

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC="${TOOLCHAIN}/aarch64-linux-android30-clang" \
            AR="${TOOLCHAIN}/llvm-ar" \
            RANLIB="${TOOLCHAIN}/llvm-ranlib" \
            STRIP="${TOOLCHAIN}/llvm-strip" \
            HOSTCC="cc"

          test -f busybox

          #
          # Verify that this is ARM64 ELF.
          #
          "${TOOLCHAIN}/llvm-readelf" -h busybox |
            grep -q "Class:.*ELF64"

          "${TOOLCHAIN}/llvm-readelf" -h busybox |
            grep -q "Machine:.*AArch64"

          #
          # Verify it is dynamically linked for Android rather than
          # accidentally producing another broken static binary.
          #
          if "${TOOLCHAIN}/llvm-readelf" -l busybox |
            grep -q "Requesting program interpreter"; then
            echo "BusyBox has an ELF interpreter"
          else
            echo "ERROR: BusyBox does not contain an Android ELF interpreter"
            exit 1
          fi

          cp \
            busybox \
            "${GITHUB_WORKSPACE}/app/src/main/assets/tools/arm64-v8a/busybox"

          chmod 755 \
            "${GITHUB_WORKSPACE}/app/src/main/assets/tools/arm64-v8a/busybox"

      - name: Build native USB0 ARM64 helper
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p \
            app/src/main/assets/tools/arm64-v8a

          SRC=""

          if [[ -f app/src/main/cpp/usb0-native.c ]]; then
            SRC="app/src/main/cpp/usb0-native.c"
          elif [[ -f app/src/main/cpp/usb0_helper.c ]]; then
            SRC="app/src/main/cpp/usb0_helper.c"
          elif [[ -f app/src/main/cpp/native_helper.c ]]; then
            SRC="app/src/main/cpp/native_helper.c"
          fi

          if [[ -n "${SRC}" ]]; then
            "${TOOLCHAIN}/aarch64-linux-android30-clang" \
              -O2 \
              -fPIE \
              -pie \
              -DANDROID \
              -Wall \
              -Wextra \
              "${SRC}" \
              -o app/src/main/assets/tools/arm64-v8a/usb0-native

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          else
            cat > app/src/main/assets/tools/arm64-v8a/usb0-native <<'EOF'
          #!/system/bin/sh
          HERE="${0%/*}"
          exec "${HERE}/busybox" "$@"
          EOF

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          fi

      - name: Write helper manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/assets/tools/arm64-v8a/manifest.txt <<EOF
          USB0 Manager helper bundle
          ABI=arm64-v8a
          ANDROID_API=${ANDROID_API_LEVEL}
          BUSYBOX=${BUSYBOX_VERSION}
          NATIVE_HELPER=usb0-native
          LINK_MODE=dynamic-android-bionic
          EOF

      - name: Create JVM configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > ci-jvm-targets.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          gradle.projectsEvaluated {
              allprojects { project ->
                  project.tasks.configureEach { task ->

                      if (task instanceof JavaCompile) {
                          task.sourceCompatibility = "17"
                          task.targetCompatibility = "17"

                          try {
                              task.options.release.set(17)
                          } catch (Throwable ignored) {
                          }
                      }

                      if (task.class.name.contains("KotlinCompile")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Throwable ignored) {
                          }
                      }
                  }
              }
          }
          EOF

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          test -f settings.gradle || \
            test -f settings.gradle.kts

          test -f build.gradle || \
            test -f build.gradle.kts

          test -f app/src/main/assets/tools/arm64-v8a/busybox
          test -f app/src/main/assets/tools/arm64-v8a/usb0-native

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          bash ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            -I "${GITHUB_WORKSPACE}/ci-jvm-targets.gradle"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          bash ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            -I "${GITHUB_WORKSPACE}/ci-jvm-targets.gradle"

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

          found=0

          while IFS= read -r -d '' apk; do
            echo "Found APK: ${apk}"
            cp "${apk}" "artifacts/$(basename "${apk}")"
            found=1
          done < <(
            find . \
              -type f \
              -path '*/build/outputs/apk/*.apk' \
              -print0
          )

          if [[ "${found}" -eq 0 ]]; then
            echo "ERROR: No APKs produced"

            find . \
              -type f \
              -path '*/build/outputs/*' \
              -print || true

            exit 1
          fi

      - name: Verify BusyBox embedded
        shell: bash
        run: |
          set -euo pipefail

          for apk in artifacts/*.apk; do
            echo "Checking ${apk}"

            unzip -l "${apk}" |
              grep -F \
                "assets/tools/arm64-v8a/busybox"

            unzip -l "${apk}" |
              grep -F \
                "assets/tools/arm64-v8a/usb0-native"

            unzip -l "${apk}" |
              grep -F \
                "assets/tools/arm64-v8a/manifest.txt"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/**
            ~/.gradle/daemon/**
            third_party/busybox/busybox-${BUSYBOX_VERSION}/.config
            third_party/busybox/busybox-${BUSYBOX_VERSION}/.config.old
          if-no-files-found: ignore
          retention-days: 7

  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find workflow
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW=""

          for f in \
            .github/workflows/yaml.yml \
            .github/workflows/yaml.yaml \
            .github/workflows/build.yml \
            .github/workflows/build.yaml; do

            if [[ -f "${f}" ]]; then
              WORKFLOW="${f}"
              break
            fi
          done

          if [[ -z "${WORKFLOW}" ]]; then
            echo "ERROR: no workflow file found"

            find .github/workflows \
              -maxdepth 1 \
              -type f \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "Using ${WORKFLOW}"

          if grep -nE \
            'packages:.*(^|[[:space:]])tools([[:space:]]|$)|^[[:space:]]*-[[:space:]]*tools[[:space:]]*$' \
            "${WORKFLOW}" 2>/dev/null; then

            echo "ERROR: obsolete Android SDK 'tools' package detected"
            exit 1
          fi

          grep -q "BUSYBOX_VERSION" "${WORKFLOW}"
          grep -q "android_502_defconfig" "${WORKFLOW}"
          grep -q "make oldconfig" "${WORKFLOW}"
          grep -q "CONFIG_STATIC" "${WORKFLOW}"
          grep -q "bash ./gradlew" "${WORKFLOW}"

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          chmod 755 ./gradlew
          test -x ./gradlew

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            bash -n "${file}"
          done < <(
            find . \
              -type f \
              \( -name '*.sh' -o -name '*.bash' \) \
              -not -path './.git/*' \
              -print0
          )
