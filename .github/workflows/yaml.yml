name: Build USB0 Manager v1.8.1

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK_VERSION: '27.2.12479018'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./gradlew
          bash ./gradlew --version

      - name: Force stable Kotlin/Java 17 configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          if "compileOptions" not in s:
              raise SystemExit("app/build.gradle has no compileOptions block")

          if "kotlinOptions" not in s:
              insert = """
          kotlinOptions {
              jvmTarget = '17'
          }
          """
              marker = "buildFeatures"
              if marker in s:
                  s = s.replace(marker, insert + "\n    " + marker, 1)
              else:
                  s += "\n" + insert

          s = s.replace(
              "jvmTarget = '1.8'",
              "jvmTarget = '17'"
          )
          s = s.replace(
              'jvmTarget = "1.8"',
              'jvmTarget = "17"'
          )

          p.write_text(s)
          PY

          rm -f android-build-fix.gradle
          rm -f app/android-build-fix.gradle

          echo "Checking build.gradle JVM configuration:"
          grep -n -A5 -B2 -E 'compileOptions|kotlinOptions|jvmTarget' app/build.gradle || true

      - name: Normalize Kotlin sources for Android API 30
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          # MainActivity.kt
          p = Path("app/src/main/java/com/r36s/usb0manager/MainActivity.kt")
          if p.exists():
              s = p.read_text()

              s = s.replace(
                  "singleLine = true",
                  "isSingleLine = true"
              )

              s = s.replace(
                  'minimumHeight = dp(42)',
                  'minHeight = dp(42)'
              )

              p.write_text(s)

          # MonitorService.kt
          p = Path("app/src/main/java/com/r36s/usb0manager/MonitorService.kt")
          if p.exists():
              s = p.read_text()

              old = '''    private fun runHelper(command: String): String = try {
        val helper = HelperManager.install(this).helper
        val q = "'${helper.absolutePath.replace("'", "'\\\\''")}' $command"
        var last = "no su"
        for (su in listOf("/system/xbin/su", "/system/bin/su", "/vendor/bin/su", "su")) {
            try {
                val p = Runtime.getRuntime().exec(arrayOf(su, "-c", q))
                val out = p.inputStream.bufferedReader().readText()
                val err = p.errorStream.bufferedReader().readText()
                p.waitFor()
                if (p.exitValue() == 0 || out.isNotBlank()) return out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""
                last = err.ifBlank { "su exit=${p.exitValue()}" }
            } catch (e: Exception) {
                last = e.message ?: "su failed"
            }
        }
        "root-error=$last"
    } catch (e: Exception) {
        "root-error=${e.message}"
    }
          '''

              # Rebuild the function explicitly as a block body so bare returns
              # cannot become expression-body return errors.
              start = s.find("    private fun runHelper(command: String)")
              if start >= 0:
                  end = s.find("\n    private fun appendEvent", start)
                  if end >= 0:
                      replacement = '''    private fun runHelper(command: String): String {
        return try {
            val helper = HelperManager.install(this).helper
            val q = "'${helper.absolutePath.replace("'", "'\\\\''")}' $command"
            var last = "no su"

            for (su in listOf("/system/xbin/su", "/system/bin/su", "/vendor/bin/su", "su")) {
                try {
                    val process = Runtime.getRuntime().exec(arrayOf(su, "-c", q))
                    val out = process.inputStream.bufferedReader().readText()
                    val err = process.errorStream.bufferedReader().readText()
                    process.waitFor()

                    if (process.exitValue() == 0 || out.isNotBlank()) {
                        return out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""
                    }

                    last = err.ifBlank { "su exit=${process.exitValue()}" }
                } catch (e: Exception) {
                    last = e.message ?: "su failed"
                }
            }

            "root-error=$last"
        } catch (e: Exception) {
            "root-error=${e.message}"
        }
    }
                      '''
                      s = s[:start] + replacement + s[end:]

              p.write_text(s)

          PY

          echo "Kotlin source normalization complete."

      - name: Build real ARM64 usb0-native
        shell: bash
        run: |
          set -euo pipefail

          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          mkdir -p app/src/main/assets/tools/arm64-v8a

          "$CLANG" \
            -O2 \
            -fPIE \
            -fstack-protector-strong \
            -DANDROID \
            -D__ANDROID_API__=30 \
            -pie \
            app/src/main/cpp/usb0-native.c \
            -o app/src/main/assets/tools/arm64-v8a/usb0-native

          "$STRIP" app/src/main/assets/tools/arm64-v8a/usb0-native || true
          chmod 755 app/src/main/assets/tools/arm64-v8a/usb0-native

          file app/src/main/assets/tools/arm64-v8a/usb0-native

          "$READELF" -h app/src/main/assets/tools/arm64-v8a/usb0-native |
            grep -E 'Class:|Machine:|Type:'

      - name: Build and bundle BusyBox ARM64
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 scripts/build-busybox.sh
          ./scripts/build-busybox.sh

      - name: Verify bundled tools
        shell: bash
        run: |
          set -euo pipefail

          for f in \
            app/src/main/assets/tools/arm64-v8a/usb0-native \
            app/src/main/assets/tools/arm64-v8a/usb0-helper \
            app/src/main/assets/tools/arm64-v8a/usb0-helper.sh \
            app/src/main/assets/tools/arm64-v8a/busybox \
            app/src/main/assets/r36s/lineageos_r36s_defconfig.txt \
            app/src/main/assets/r36s/kernel-capabilities.txt
          do
            test -s "$f"
            echo "OK: $f"
          done

          file app/src/main/assets/tools/arm64-v8a/usb0-native
          file app/src/main/assets/tools/arm64-v8a/busybox

      - name: Create CI signing key
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/usb0-manager-release.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias usb0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=USB0 Manager, OU=R36S, O=USB0 Manager, L=R36S, ST=R36S, C=GB" \
            -noprompt

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' f; do
            echo "Checking $f"
            bash -n "$f"
          done < <(find scripts app/src/main/assets -type f -name '*.sh' -print0)

      - name: Compile Kotlin with full diagnostics
        shell: bash
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/kotlin-build.log"

          bash ./gradlew \
            :app:compileDebugKotlin \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$LOG"

          rc=${PIPESTATUS[0]}

          echo
          echo "===== KOTLIN COMPILER DIAGNOSTICS ====="

          grep -E \
            '(^e: |^w: |error:|warning:|\.kt:[0-9]+:[0-9]+)' \
            "$LOG" || true

          echo "===== END KOTLIN COMPILER DIAGNOSTICS ====="

          exit "$rc"

      - name: Build debug APK
        shell: bash
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/debug-build.log"

          bash ./gradlew \
            assembleDebug \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$LOG"

          rc=${PIPESTATUS[0]}

          echo
          echo "===== BUILD ERRORS ====="

          grep -E \
            '(^e: |error:|FAILED|Exception:|\.kt:[0-9]+:[0-9]+)' \
            "$LOG" || true

          echo "===== END BUILD ERRORS ====="

          exit "$rc"

      - name: Build release APK
        shell: bash
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/release-build.log"

          bash ./gradlew \
            assembleRelease \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/usb0-manager-release.jks" \
            -PRELEASE_STORE_PASSWORD=changeit \
            -PRELEASE_KEY_ALIAS=usb0 \
            -PRELEASE_KEY_PASSWORD=changeit \
            2>&1 | tee "$LOG"

          rc=${PIPESTATUS[0]}

          echo
          echo "===== RELEASE BUILD ERRORS ====="

          grep -E \
            '(^e: |error:|FAILED|Exception:|\.kt:[0-9]+:[0-9]+)' \
            "$LOG" || true

          echo "===== END RELEASE BUILD ERRORS ====="

          exit "$rc"

      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          for apk in \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk
          do
            [ -f "$apk" ] || continue

            echo "Checking $apk"

            "$APKSIGNER" verify --verbose "$apk"

            unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/busybox'
            unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/usb0-native'
            unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/usb0-helper'
            unzip -l "$apk" | grep -F 'assets/tools/arm64-v8a/usb0-helper.sh'

            unzip -p "$apk" assets/tools/arm64-v8a/busybox | file -
            unzip -p "$apk" assets/tools/arm64-v8a/usb0-native | file -
          done

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp app/build/outputs/apk/debug/*.apk artifacts/
          cp app/build/outputs/apk/release/*.apk artifacts/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.8.1
          path: artifacts/*.apk
          retention-days: 30

      - name: Publish release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload complete diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.8.1-diagnostics
          path: |
            ${{ runner.temp }}/kotlin-build.log
            ${{ runner.temp }}/debug-build.log
            ${{ runner.temp }}/release-build.log
            app/build/reports/**
            app/build/outputs/**
          if-no-files-found: ignore
          retention-days: 7
