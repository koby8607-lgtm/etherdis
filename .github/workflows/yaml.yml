name: Build USB0 Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  BUSYBOX_VERSION: "1.37.0"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            binutils \
            clang \
            curl \
            file \
            make \
            python3 \
            unzip \
            zip

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew --version

      - name: Fix MonitorService Kotlin compile error
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/r36s/usb0manager/MonitorService.kt"

          test -f "${FILE}"

          python3 - "${FILE}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          old = (
              'if (p.exitValue() == 0 || out.isNotBlank()) '
              'return out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""'
          )

          new = (
              'if (p.exitValue() == 0 || out.isNotBlank()) '
              'return@runHelper out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""'
          )

          if old in text:
              text = text.replace(old, new, 1)

          if 'return@runHelper out +' not in text:
              raise SystemExit(
                  "ERROR: runHelper return statement was not fixed"
              )

          path.write_text(text)
          PY

          grep -Fq "return@runHelper out +" "${FILE}"

      - name: Build ARM64 usb0-native
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_NDK_ROOT}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p app/src/main/assets/tools/arm64-v8a

          "${TOOLCHAIN}/aarch64-linux-android30-clang" \
            -O2 \
            -fPIE \
            -fstack-protector-strong \
            -DANDROID \
            -D__ANDROID_API__=30 \
            -pie \
            app/src/main/cpp/usb0-native.c \
            -o app/src/main/assets/tools/arm64-v8a/usb0-native

          "${TOOLCHAIN}/llvm-strip" \
            app/src/main/assets/tools/arm64-v8a/usb0-native || true

          chmod 755 \
            app/src/main/assets/tools/arm64-v8a/usb0-native

          file \
            app/src/main/assets/tools/arm64-v8a/usb0-native

      - name: Replace BusyBox build script
        shell: bash
        run: |
          set -euo pipefail

          cat > scripts/build-busybox.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          VERSION="${BUSYBOX_VERSION:-1.37.0}"
          WORK="${RUNNER_TEMP:-/tmp}/usb0-busybox"
          SRC="${WORK}/busybox-${VERSION}"
          OUT="app/src/main/assets/tools/arm64-v8a/busybox"

          NDK="${ANDROID_NDK_ROOT:-${ANDROID_HOME}/ndk/27.2.12479018}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="${TOOLCHAIN}/aarch64-linux-android30-clang"
          STRIP="${TOOLCHAIN}/llvm-strip"
          AR="$(command -v ar)"
          RANLIB="$(command -v ranlib)"

          rm -rf "${WORK}"
          mkdir -p "${WORK}"

          curl -fsSL --retry 5 \
            "https://busybox.net/downloads/busybox-${VERSION}.tar.bz2" \
            -o "${WORK}/busybox.tar.bz2"

          tar -xjf "${WORK}/busybox.tar.bz2" -C "${WORK}"

          cd "${SRC}"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("libbb/hash_md5_sha.c")
          text = p.read_text()

          target = "sha1_process_block64_shaNI"

          if target in text:
              lines = text.splitlines()

              for i, line in enumerate(lines):
                  if target not in line:
                      continue

                  nearby = "\n".join(
                      lines[max(0, i - 5):min(len(lines), i + 6)]
                  )

                  if "defined(__i386__)" not in nearby:
                      indent = line[:len(line) - len(line.lstrip())]

                      lines.insert(
                          i,
                          indent
                          + "#if defined(__GNUC__) && "
                          "(defined(__i386__) || defined(__x86_64__))"
                      )

                      lines.insert(
                          i + 2,
                          indent + "#endif"
                      )

                      p.write_text("\n".join(lines) + "\n")

                  break
          PY

          make allnoconfig

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".config")
          lines = path.read_text().splitlines()

          wanted = {
              "CONFIG_ASH": "y",
              "CONFIG_ASH_OPTIMIZE_FOR_SIZE": "y",
              "CONFIG_FEATURE_SH_STANDALONE": "y",

              "CONFIG_CAT": "y",
              "CONFIG_CHMOD": "y",
              "CONFIG_CP": "y",
              "CONFIG_CUT": "y",
              "CONFIG_ECHO": "y",
              "CONFIG_ENV": "y",
              "CONFIG_GREP": "y",
              "CONFIG_HEAD": "y",
              "CONFIG_KILL": "y",
              "CONFIG_LS": "y",
              "CONFIG_MKDIR": "y",
              "CONFIG_MV": "y",
              "CONFIG_PRINTF": "y",
              "CONFIG_PS": "y",
              "CONFIG_PWD": "y",
              "CONFIG_READLINK": "y",
              "CONFIG_RM": "y",
              "CONFIG_SLEEP": "y",
              "CONFIG_SORT": "y",
              "CONFIG_STAT": "y",
              "CONFIG_TAIL": "y",
              "CONFIG_TEST": "y",
              "CONFIG_TOUCH": "y",
              "CONFIG_TR": "y",
              "CONFIG_UNAME": "y",
              "CONFIG_WC": "y",

              "CONFIG_IP": "y",
              "CONFIG_FEATURE_IP_ADDRESS": "y",
              "CONFIG_FEATURE_IP_LINK": "y",
              "CONFIG_FEATURE_IP_ROUTE": "y",
              "CONFIG_FEATURE_IP_RULE": "y",
              "CONFIG_FEATURE_IP_NEIGH": "y",
              "CONFIG_FEATURE_IP_TUNNEL": "y",
              "CONFIG_FEATURE_IP_SHORT_FORMS": "y",

              "CONFIG_IFCONFIG": "y",
              "CONFIG_FEATURE_IFCONFIG_HW": "y",
              "CONFIG_ROUTE": "y",
              "CONFIG_ARP": "y",
              "CONFIG_ARPING": "y",
              "CONFIG_PING": "y",
              "CONFIG_PING6": "y",
              "CONFIG_UDHCPC": "y",
              "CONFIG_UDHCPC_DEFAULT_SCRIPT": "y",

              "CONFIG_MODPROBE": "y",
              "CONFIG_INSMOD": "y",
              "CONFIG_RMMOD": "y",
              "CONFIG_DMESG": "y",

              "CONFIG_STATIC": "n",
              "CONFIG_SHA1_HWACCEL": "n",
              "CONFIG_SHA256_HWACCEL": "n",
              "CONFIG_TC": "n",

              "CONFIG_HOSTID": "n",
              "CONFIG_NETSTAT": "n",
              "CONFIG_TRACEROUTE": "n",
              "CONFIG_NC": "n",

              "CONFIG_MOUNT": "n",
              "CONFIG_UMOUNT": "n",
              "CONFIG_PIVOT_ROOT": "n",
              "CONFIG_SWAPONOFF": "n",
              "CONFIG_LOSETUP": "n",
              "CONFIG_READAHEAD": "n",
              "CONFIG_SETSERIAL": "n",
              "CONFIG_FSTRIM": "n",
              "CONFIG_BLOCKDEV": "n",
              "CONFIG_EJECT": "n",

              "CONFIG_TAR": "n",
              "CONFIG_GZIP": "n",
              "CONFIG_BZIP2": "n",
              "CONFIG_XZ": "n",
              "CONFIG_CPIO": "n",
              "CONFIG_AR": "n",
              "CONFIG_UNZIP": "n",

              "CONFIG_FEATURE_USE_BSS_TAIL": "n",
              "CONFIG_FLOAT_DURATION": "n",
              "CONFIG_FEATURE_RTMINMAX": "n",
              "CONFIG_FEATURE_BUFFERS_GO_ON_STACK": "n",
              "CONFIG_FEATURE_BUFFERS_USE_MALLOC": "n",
              "CONFIG_FEATURE_BUFFERS_GO_IN_BSS": "y",
          }

          def emit(key, value):
              if value == "n":
                  return f"# {key} is not set"
              return f"{key}={value}"

          out = []
          seen = set()

          for line in lines:
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]

                  if key in wanted:
                      out.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              if (
                  line.startswith("# CONFIG_")
                  and line.endswith(" is not set")
              ):
                  key = line[2:-11]

                  if key in wanted:
                      out.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              out.append(line)

          for key, value in wanted.items():
              if key not in seen:
                  out.append(emit(key, value))

          path.write_text("\n".join(out) + "\n")
          PY

          set +e

          yes "" | make oldconfig > /tmp/busybox-oldconfig.log 2>&1

          pipe_status=("${PIPESTATUS[@]}")
          make_rc="${pipe_status[1]}"

          set -e

          cat /tmp/busybox-oldconfig.log

          if [ "${make_rc}" -ne 0 ]; then
              echo "BusyBox oldconfig failed with exit code ${make_rc}"
              exit "${make_rc}"
          fi

          if grep -Eq \
              '^CONFIG_(MOUNT|UMOUNT|PIVOT_ROOT)=y$' \
              .config; then
              echo "ERROR: Android-incompatible mount applet enabled"
              exit 1
          fi

          make V=1 -j1 \
            CC="${CC}" \
            HOSTCC="cc" \
            AR="${AR}" \
            RANLIB="${RANLIB}" \
            STRIP="${STRIP}" \
            CFLAGS="-Os -fPIE -D__ANDROID_API__=30" \
            LDFLAGS="-pie"

          test -x busybox

          mkdir -p "$(dirname "${OUT}")"

          cp busybox "${OUT}"
          chmod 755 "${OUT}"

          "${STRIP}" "${OUT}" || true

          file "${OUT}"

          "${TOOLCHAIN}/llvm-readelf" -h "${OUT}" \
            | grep -E "Class:|Machine:|Type:"

          for applet in \
              ip \
              arp \
              arping \
              ifconfig \
              route \
              udhcpc \
              ping \
              ps \
              ls \
              readlink \
              modprobe \
              insmod; do

              "${OUT}" --list | grep -qx "${applet}" || {
                  echo "Missing BusyBox applet: ${applet}"
                  exit 1
              }
          done
          SCRIPT

          chmod 755 scripts/build-busybox.sh
          bash -n scripts/build-busybox.sh

      - name: Build BusyBox ARM64
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/build-busybox.sh

      - name: Verify embedded tools
        shell: bash
        run: |
          set -euo pipefail

          test -s app/src/main/assets/tools/arm64-v8a/busybox
          test -s app/src/main/assets/tools/arm64-v8a/usb0-native
          test -s app/src/main/assets/tools/arm64-v8a/usb0-helper
          test -s app/src/main/assets/tools/arm64-v8a/usb0-helper.sh

          file app/src/main/assets/tools/arm64-v8a/busybox
          file app/src/main/assets/tools/arm64-v8a/usb0-native

      - name: Create CI signing key
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "${RUNNER_TEMP}/usb0-manager-release.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias usb0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=USB0 Manager, OU=R36S, O=USB0 Manager, L=R36S, ST=R36S, C=GB" \
            -noprompt

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            bash -n "${file}"
          done < <(
            find scripts app/src/main/assets \
              -type f \
              -name "*.sh" \
              -print0
          )

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          bash ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          bash ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            -PRELEASE_STORE_FILE="${RUNNER_TEMP}/usb0-manager-release.jks" \
            -PRELEASE_STORE_PASSWORD=changeit \
            -PRELEASE_KEY_ALIAS=usb0 \
            -PRELEASE_KEY_PASSWORD=changeit

      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          for apk in \
              app/build/outputs/apk/debug/*.apk \
              app/build/outputs/apk/release/*.apk; do

              [ -f "${apk}" ] || continue

              echo "Checking ${apk}"

              "${APKSIGNER}" verify "${apk}"

              unzip -l "${apk}" \
                | grep -F \
                  "assets/tools/arm64-v8a/busybox"

              unzip -l "${apk}" \
                | grep -F \
                  "assets/tools/arm64-v8a/usb0-native"

              unzip -l "${apk}" \
                | grep -F \
                  "assets/tools/arm64-v8a/usb0-helper.sh"
          done

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp \
            app/build/outputs/apk/debug/*.apk \
            artifacts/

          cp \
            app/build/outputs/apk/release/*.apk \
            artifacts/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.8.1
          path: artifacts/*.apk
          retention-days: 30

      - name: Publish release APKs on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.8.1-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/**
            /tmp/busybox-oldconfig.log
            ~/.gradle/daemon/**
          if-no-files-found: ignore
          retention-days: 7
