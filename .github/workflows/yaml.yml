name: Build USB0 Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: "30"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  BUSYBOX_VERSION: "1.37.0"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            binutils \
            clang \
            curl \
            file \
            make \
            python3 \
            unzip \
            zip

      - name: Fix Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew
          bash ./gradlew --version

      - name: Fix MonitorService Kotlin source
        shell: bash
        run: |
          set -euo pipefail

          file="app/src/main/java/com/r36s/usb0manager/MonitorService.kt"

          test -f "$file"

          python3 - "$file" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          bad = 'return out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""'
          good = 'return@runHelper out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""'

          if good not in s and bad in s:
              s = s.replace(bad, good, 1)

          if good not in s:
              marker = "private fun runHelper(command: String): String = try"

              if marker in s:
                  s = s.replace(
                      marker,
                      "private fun runHelper(command: String): String {\n"
                      "        return try",
                      1
                  )

          p.write_text(s)

          final = p.read_text()

          if bad in final:
              raise SystemExit("Bare return still exists in runHelper()")

          if marker in final:
              raise SystemExit("Expression-body runHelper() still exists")

          print("MonitorService Kotlin fix verified.")
          PY

      - name: Prepare embedded tools
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets/tools/arm64-v8a

      - name: Build usb0-native
        shell: bash
        run: |
          set -euo pipefail

          toolchain="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          source_file=""

          if [ -f app/src/main/cpp/usb0-native.c ]; then
            source_file="app/src/main/cpp/usb0-native.c"
          elif [ -f app/src/main/cpp/usb0-native.cpp ]; then
            source_file="app/src/main/cpp/usb0-native.cpp"
          fi

          if [ -n "$source_file" ]; then
            if [[ "$source_file" == *.cpp ]]; then
              "${toolchain}/aarch64-linux-android30-clang++" \
                -O2 \
                -fPIE \
                -fstack-protector-strong \
                -DANDROID \
                -pie \
                "$source_file" \
                -o app/src/main/assets/tools/arm64-v8a/usb0-native
            else
              "${toolchain}/aarch64-linux-android30-clang" \
                -O2 \
                -fPIE \
                -fstack-protector-strong \
                -DANDROID \
                -pie \
                "$source_file" \
                -o app/src/main/assets/tools/arm64-v8a/usb0-native
            fi

            "${toolchain}/llvm-strip" \
              app/src/main/assets/tools/arm64-v8a/usb0-native || true
          else
            cat > app/src/main/assets/tools/arm64-v8a/usb0-native <<'SH'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$SELF/busybox" "$@"
          SH
          fi

          chmod 755 app/src/main/assets/tools/arm64-v8a/usb0-native

      - name: Build BusyBox
        shell: bash
        run: |
          set -euo pipefail

          root="$PWD"
          work="${RUNNER_TEMP}/usb0-busybox"
          source_dir="${work}/busybox-${BUSYBOX_VERSION}"
          output_dir="${root}/app/src/main/assets/tools/arm64-v8a"
          toolchain="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          rm -rf "$work"
          mkdir -p "$work" "$output_dir"

          curl -fsSL --retry 5 \
            "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2" \
            -o "${work}/busybox.tar.bz2"

          tar -xjf "${work}/busybox.tar.bz2" -C "$work"

          cd "$source_dir"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("libbb/hash_md5_sha.c")
          s = p.read_text()

          needle = "sha1_process_block64_shaNI"

          if needle in s:
              lines = s.splitlines()

              for i, line in enumerate(lines):
                  if needle not in line:
                      continue

                  nearby = "\n".join(
                      lines[max(0, i - 6):min(len(lines), i + 6)]
                  )

                  if "defined(__i386__)" not in nearby:
                      indent = line[:len(line) - len(line.lstrip())]

                      lines.insert(
                          i,
                          indent
                          + "#if defined(__GNUC__) && "
                          "(defined(__i386__) || defined(__x86_64__))"
                      )

                      lines.insert(
                          i + 2,
                          indent + "#endif"
                      )

                      p.write_text("\n".join(lines) + "\n")

                  break
          PY

          make allnoconfig

          python3 - <<'PY'
          from pathlib import Path

          p = Path(".config")
          lines = p.read_text().splitlines()

          wanted = {
              "CONFIG_ASH": "y",
              "CONFIG_ASH_OPTIMIZE_FOR_SIZE": "y",
              "CONFIG_FEATURE_SH_STANDALONE": "y",

              "CONFIG_CAT": "y",
              "CONFIG_CHMOD": "y",
              "CONFIG_CP": "y",
              "CONFIG_ECHO": "y",
              "CONFIG_ENV": "y",
              "CONFIG_GREP": "y",
              "CONFIG_HEAD": "y",
              "CONFIG_KILL": "y",
              "CONFIG_LS": "y",
              "CONFIG_MKDIR": "y",
              "CONFIG_MV": "y",
              "CONFIG_PRINTF": "y",
              "CONFIG_PS": "y",
              "CONFIG_PWD": "y",
              "CONFIG_READLINK": "y",
              "CONFIG_RM": "y",
              "CONFIG_SLEEP": "y",
              "CONFIG_SORT": "y",
              "CONFIG_STAT": "y",
              "CONFIG_SYNC": "y",
              "CONFIG_TAIL": "y",
              "CONFIG_TEST": "y",
              "CONFIG_TOUCH": "y",
              "CONFIG_TR": "y",
              "CONFIG_UNAME": "y",
              "CONFIG_WC": "y",

              "CONFIG_IP": "y",
              "CONFIG_FEATURE_IP_ADDRESS": "y",
              "CONFIG_FEATURE_IP_LINK": "y",
              "CONFIG_FEATURE_IP_ROUTE": "y",
              "CONFIG_FEATURE_IP_RULE": "y",
              "CONFIG_FEATURE_IP_NEIGH": "y",
              "CONFIG_FEATURE_IP_TUNNEL": "y",
              "CONFIG_FEATURE_IP_SHORT_FORMS": "y",

              "CONFIG_ARP": "y",
              "CONFIG_UDHCPC": "y",
              "CONFIG_UDHCPC_DEFAULT_SCRIPT": "y",
              "CONFIG_PING": "y",

              "CONFIG_MODPROBE": "y",
              "CONFIG_INSMOD": "y",
              "CONFIG_RMMOD": "y",

              "CONFIG_DMESG": "y",

              "CONFIG_STATIC": "n",
              "CONFIG_SHA1_HWACCEL": "n",
              "CONFIG_SHA256_HWACCEL": "n",

              "CONFIG_IFCONFIG": "n",
              "CONFIG_ROUTE": "n",
              "CONFIG_ARPING": "n",
              "CONFIG_PING6": "n",

              "CONFIG_TC": "n",
              "CONFIG_HOSTID": "n",
              "CONFIG_NETSTAT": "n",
              "CONFIG_TRACEROUTE": "n",
              "CONFIG_NC": "n",

              "CONFIG_MOUNT": "n",
              "CONFIG_UMOUNT": "n",
              "CONFIG_PIVOT_ROOT": "n",
              "CONFIG_SWAPONOFF": "n",
              "CONFIG_LOSETUP": "n",
              "CONFIG_READAHEAD": "n",
              "CONFIG_SETSERIAL": "n",
              "CONFIG_FSTRIM": "n",
              "CONFIG_BLOCKDEV": "n",
              "CONFIG_EJECT": "n",

              "CONFIG_TAR": "n",
              "CONFIG_GZIP": "n",
              "CONFIG_BZIP2": "n",
              "CONFIG_XZ": "n",
              "CONFIG_CPIO": "n",
              "CONFIG_AR": "n",
              "CONFIG_UNZIP": "n",

              "CONFIG_FEATURE_USE_BSS_TAIL": "n",
              "CONFIG_FLOAT_DURATION": "n",
              "CONFIG_FEATURE_RTMINMAX": "n",
              "CONFIG_FEATURE_BUFFERS_GO_ON_STACK": "n",
              "CONFIG_FEATURE_BUFFERS_USE_MALLOC": "n",
              "CONFIG_FEATURE_BUFFERS_GO_IN_BSS": "y",
          }

          def emit(k, v):
              if v == "n":
                  return f"# {k} is not set"
              return f"{k}={v}"

          output = []
          seen = set()

          for line in lines:
              key = None

              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]
              elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  key = line[2:-11]

              if key in wanted:
                  output.append(emit(key, wanted[key]))
                  seen.add(key)
              else:
                  output.append(line)

          for key, value in wanted.items():
              if key not in seen:
                  output.append(emit(key, value))

          p.write_text("\n".join(output) + "\n")
          PY

          set +e
          yes "" | make oldconfig > "${work}/oldconfig.log" 2>&1
          statuses=("${PIPESTATUS[@]}")
          make_rc="${statuses[1]}"
          set -e

          cat "${work}/oldconfig.log"

          if [ "$make_rc" -ne 0 ]; then
            echo "BusyBox oldconfig failed with exit code $make_rc"
            exit "$make_rc"
          fi

          for symbol in \
              CONFIG_IFCONFIG \
              CONFIG_ROUTE \
              CONFIG_ARPING \
              CONFIG_PING6 \
              CONFIG_MOUNT \
              CONFIG_UMOUNT \
              CONFIG_PIVOT_ROOT; do

            if grep -Eq "^${symbol}=y$" .config; then
              echo "Forbidden ${symbol}=y"
              exit 1
            fi
          done

          for symbol in \
              CONFIG_IP \
              CONFIG_ARP \
              CONFIG_UDHCPC \
              CONFIG_PING; do

            if ! grep -Eq "^${symbol}=y$" .config; then
              echo "Missing required ${symbol}=y"
              exit 1
            fi
          done

          export CC="${toolchain}/aarch64-linux-android30-clang"
          export HOSTCC="cc"
          export AR="$(command -v ar)"
          export RANLIB="$(command -v ranlib)"
          export STRIP="${toolchain}/llvm-strip"

          # Do not define __ANDROID_API__ manually.
          # The Android target compiler already supplies it.
          export CFLAGS="-Os -fPIE"
          export LDFLAGS="-pie"

          make V=1 -j1 \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            AR="${AR}" \
            RANLIB="${RANLIB}" \
            STRIP="${STRIP}" \
            CFLAGS="${CFLAGS}" \
            LDFLAGS="${LDFLAGS}"

          test -f busybox
          test -f include/autoconf.h

          # Never execute the AArch64 target binary on the x86_64 GitHub runner.
          for symbol in IP ARP UDHCPC PING; do
            grep -Eq "^#define ENABLE_${symbol} 1$" include/autoconf.h || {
              echo "Missing BusyBox applet ${symbol}"
              exit 1
            }
          done

          for symbol in IFCONFIG ROUTE ARPING PING6; do
            if grep -Eq "^#define ENABLE_${symbol} 1$" include/autoconf.h; then
              echo "Forbidden BusyBox applet ${symbol} was compiled"
              exit 1
            fi
          done

          cp busybox "${output_dir}/busybox"
          chmod 755 "${output_dir}/busybox"
          "${STRIP}" "${output_dir}/busybox" || true

          file "${output_dir}/busybox"

          "${toolchain}/llvm-readelf" -h "${output_dir}/busybox" \
            | grep -Eq "Class:.*ELF64"

          "${toolchain}/llvm-readelf" -h "${output_dir}/busybox" \
            | grep -Eq "Machine:.*AArch64"

          "${toolchain}/llvm-readelf" -l "${output_dir}/busybox" \
            | grep -q "Requesting program interpreter"

      - name: Install helper files
        shell: bash
        run: |
          set -euo pipefail

          dir="app/src/main/assets/tools/arm64-v8a"

          cat > "${dir}/usb0-helper.sh" <<'SH'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "${SELF}/busybox" "$@"
          SH

          cat > "${dir}/usb0-helper" <<'SH'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "${SELF}/busybox" "$@"
          SH

          chmod 755 \
            "${dir}/usb0-helper.sh" \
            "${dir}/usb0-helper"

          cat > "${dir}/manifest.txt" <<EOF
          ARCH=arm64-v8a
          ANDROID_API=${ANDROID_API_LEVEL}
          BUSYBOX_VERSION=${BUSYBOX_VERSION}
          STATIC=NO
          IP=YES
          ARP=YES
          UDHCPC=YES
          PING=YES
          IFCONFIG=NO
          ROUTE=NO
          ARPING=NO
          PING6=NO
          MOUNT=NO
          UMOUNT=NO
          PIVOT_ROOT=NO
          TARGET_BINARY_MUST_NOT_RUN_ON_CI=YES
          EOF

      - name: Verify embedded files
        shell: bash
        run: |
          set -euo pipefail

          dir="app/src/main/assets/tools/arm64-v8a"

          test -s "${dir}/busybox"
          test -s "${dir}/usb0-native"
          test -s "${dir}/usb0-helper"
          test -s "${dir}/usb0-helper.sh"
          test -s "${dir}/manifest.txt"

          file "${dir}/busybox"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t apks < <(
            find app/build/outputs \
              -type f \
              -name "*.apk" \
              | sort
          )

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "ERROR: no APK produced"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            echo "Checking ${apk}"

            unzip -l "${apk}" \
              | grep -q \
                "assets/tools/arm64-v8a/busybox"

            unzip -l "${apk}" \
              | grep -q \
                "assets/tools/arm64-v8a/usb0-native"

            unzip -l "${apk}" \
              | grep -q \
                "assets/tools/arm64-v8a/usb0-helper.sh"

            unzip -l "${apk}" \
              | grep -q \
                "assets/tools/arm64-v8a/manifest.txt"

            echo "Verified ${apk}"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload BusyBox
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-BusyBox-ARM64
          path: |
            app/src/main/assets/tools/arm64-v8a/busybox
            app/src/main/assets/tools/arm64-v8a/manifest.txt
          if-no-files-found: error
          retention-days: 30

  verify:
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: USB0-Manager-APK
          path: verified-apks

      - name: Verify build job output
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t apks < <(
            find verified-apks \
              -type f \
              -name "*.apk" \
              | sort
          )

          if [ "${#apks[@]}" -eq 0 ]; then
            echo "ERROR: no APK received from build job"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            echo "Received: ${apk}"
            file "${apk}"
          done

  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          files = sorted(Path(".github/workflows").glob("*.yml"))
          files += sorted(Path(".github/workflows").glob("*.yaml"))

          if not files:
              raise SystemExit("No workflow files found")

          forbidden = (
              "sdkmanager tools",
              "packages: 'tools",
              'packages: "tools',
              "android-actions/setup-android@v2",
              "android-build-fix.gradle",
              "busybox --list",
              "CONFIG_MOUNT=y",
              "CONFIG_UMOUNT=y",
              "CONFIG_PIVOT_ROOT=y",
          )

          for path in files:
              text = path.read_text()

              for pattern in forbidden:
                  if pattern in text:
                      raise SystemExit(
                          f"Forbidden pattern {pattern!r} found in {path}"
                      )

              print(f"Validated {path}")

          print("All workflow files passed validation.")
          PY
