name: Build USB0 Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: "30"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  BUSYBOX_VERSION: "1.37.0"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install build packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            binutils \
            clang \
            curl \
            file \
            make \
            python3 \
            unzip \
            zip

      - name: Fix Gradle wrapper permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./gradlew
          bash ./gradlew --version

      - name: Fix MonitorService Kotlin compile error
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/r36s/usb0manager/MonitorService.kt"

          if [ ! -f "${FILE}" ]; then
            echo "ERROR: ${FILE} not found"
            exit 1
          fi

          python3 - "${FILE}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          target = (
              'if (p.exitValue() == 0 || out.isNotBlank()) '
              'return out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""'
          )

          fixed = (
              'if (p.exitValue() == 0 || out.isNotBlank()) '
              'return@runHelper out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""'
          )

          if fixed in text:
              print("MonitorService already fixed.")
          elif target in text:
              text = text.replace(target, fixed, 1)
              path.write_text(text)
              print("MonitorService return fixed.")
          else:
              marker = "private fun runHelper(command: String): String = try"

              if marker in text:
                  text = text.replace(
                      marker,
                      "private fun runHelper(command: String): String {\\n"
                      "        return try",
                      1
                  )

                  path.write_text(text)
                  print("MonitorService expression body converted.")
              else:
                  raise SystemExit(
                      "ERROR: could not locate runHelper()"
                  )
          PY

          if grep -Fq \
            "return out + if (err.isNotBlank())" \
            "${FILE}"; then
            echo "ERROR: invalid bare return still exists"
            exit 1
          fi

      - name: Prepare embedded tool directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets/tools/arm64-v8a

      - name: Build ARM64 usb0-native when source exists
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_NDK_ROOT}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          SOURCE=""

          if [ -f app/src/main/cpp/usb0-native.c ]; then
            SOURCE="app/src/main/cpp/usb0-native.c"
          elif [ -f app/src/main/cpp/usb0-native.cpp ]; then
            SOURCE="app/src/main/cpp/usb0-native.cpp"
          fi

          if [ -n "${SOURCE}" ]; then
            if [[ "${SOURCE}" == *.cpp ]]; then
              "${TOOLCHAIN}/aarch64-linux-android30-clang++" \
                -O2 \
                -fPIE \
                -fstack-protector-strong \
                -DANDROID \
                -D__ANDROID_API__=30 \
                -pie \
                "${SOURCE}" \
                -o app/src/main/assets/tools/arm64-v8a/usb0-native
            else
              "${TOOLCHAIN}/aarch64-linux-android30-clang" \
                -O2 \
                -fPIE \
                -fstack-protector-strong \
                -DANDROID \
                -D__ANDROID_API__=30 \
                -pie \
                "${SOURCE}" \
                -o app/src/main/assets/tools/arm64-v8a/usb0-native
            fi

            "${TOOLCHAIN}/llvm-strip" \
              app/src/main/assets/tools/arm64-v8a/usb0-native || true

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          else
            cat > app/src/main/assets/tools/arm64-v8a/usb0-native <<'EOF'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$SELF/busybox" "$@"
          EOF

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          fi

      - name: Create BusyBox build script
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p scripts

          cat > scripts/build-busybox.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          REPO_ROOT="$(CDPATH= cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"

          VERSION="${BUSYBOX_VERSION:-1.37.0}"
          WORK="${RUNNER_TEMP:-/tmp}/usb0-busybox"
          SRC="${WORK}/busybox-${VERSION}"

          ASSET_DIR="${REPO_ROOT}/app/src/main/assets/tools/arm64-v8a"
          OUT="${ASSET_DIR}/busybox"

          NDK="${ANDROID_NDK_ROOT:-${ANDROID_HOME}/ndk/27.2.12479018}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="${TOOLCHAIN}/aarch64-linux-android30-clang"
          STRIP="${TOOLCHAIN}/llvm-strip"

          rm -rf "${WORK}"
          mkdir -p "${WORK}"
          mkdir -p "${ASSET_DIR}"

          echo "Downloading BusyBox ${VERSION}"

          curl -fsSL --retry 5 \
            "https://busybox.net/downloads/busybox-${VERSION}.tar.bz2" \
            -o "${WORK}/busybox.tar.bz2"

          tar -xjf "${WORK}/busybox.tar.bz2" -C "${WORK}"

          test -d "${SRC}"

          cd "${SRC}"

          echo "Applying ARM64 SHA-NI guard"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("libbb/hash_md5_sha.c")
          text = p.read_text()

          target = "sha1_process_block64_shaNI"

          if target in text:
              lines = text.splitlines()

              for i, line in enumerate(lines):
                  if target not in line:
                      continue

                  nearby = "\n".join(
                      lines[max(0, i - 5):min(len(lines), i + 5)]
                  )

                  if "defined(__i386__)" in nearby:
                      print("SHA-NI guard already present.")
                  else:
                      indent = line[:len(line) - len(line.lstrip())]

                      lines.insert(
                          i,
                          indent
                          + "#if defined(__GNUC__) && "
                          "(defined(__i386__) || defined(__x86_64__))"
                      )

                      lines.insert(
                          i + 2,
                          indent + "#endif"
                      )

                      p.write_text("\n".join(lines) + "\n")
                      print("SHA-NI ARM64 guard added.")

                  break
          else:
              print("No SHA-NI reference found.")
          PY

          echo "Creating minimal Android-compatible BusyBox configuration"

          make allnoconfig

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".config")
          lines = path.read_text().splitlines()

          wanted = {
              # Shell
              "CONFIG_ASH": "y",
              "CONFIG_ASH_OPTIMIZE_FOR_SIZE": "y",
              "CONFIG_FEATURE_SH_STANDALONE": "y",

              # Basic utilities
              "CONFIG_CAT": "y",
              "CONFIG_CHMOD": "y",
              "CONFIG_CHOWN": "y",
              "CONFIG_CP": "y",
              "CONFIG_CUT": "y",
              "CONFIG_ECHO": "y",
              "CONFIG_ENV": "y",
              "CONFIG_GREP": "y",
              "CONFIG_HEAD": "y",
              "CONFIG_KILL": "y",
              "CONFIG_LS": "y",
              "CONFIG_MKDIR": "y",
              "CONFIG_MV": "y",
              "CONFIG_PRINTF": "y",
              "CONFIG_PS": "y",
              "CONFIG_PWD": "y",
              "CONFIG_READLINK": "y",
              "CONFIG_RM": "y",
              "CONFIG_SLEEP": "y",
              "CONFIG_SORT": "y",
              "CONFIG_STAT": "y",
              "CONFIG_SYNC": "y",
              "CONFIG_TAIL": "y",
              "CONFIG_TEST": "y",
              "CONFIG_TOUCH": "y",
              "CONFIG_TR": "y",
              "CONFIG_UNAME": "y",
              "CONFIG_UNSET": "y",
              "CONFIG_USLEEP": "y",
              "CONFIG_WC": "y",

              # Network tools
              "CONFIG_IP": "y",
              "CONFIG_FEATURE_IP_ADDRESS": "y",
              "CONFIG_FEATURE_IP_LINK": "y",
              "CONFIG_FEATURE_IP_ROUTE": "y",
              "CONFIG_FEATURE_IP_RULE": "y",
              "CONFIG_FEATURE_IP_NEIGH": "y",
              "CONFIG_FEATURE_IP_TUNNEL": "y",
              "CONFIG_FEATURE_IP_SHORT_FORMS": "y",

              "CONFIG_IFCONFIG": "y",
              "CONFIG_FEATURE_IFCONFIG_HW": "y",
              "CONFIG_ROUTE": "y",
              "CONFIG_ARP": "y",
              "CONFIG_ARPING": "y",
              "CONFIG_PING": "y",
              "CONFIG_PING6": "y",
              "CONFIG_UDHCPC": "y",
              "CONFIG_UDHCPC_DEFAULT_SCRIPT": "y",

              # Kernel module tools
              "CONFIG_MODPROBE": "y",
              "CONFIG_INSMOD": "y",
              "CONFIG_RMMOD": "y",

              # Diagnostics
              "CONFIG_DMESG": "y",
              "CONFIG_DF": "y",

              # Android ARM64 compatibility
              "CONFIG_STATIC": "n",
              "CONFIG_SHA1_HWACCEL": "n",
              "CONFIG_SHA256_HWACCEL": "n",
              "CONFIG_TC": "n",
              "CONFIG_HOSTID": "n",
              "CONFIG_NETSTAT": "n",
              "CONFIG_TRACEROUTE": "n",
              "CONFIG_NC": "n",

              # Do NOT build mount/util-linux pieces.
              # Android Bionic does not provide addmntent().
              "CONFIG_MOUNT": "n",
              "CONFIG_UMOUNT": "n",
              "CONFIG_PIVOT_ROOT": "n",
              "CONFIG_SWAPONOFF": "n",
              "CONFIG_LOSETUP": "n",
              "CONFIG_READAHEAD": "n",
              "CONFIG_SETSERIAL": "n",
              "CONFIG_FSTRIM": "n",
              "CONFIG_BLOCKDEV": "n",
              "CONFIG_EJECT": "n",

              # Unneeded archive/filesystem features
              "CONFIG_TAR": "n",
              "CONFIG_GZIP": "n",
              "CONFIG_BZIP2": "n",
              "CONFIG_XZ": "n",
              "CONFIG_CPIO": "n",
              "CONFIG_AR": "n",
              "CONFIG_UNZIP": "n",

              # Avoid remaining interactive/extra features
              "CONFIG_FEATURE_USE_BSS_TAIL": "n",
              "CONFIG_FLOAT_DURATION": "n",
              "CONFIG_FEATURE_RTMINMAX": "n",
              "CONFIG_FEATURE_BUFFERS_GO_ON_STACK": "n",
              "CONFIG_FEATURE_BUFFERS_USE_MALLOC": "n",
              "CONFIG_FEATURE_BUFFERS_GO_IN_BSS": "y",
          }

          def emit(key, value):
              if value == "n":
                  return f"# {key} is not set"
              return f"{key}={value}"

          out = []
          seen = set()

          for line in lines:
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]

                  if key in wanted:
                      out.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              if (
                  line.startswith("# CONFIG_")
                  and line.endswith(" is not set")
              ):
                  key = line[2:-11]

                  if key in wanted:
                      out.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              out.append(line)

          for key, value in wanted.items():
              if key not in seen:
                  out.append(emit(key, value))

          path.write_text("\n".join(out) + "\n")
          PY

          echo "Normalizing BusyBox configuration"

          set +e
          yes "" | make oldconfig > "${WORK}/oldconfig.log" 2>&1
          pipe_status=("${PIPESTATUS[@]}")
          make_rc="${pipe_status[1]}"
          set -e

          cat "${WORK}/oldconfig.log"

          if [ "${make_rc}" -ne 0 ]; then
              echo "BusyBox oldconfig failed: ${make_rc}"
              exit "${make_rc}"
          fi

          # Absolutely prevent the Android-incompatible mount code.
          if grep -Eq \
              '^CONFIG_(MOUNT|UMOUNT|PIVOT_ROOT)=y$' \
              .config; then
              echo "ERROR: forbidden mount applet enabled"
              grep -E \
                '^CONFIG_(MOUNT|UMOUNT|PIVOT_ROOT)=' \
                .config || true
              exit 1
          fi

          echo "Compiling BusyBox for ARM64 Android"

          export CC="${CC}"
          export HOSTCC="cc"
          export AR="$(command -v ar)"
          export RANLIB="$(command -v ranlib)"
          export STRIP="${STRIP}"

          CFLAGS="-Os -fPIE -D__ANDROID_API__=30"
          LDFLAGS="-pie"

          export CFLAGS
          export LDFLAGS

          make V=1 -j1 \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            AR="${AR}" \
            RANLIB="${RANLIB}" \
            STRIP="${STRIP}" \
            CFLAGS="${CFLAGS}" \
            LDFLAGS="${LDFLAGS}"

          test -f busybox

          # IMPORTANT:
          # busybox is AArch64 and the GitHub runner is x86_64.
          # NEVER execute the target binary on the runner.
          # The previous workflow used:
          #     busybox --list
          # which caused Exec format error.
          #
          # Verify the applets through the generated Kconfig header instead.
          test -f include/autoconf.h

          for symbol in \
              IP \
              IFCONFIG \
              ARP \
              ARPING \
              ROUTE \
              UDHCPC \
              PING \
              PING6 \
              MODPROBE \
              INSMOD \
              RMMOD; do

              grep -Eq \
                "^#define ENABLE_${symbol} 1$" \
                include/autoconf.h || {

                echo "ERROR: BusyBox applet ${symbol} was not compiled"
                grep -E "ENABLE_${symbol}" include/autoconf.h || true
                exit 1
              }
          done

          echo "All required BusyBox applets are compiled."

          mkdir -p "${ASSET_DIR}"

          cp busybox "${OUT}"
          chmod 755 "${OUT}"

          "${STRIP}" "${OUT}" || true

          echo "Verifying ARM64 ELF"

          file "${OUT}"

          "${TOOLCHAIN}/llvm-readelf" -h "${OUT}" \
            | grep -Eq \
              "Class:.*ELF64"

          "${TOOLCHAIN}/llvm-readelf" -h "${OUT}" \
            | grep -Eq \
              "Machine:.*AArch64"

          "${TOOLCHAIN}/llvm-readelf" -l "${OUT}" \
            | grep -q \
              "Requesting program interpreter"

          echo "BusyBox ARM64 build verified successfully."
          SCRIPT

          chmod 755 scripts/build-busybox.sh

          bash -n scripts/build-busybox.sh

      - name: Build BusyBox
        shell: bash
        run: |
          set -euo pipefail

          export BUSYBOX_VERSION="${BUSYBOX_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}"

          bash ./scripts/build-busybox.sh

      - name: Install fallback helper files
        shell: bash
        run: |
          set -euo pipefail

          ASSET_DIR="app/src/main/assets/tools/arm64-v8a"

          mkdir -p "${ASSET_DIR}"

          if [ ! -f "${ASSET_DIR}/usb0-helper.sh" ]; then
            cat > "${ASSET_DIR}/usb0-helper.sh" <<'EOF'
          #!/system/bin/sh

          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          BUSYBOX="${SELF}/busybox"

          exec "${BUSYBOX}" "$@"
          EOF

            chmod 755 "${ASSET_DIR}/usb0-helper.sh"
          fi

          if [ ! -f "${ASSET_DIR}/usb0-helper" ]; then
            cat > "${ASSET_DIR}/usb0-helper" <<'EOF'
          #!/system/bin/sh

          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          BUSYBOX="${SELF}/busybox"

          exec "${BUSYBOX}" "$@"
          EOF

            chmod 755 "${ASSET_DIR}/usb0-helper"
          fi

          cat > "${ASSET_DIR}/manifest.txt" <<EOF
          ARCH=arm64-v8a
          ANDROID_API=${ANDROID_API_LEVEL}
          BUSYBOX_VERSION=${BUSYBOX_VERSION}
          STATIC=NO
          SHA1_HWACCEL=NO
          SHA256_HWACCEL=NO
          TC=NO
          MOUNT=NO
          UMOUNT=NO
          PIVOT_ROOT=NO
          TARGET_BINARY_MUST_NOT_RUN_ON_CI=true
          EOF

      - name: Verify embedded files
        shell: bash
        run: |
          set -euo pipefail

          ASSET_DIR="app/src/main/assets/tools/arm64-v8a"

          test -s "${ASSET_DIR}/busybox"
          test -s "${ASSET_DIR}/usb0-native"
          test -s "${ASSET_DIR}/usb0-helper"
          test -s "${ASSET_DIR}/usb0-helper.sh"
          test -s "${ASSET_DIR}/manifest.txt"

          file "${ASSET_DIR}/busybox"
          file "${ASSET_DIR}/usb0-native"

      - name: Configure Gradle
        shell: bash
        run: |
          set -euo pipefail

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > android-build-fix.gradle <<'EOF'
          import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release.set(17)
              }

              tasks.withType(KotlinCompile).configureEach {
                  compilerOptions {
                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                      )
                  }
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("build.gradle"),
              Path("build.gradle.kts"),
          ]

          files = [p for p in candidates if p.exists()]

          if not files:
              raise SystemExit("ERROR: no root Gradle build file found")

          build_file = files[0]
          text = build_file.read_text()

          if "android-build-fix.gradle" not in text:
              text += '\napply from: "android-build-fix.gradle"\n'
              build_file.write_text(text)

          print(f"Gradle JVM compatibility applied to {build_file}")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find app/build/outputs \
              -type f \
              -name "*.apk" \
              | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: no APKs were produced"
            exit 1
          fi

          for apk in "${APKS[@]}"; do
            echo "Checking ${apk}"

            unzip -l "${apk}" \
              | grep -q \
                "assets/tools/arm64-v8a/busybox"

            unzip -l "${apk}" \
              | grep -q \
                "assets/tools/arm64-v8a/usb0-native"

            unzip -l "${apk}" \
              | grep -q \
                "assets/tools/arm64-v8a/usb0-helper"

            unzip -l "${apk}" \
              | grep -q \
                "assets/tools/arm64-v8a/usb0-helper.sh"

            unzip -l "${apk}" \
              | grep -q \
                "assets/tools/arm64-v8a/manifest.txt"

            echo "Verified ${apk}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload BusyBox
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-BusyBox-ARM64
          path: |
            app/src/main/assets/tools/arm64-v8a/busybox
            app/src/main/assets/tools/arm64-v8a/manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-build-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/**
            /tmp/**
          if-no-files-found: ignore
          retention-days: 7

  validate-workflow:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate YAML and forbidden settings
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import sys

          directory = Path(".github/workflows")

          files = sorted(directory.glob("*.yml"))
          files += sorted(directory.glob("*.yaml"))

          if not files:
              raise SystemExit("No workflow files found")

          for workflow in files:
              text = workflow.read_text()

              forbidden = [
                  "sdkmanager tools",
                  "packages: 'tools",
                  'packages: "tools',
                  "android-actions/setup-android@v2",
                  "CONFIG_MOUNT=y",
                  "CONFIG_UMOUNT=y",
                  "CONFIG_PIVOT_ROOT=y",
                  "busybox --list",
              ]

              for item in forbidden:
                  if item in text:
                      raise SystemExit(
                          f"Forbidden pattern {item!r} found in {workflow}"
                      )

              print(f"Validated {workflow}")

          print("Workflow validation passed.")
          PY
