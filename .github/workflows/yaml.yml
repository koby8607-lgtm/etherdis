name: Build USB0 Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: "30"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  BUSYBOX_VERSION: "1.37.0"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            binutils \
            clang \
            curl \
            file \
            make \
            python3 \
            unzip \
            zip

      - name: Fix Gradle wrapper permissions
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./gradlew
          bash ./gradlew --version

      - name: Fix MonitorService Kotlin source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/r36s/usb0manager/MonitorService.kt"

          test -f "${FILE}"

          python3 - "${FILE}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          target = (
              'if (p.exitValue() == 0 || out.isNotBlank()) '
              'return out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""'
          )

          fixed = (
              'if (p.exitValue() == 0 || out.isNotBlank()) '
              'return@runHelper out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""'
          )

          if fixed in text:
              pass
          elif target in text:
              text = text.replace(target, fixed, 1)
              path.write_text(text)
          else:
              marker = "private fun runHelper(command: String): String = try"

              if marker not in text:
                  raise SystemExit(
                      "ERROR: runHelper() was not found"
                  )

              text = text.replace(
                  marker,
                  "private fun runHelper(command: String): String {"
                  "\n        return try",
                  1
              )

              path.write_text(text)

          if target in path.read_text():
              raise SystemExit(
                  "ERROR: bare return remains in runHelper()"
              )

          print("MonitorService Kotlin fix verified.")
          PY

      - name: Prepare embedded tool directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/tools/arm64-v8a

      - name: Build usb0-native
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_NDK_ROOT}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          SOURCE=""

          if [ -f app/src/main/cpp/usb0-native.c ]; then
            SOURCE="app/src/main/cpp/usb0-native.c"
          elif [ -f app/src/main/cpp/usb0-native.cpp ]; then
            SOURCE="app/src/main/cpp/usb0-native.cpp"
          fi

          if [ -n "${SOURCE}" ]; then
            if [[ "${SOURCE}" == *.cpp ]]; then
              "${TOOLCHAIN}/aarch64-linux-android30-clang++" \
                -O2 \
                -fPIE \
                -fstack-protector-strong \
                -DANDROID \
                -D__ANDROID_API__=30 \
                -pie \
                "${SOURCE}" \
                -o app/src/main/assets/tools/arm64-v8a/usb0-native
            else
              "${TOOLCHAIN}/aarch64-linux-android30-clang" \
                -O2 \
                -fPIE \
                -fstack-protector-strong \
                -DANDROID \
                -D__ANDROID_API__=30 \
                -pie \
                "${SOURCE}" \
                -o app/src/main/assets/tools/arm64-v8a/usb0-native
            fi

            "${TOOLCHAIN}/llvm-strip" \
              app/src/main/assets/tools/arm64-v8a/usb0-native || true
          else
            cat > app/src/main/assets/tools/arm64-v8a/usb0-native <<'EOF'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$SELF/busybox" "$@"
          EOF
          fi

          chmod 755 \
            app/src/main/assets/tools/arm64-v8a/usb0-native

      - name: Create BusyBox build script
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p scripts

          cat > scripts/build-busybox.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          REPO_ROOT="$(CDPATH= cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"

          VERSION="${BUSYBOX_VERSION:-1.37.0}"
          WORK="${RUNNER_TEMP:-/tmp}/usb0-busybox"
          SRC="${WORK}/busybox-${VERSION}"

          ASSET_DIR="${REPO_ROOT}/app/src/main/assets/tools/arm64-v8a"
          OUT="${ASSET_DIR}/busybox"

          NDK="${ANDROID_NDK_ROOT:-${ANDROID_HOME}/ndk/27.2.12479018}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="${TOOLCHAIN}/aarch64-linux-android30-clang"
          STRIP="${TOOLCHAIN}/llvm-strip"

          rm -rf "${WORK}"
          mkdir -p "${WORK}"
          mkdir -p "${ASSET_DIR}"

          curl -fsSL --retry 5 \
            "https://busybox.net/downloads/busybox-${VERSION}.tar.bz2" \
            -o "${WORK}/busybox.tar.bz2"

          tar -xjf "${WORK}/busybox.tar.bz2" -C "${WORK}"

          test -d "${SRC}"

          cd "${SRC}"

          python3 - <<'PY'
          from pathlib import Path

          p = Path("libbb/hash_md5_sha.c")
          text = p.read_text()

          target = "sha1_process_block64_shaNI"

          if target in text:
              lines = text.splitlines()

              for i, line in enumerate(lines):
                  if target not in line:
                      continue

                  nearby = "\n".join(
                      lines[max(0, i - 5):min(len(lines), i + 6)]
                  )

                  if "defined(__i386__)" not in nearby:
                      indent = line[:len(line) - len(line.lstrip())]

                      lines.insert(
                          i,
                          indent
                          + "#if defined(__GNUC__) && "
                          "(defined(__i386__) || defined(__x86_64__))"
                      )

                      lines.insert(
                          i + 2,
                          indent + "#endif"
                      )

                      p.write_text("\n".join(lines) + "\n")

                  break
          PY

          make allnoconfig

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".config")
          lines = path.read_text().splitlines()

          wanted = {
              "CONFIG_ASH": "y",
              "CONFIG_ASH_OPTIMIZE_FOR_SIZE": "y",
              "CONFIG_FEATURE_SH_STANDALONE": "y",

              "CONFIG_CAT": "y",
              "CONFIG_CHMOD": "y",
              "CONFIG_CP": "y",
              "CONFIG_CUT": "y",
              "CONFIG_ECHO": "y",
              "CONFIG_ENV": "y",
              "CONFIG_GREP": "y",
              "CONFIG_HEAD": "y",
              "CONFIG_KILL": "y",
              "CONFIG_LS": "y",
              "CONFIG_MKDIR": "y",
              "CONFIG_MV": "y",
              "CONFIG_PRINTF": "y",
              "CONFIG_PS": "y",
              "CONFIG_PWD": "y",
              "CONFIG_READLINK": "y",
              "CONFIG_RM": "y",
              "CONFIG_SLEEP": "y",
              "CONFIG_SORT": "y",
              "CONFIG_STAT": "y",
              "CONFIG_TAIL": "y",
              "CONFIG_TEST": "y",
              "CONFIG_TOUCH": "y",
              "CONFIG_TR": "y",
              "CONFIG_UNAME": "y",
              "CONFIG_WC": "y",

              # Networking
              "CONFIG_IP": "y",
              "CONFIG_FEATURE_IP_ADDRESS": "y",
              "CONFIG_FEATURE_IP_LINK": "y",
              "CONFIG_FEATURE_IP_ROUTE": "y",
              "CONFIG_FEATURE_IP_RULE": "y",
              "CONFIG_FEATURE_IP_NEIGH": "y",
              "CONFIG_FEATURE_IP_TUNNEL": "y",
              "CONFIG_FEATURE_IP_SHORT_FORMS": "y",

              "CONFIG_IFCONFIG": "y",
              "CONFIG_FEATURE_IFCONFIG_HW": "y",
              "CONFIG_ROUTE": "y",
              "CONFIG_ARP": "y",
              "CONFIG_ARPING": "y",
              "CONFIG_PING": "y",

              # FIX:
              # PING6 depends on BusyBox IPv6 support. Enabling only
              # CONFIG_PING6 causes Kconfig to force it back to 0.
              "CONFIG_FEATURE_IPV6": "y",
              "CONFIG_PING6": "y",

              "CONFIG_UDHCPC": "y",
              "CONFIG_UDHCPC_DEFAULT_SCRIPT": "y",

              # Kernel module tools
              "CONFIG_MODPROBE": "y",
              "CONFIG_INSMOD": "y",
              "CONFIG_RMMOD": "y",

              # Diagnostics
              "CONFIG_DMESG": "y",
              "CONFIG_DF": "y",

              # Android ARM64 compatibility
              "CONFIG_STATIC": "n",
              "CONFIG_SHA1_HWACCEL": "n",
              "CONFIG_SHA256_HWACCEL": "n",
              "CONFIG_TC": "n",
              "CONFIG_HOSTID": "n",
              "CONFIG_NETSTAT": "n",
              "CONFIG_TRACEROUTE": "n",
              "CONFIG_NC": "n",

              # Do not compile Android-incompatible mount code.
              "CONFIG_MOUNT": "n",
              "CONFIG_UMOUNT": "n",
              "CONFIG_PIVOT_ROOT": "n",
              "CONFIG_SWAPONOFF": "n",
              "CONFIG_LOSETUP": "n",
              "CONFIG_READAHEAD": "n",
              "CONFIG_SETSERIAL": "n",
              "CONFIG_FSTRIM": "n",
              "CONFIG_BLOCKDEV": "n",
              "CONFIG_EJECT": "n",

              # Unneeded archive/filesystem features
              "CONFIG_TAR": "n",
              "CONFIG_GZIP": "n",
              "CONFIG_BZIP2": "n",
              "CONFIG_XZ": "n",
              "CONFIG_CPIO": "n",
              "CONFIG_AR": "n",
              "CONFIG_UNZIP": "n",

              # Avoid unnecessary Kconfig features.
              "CONFIG_FEATURE_USE_BSS_TAIL": "n",
              "CONFIG_FLOAT_DURATION": "n",
              "CONFIG_FEATURE_RTMINMAX": "n",
              "CONFIG_FEATURE_BUFFERS_GO_ON_STACK": "n",
              "CONFIG_FEATURE_BUFFERS_USE_MALLOC": "n",
              "CONFIG_FEATURE_BUFFERS_GO_IN_BSS": "y",
          }

          def emit(key, value):
              if value == "n":
                  return f"# {key} is not set"
              return f"{key}={value}"

          out = []
          seen = set()

          for line in lines:
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]

                  if key in wanted:
                      out.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              if (
                  line.startswith("# CONFIG_")
                  and line.endswith(" is not set")
              ):
                  key = line[2:-11]

                  if key in wanted:
                      out.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              out.append(line)

          for key, value in wanted.items():
              if key not in seen:
                  out.append(emit(key, value))

          path.write_text("\n".join(out) + "\n")
          PY

          # Kconfig resolves dependencies here.
          set +e

          yes "" | make oldconfig > "${WORK}/oldconfig.log" 2>&1

          pipe_status=("${PIPESTATUS[@]}")
          make_rc="${pipe_status[1]}"

          set -e

          cat "${WORK}/oldconfig.log"

          if [ "${make_rc}" -ne 0 ]; then
              echo "BusyBox oldconfig failed with exit code ${make_rc}"
              exit "${make_rc}"
          fi

          # Verify IPv6 and PING6 survived dependency resolution.
          if ! grep -Eq \
              '^CONFIG_FEATURE_IPV6=y$' \
              .config; then
              echo "ERROR: CONFIG_FEATURE_IPV6 was disabled by Kconfig"
              exit 1
          fi

          if ! grep -Eq \
              '^CONFIG_PING6=y$' \
              .config; then
              echo "ERROR: CONFIG_PING6 was disabled by Kconfig"
              grep -E \
                '^CONFIG_(FEATURE_IPV6|PING6)=' \
                .config || true
              exit 1
          fi

          # These must remain disabled because this is an Android Bionic
          # userspace build, not a normal glibc/Linux userspace build.
          if grep -Eq \
              '^CONFIG_(MOUNT|UMOUNT|PIVOT_ROOT)=y$' \
              .config; then
              echo "ERROR: incompatible util-linux mount applet enabled"
              exit 1
          fi

          echo "Building BusyBox ARM64."

          export CC="${CC}"
          export HOSTCC="cc"
          export AR="$(command -v ar)"
          export RANLIB="$(command -v ranlib)"
          export STRIP="${STRIP}"

          CFLAGS="-Os -fPIE -D__ANDROID_API__=30"
          LDFLAGS="-pie"

          export CFLAGS
          export LDFLAGS

          make V=1 -j1 \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            AR="${AR}" \
            RANLIB="${RANLIB}" \
            STRIP="${STRIP}" \
            CFLAGS="${CFLAGS}" \
            LDFLAGS="${LDFLAGS}"

          test -f busybox

          # IMPORTANT:
          # The GitHub Actions runner is x86_64.
          # BusyBox is AArch64 and MUST NOT be executed here.
          # Therefore we verify the compiled applets through autoconf.h.
          test -f include/autoconf.h

          required_symbols=(
              IP
              IFCONFIG
              ARP
              ARPING
              ROUTE
              UDHCPC
              PING
              PING6
              MODPROBE
              INSMOD
              RMMOD
          )

          for symbol in "${required_symbols[@]}"; do
              if ! grep -Eq \
                  "^#define ENABLE_${symbol} 1$" \
                  include/autoconf.h; then

                  echo "ERROR: BusyBox applet ${symbol} was not compiled"
                  grep -E \
                    "ENABLE_${symbol}" \
                    include/autoconf.h || true

                  exit 1
              fi
          done

          echo "All required BusyBox applets compiled."

          mkdir -p "${ASSET_DIR}"

          cp busybox "${OUT}"
          chmod 755 "${OUT}"

          "${STRIP}" "${OUT}" || true

          file "${OUT}"

          "${TOOLCHAIN}/llvm-readelf" -h "${OUT}" \
            | grep -Eq "Class:.*ELF64"

          "${TOOLCHAIN}/llvm-readelf" -h "${OUT}" \
            | grep -Eq "Machine:.*AArch64"

          "${TOOLCHAIN}/llvm-readelf" -l "${OUT}" \
            | grep -q "Requesting program interpreter"

          echo "BusyBox ARM64 verified."
          SCRIPT

          chmod 755 scripts/build-busybox.sh
          bash -n scripts/build-busybox.sh

      - name: Build BusyBox
        shell: bash
        run: |
          set -euo pipefail

          export BUSYBOX_VERSION="${BUSYBOX_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}"

          bash ./scripts/build-busybox.sh

      - name: Install embedded helper scripts
        shell: bash
        run: |
          set -euo pipefail

          DIR="app/src/main/assets/tools/arm64-v8a"

          cat > "${DIR}/usb0-helper.sh" <<'EOF'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "${SELF}/busybox" "$@"
          EOF

          cat > "${DIR}/usb0-helper" <<'EOF'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "${SELF}/busybox" "$@"
          EOF

          chmod 755 \
            "${DIR}/usb0-helper.sh" \
            "${DIR}/usb0-helper"

          cat > "${DIR}/manifest.txt" <<EOF
          ARCH=arm64-v8a
          ANDROID_API=${ANDROID_API_LEVEL}
          BUSYBOX_VERSION=${BUSYBOX_VERSION}
          STATIC=NO
          IPV6=YES
          PING6=YES
          SHA1_HWACCEL=NO
          SHA256_HWACCEL=NO
          TC=NO
          MOUNT=NO
          UMOUNT=NO
          PIVOT_ROOT=NO
          TARGET_BINARY_MUST_NOT_RUN_ON_CI=YES
          EOF

      - name: Verify embedded files
        shell: bash
        run: |
          set -euo pipefail

          DIR="app/src/main/assets/tools/arm64-v8a"

          test -s "${DIR}/busybox"
          test -s "${DIR}/usb0-native"
          test -s "${DIR}/usb0-helper"
          test -s "${DIR}/usb0-helper.sh"
          test -s "${DIR}/manifest.txt"

          file "${DIR}/busybox"
          file "${DIR}/usb0-native"

      - name: Configure Gradle JVM
        shell: bash
        run: |
          set -euo pipefail

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > android-build-fix.gradle <<'EOF'
          import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release.set(17)
              }

              tasks.withType(KotlinCompile).configureEach {
                  compilerOptions {
                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                      )
                  }
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("build.gradle"),
              Path("build.gradle.kts"),
          ]

          files = [p for p in candidates if p.exists()]

          if not files:
              raise SystemExit("ERROR: no root Gradle build file found")

          build_file = files[0]
          text = build_file.read_text()

          if "android-build-fix.gradle" not in text:
              text += '\napply from: "android-build-fix.gradle"\n'
              build_file.write_text(text)
          PY

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find app/build/outputs \
              -type f \
              -name "*.apk" \
              | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
              echo "ERROR: no APK produced"
              exit 1
          fi

          for apk in "${APKS[@]}"; do
              echo "Checking ${apk}"

              unzip -l "${apk}" \
                | grep -q \
                  "assets/tools/arm64-v8a/busybox"

              unzip -l "${apk}" \
                | grep -q \
                  "assets/tools/arm64-v8a/usb0-native"

              unzip -l "${apk}" \
                | grep -q \
                  "assets/tools/arm64-v8a/usb0-helper.sh"

              unzip -l "${apk}" \
                | grep -q \
                  "assets/tools/arm64-v8a/manifest.txt"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload BusyBox
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-BusyBox-ARM64
          path: |
            app/src/main/assets/tools/arm64-v8a/busybox
            app/src/main/assets/tools/arm64-v8a/manifest.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-build-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/**
            /tmp/**
          if-no-files-found: ignore
          retention-days: 7

  validate-workflow:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          directory = Path(".github/workflows")

          files = sorted(directory.glob("*.yml"))
          files += sorted(directory.glob("*.yaml"))

          if not files:
              raise SystemExit("No workflow files found")

          forbidden = (
              "sdkmanager tools",
              "packages: 'tools",
              'packages: "tools',
              "android-actions/setup-android@v2",
              "busybox --list",
              "busybox\" --list",
              "CONFIG_MOUNT=y",
              "CONFIG_UMOUNT=y",
              "CONFIG_PIVOT_ROOT=y",
          )

          for workflow in files:
              text = workflow.read_text()

              for pattern in forbidden:
                  if pattern in text:
                      raise SystemExit(
                          f"Forbidden pattern {pattern!r} found in {workflow}"
                      )

              print(f"Validated {workflow}")

          print("Workflow validation passed.")
          PY
