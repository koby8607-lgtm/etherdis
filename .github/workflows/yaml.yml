name: Build USB0 Manager v1.8.1

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_API_LEVEL: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      ANDROID_NDK_VERSION: '27.2.12479018'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./gradlew
          ./gradlew --version

      - name: Normalize Kotlin source
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          for p in Path("app/src/main/java").rglob("*.kt"):
              s = p.read_text()
              s = s.replace("singleLine = true", "isSingleLine = true")
              p.write_text(s)
          PY

      - name: Force JVM 17
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          s = p.read_text()

          s = s.replace("jvmTarget = '1.8'", "jvmTarget = '17'")
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')

          p.write_text(s)
          PY

          rm -f android-build-fix.gradle
          rm -f app/android-build-fix.gradle

      - name: Build ARM64 usb0-native
        shell: bash
        run: |
          set -euo pipefail

          test -f app/src/main/cpp/usb0-native.c
          mkdir -p app/src/main/assets/tools/arm64-v8a

          NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          "$TOOLCHAIN/aarch64-linux-android30-clang" \
            -O2 \
            -fPIE \
            -fstack-protector-strong \
            -DANDROID \
            -D__ANDROID_API__=30 \
            -pie \
            app/src/main/cpp/usb0-native.c \
            -o app/src/main/assets/tools/arm64-v8a/usb0-native

          "$TOOLCHAIN/llvm-strip" \
            app/src/main/assets/tools/arm64-v8a/usb0-native || true

          chmod 755 app/src/main/assets/tools/arm64-v8a/usb0-native

          file app/src/main/assets/tools/arm64-v8a/usb0-native

          "$TOOLCHAIN/llvm-readelf" -h \
            app/src/main/assets/tools/arm64-v8a/usb0-native |
            grep -E 'Class:|Machine:|Type:'

      - name: Replace BusyBox builder
        shell: bash
        run: |
          set -euo pipefail

          cat > scripts/build-busybox.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          VERSION="1.37.0"
          BASE_URL="https://www.busybox.net/downloads"

          ARCHIVE_NAME="busybox-${VERSION}.tar.bz2"
          ARCHIVE_URL="${BASE_URL}/${ARCHIVE_NAME}"
          SHA_URL="${ARCHIVE_URL}.sha256"

          WORK="${RUNNER_TEMP:-/tmp}/usb0-busybox"
          ARCHIVE="${WORK}/${ARCHIVE_NAME}"
          SHA_FILE="${WORK}/${ARCHIVE_NAME}.sha256"
          SRC="${WORK}/busybox-${VERSION}"

          OUT="app/src/main/assets/tools/arm64-v8a/busybox"

          NDK="${ANDROID_NDK_ROOT:-${ANDROID_HOME}/ndk/27.2.12479018}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CLANG="${TOOLCHAIN}/aarch64-linux-android30-clang"
          STRIP="${TOOLCHAIN}/llvm-strip"
          READELF="${TOOLCHAIN}/llvm-readelf"

          command -v curl >/dev/null
          command -v sha256sum >/dev/null
          command -v tar >/dev/null
          command -v make >/dev/null

          test -x "${CLANG}"

          rm -rf "${WORK}"
          mkdir -p "${WORK}"

          echo "Downloading ${ARCHIVE_NAME}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            "${ARCHIVE_URL}" \
            -o "${ARCHIVE}"

          test -s "${ARCHIVE}"

          echo "Downloading official SHA256"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 3 \
            "${SHA_URL}" \
            -o "${SHA_FILE}"

          test -s "${SHA_FILE}"

          echo "Checking archive SHA256"

          (
            cd "${WORK}"
            sha256sum --check "${ARCHIVE_NAME}.sha256"
          )

          echo "SHA256 verified."

          echo "Extracting BusyBox"

          tar -xjf "${ARCHIVE}" -C "${WORK}"

          test -d "${SRC}"

          cd "${SRC}"

          echo "Creating minimal BusyBox configuration"

          make allnoconfig

          set_config() {
            local symbol="$1"
            local value="$2"

            if grep -q "^CONFIG_${symbol}=" .config; then
              sed -i \
                "s/^CONFIG_${symbol}=.*/CONFIG_${symbol}=${value}/" \
                .config

            elif grep -q "^# CONFIG_${symbol} is not set$" .config; then
              sed -i \
                "s/^# CONFIG_${symbol} is not set$/CONFIG_${symbol}=${value}/" \
                .config

            else
              printf '\nCONFIG_%s=%s\n' \
                "${symbol}" \
                "${value}" >> .config
            fi
          }

          disable_config() {
            local symbol="$1"

            if grep -q "^CONFIG_${symbol}=" .config; then
              sed -i \
                "s/^CONFIG_${symbol}=.*/# CONFIG_${symbol} is not set/" \
                .config

            elif ! grep -q "^# CONFIG_${symbol} is not set$" .config; then
              printf '\n# CONFIG_%s is not set\n' \
                "${symbol}" >> .config
            fi
          }

          #
          # Shell
          #

          set_config SH_IS_ASH y
          set_config ASH y

          #
          # Basic utilities needed by the helper
          #

          set_config CAT y
          set_config CHMOD y
          set_config ECHO y
          set_config GREP y
          set_config HEAD y
          set_config LS y
          set_config MKDIR y
          set_config OD y
          set_config READLINK y
          set_config RM y
          set_config SED y
          set_config AWK y
          set_config SLEEP y

          #
          # USB/RNDIS networking
          #

          set_config IP y
          set_config FEATURE_IP_ADDRESS y
          set_config FEATURE_IP_LINK y
          set_config FEATURE_IP_ROUTE y
          set_config FEATURE_IP_RULE y
          set_config FEATURE_IP_NEIGH y
          set_config ARP y
          set_config UDHCPC y
          set_config UDHCPD y
          set_config PING y

          #
          # Kernel module fallback
          #

          set_config MODPROBE y
          set_config INSMOD y

          #
          # Disable known Android/Bionic/problematic options
          #

          disable_config STATIC
          disable_config IFCONFIG
          disable_config ROUTE
          disable_config ARPING
          disable_config PING6
          disable_config NETSTAT
          disable_config TRACEROUTE
          disable_config NC
          disable_config TC
          disable_config HOSTID
          disable_config MOUNT
          disable_config UMOUNT
          disable_config PIVOT_ROOT
          disable_config FEATURE_IPV6
          disable_config SHA1_HWACCEL
          disable_config SHA256_HWACCEL
          disable_config FEATURE_WGET_OPENSSL
          disable_config TLS

          #
          # Resolve dependencies without allowing a broken-pipe
          # from the yes process to fail the build.
          #

          echo "Resolving BusyBox configuration"

          set +e

          yes '' | make oldconfig \
            >/tmp/usb0-busybox-oldconfig.log \
            2>&1

          cfg_rc=${PIPESTATUS[1]}

          set -e

          if [ "${cfg_rc}" -ne 0 ]; then
            cat /tmp/usb0-busybox-oldconfig.log
            exit "${cfg_rc}"
          fi

          #
          # Verify required config actually survived Kconfig.
          #

          for symbol in \
            SH_IS_ASH \
            ASH \
            CAT \
            CHMOD \
            GREP \
            HEAD \
            LS \
            MKDIR \
            OD \
            READLINK \
            RM \
            SED \
            AWK \
            IP \
            FEATURE_IP_ADDRESS \
            FEATURE_IP_LINK \
            FEATURE_IP_ROUTE \
            FEATURE_IP_RULE \
            FEATURE_IP_NEIGH \
            ARP \
            UDHCPC \
            UDHCPD \
            PING \
            MODPROBE \
            INSMOD
          do
            if ! grep -q "^CONFIG_${symbol}=y$" .config; then
              echo "Required BusyBox option missing: CONFIG_${symbol}"
              grep -E \
                "CONFIG_${symbol}|# CONFIG_${symbol}" \
                .config || true
              exit 1
            fi
          done

          #
          # Build ARM64 Android API 30 binary.
          #

          echo "Building BusyBox ARM64"

          make -j"$(nproc)" \
            CC="${CLANG}" \
            CFLAGS="-Os -fPIE -D__ANDROID_API__=30" \
            LDFLAGS="-pie"

          test -s busybox

          mkdir -p "$(dirname "${OUT}")"

          cp busybox "${OUT}"

          chmod 755 "${OUT}"

          "${STRIP}" "${OUT}" || true

          file "${OUT}"

          "${READELF}" -h "${OUT}" |
            grep -E 'Class:|Machine:|Type:'

          #
          # Never execute this ARM64 binary on the x86_64 GitHub runner.
          #

          echo "BusyBox ARM64 build completed."
          SCRIPT

          chmod 755 scripts/build-busybox.sh

      - name: Build BusyBox ARM64
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build-busybox.sh

      - name: Verify bundled tools
        shell: bash
        run: |
          set -euo pipefail

          test -s app/src/main/assets/tools/arm64-v8a/busybox
          test -s app/src/main/assets/tools/arm64-v8a/usb0-native
          test -s app/src/main/assets/tools/arm64-v8a/usb0-helper
          test -s app/src/main/assets/tools/arm64-v8a/usb0-helper.sh

          file app/src/main/assets/tools/arm64-v8a/busybox
          file app/src/main/assets/tools/arm64-v8a/usb0-native

      - name: Create release signing key
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/usb0-manager-release.jks" \
            -storepass changeit \
            -keypass changeit \
            -alias usb0 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=USB0 Manager, OU=R36S, O=USB0 Manager, L=R36S, ST=R36S, C=GB" \
            -noprompt

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew assembleRelease \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain \
            -PRELEASE_STORE_FILE="$RUNNER_TEMP/usb0-manager-release.jks" \
            -PRELEASE_STORE_PASSWORD=changeit \
            -PRELEASE_KEY_ALIAS=usb0 \
            -PRELEASE_KEY_PASSWORD=changeit

      - name: Verify APKs
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"

          for apk in \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk
          do
            [ -f "$apk" ] || continue

            echo "Checking $apk"

            "$APKSIGNER" verify --verbose "$apk"

            unzip -l "$apk" |
              grep -F 'assets/tools/arm64-v8a/busybox'

            unzip -l "$apk" |
              grep -F 'assets/tools/arm64-v8a/usb0-native'

            unzip -l "$apk" |
              grep -F 'assets/tools/arm64-v8a/usb0-helper'

            unzip -l "$apk" |
              grep -F 'assets/tools/arm64-v8a/usb0-helper.sh'
          done

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp app/build/outputs/apk/debug/*.apk artifacts/
          cp app/build/outputs/apk/release/*.apk artifacts/

          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.8.1
          path: artifacts/*.apk
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.8.1-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/**
            ${{ runner.temp }}/usb0-busybox/**
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish release APKs on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
