name: Build USB0 Manager

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  BUSYBOX_VERSION: "1.37.0"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          chmod 755 ./gradlew
          test -x ./gradlew

      - name: Prepare directories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/assets/tools/arm64-v8a \
            third_party \
            build-tools

      - name: Download BusyBox source
        shell: bash
        run: |
          set -euo pipefail

          cd third_party

          rm -rf busybox
          mkdir -p busybox
          cd busybox

          FILE="busybox-${BUSYBOX_VERSION}.tar.bz2"
          URL="https://busybox.net/downloads/${FILE}"

          curl \
            --fail \
            --location \
            --show-error \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            "${URL}" \
            --output "${FILE}"

          test -s "${FILE}"

          tar -xjf "${FILE}"

          test -d "busybox-${BUSYBOX_VERSION}"

      - name: Configure BusyBox
        shell: bash
        run: |
          set -euo pipefail

          cd "third_party/busybox/busybox-${BUSYBOX_VERSION}"

          make defconfig

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(".config")
          text = path.read_text()

          symbols = [
              "STATIC",
              "FEATURE_PREFER_APPLETS",
              "IP",
              "FEATURE_IP_LINK",
              "FEATURE_IP_ROUTE",
              "FEATURE_IP_RULE",
              "FEATURE_IP_NEIGH",
              "FEATURE_IP_ADDRESS",
              "IFCONFIG",
              "IFUP",
              "IFDOWN",
              "ROUTE",
              "ARP",
              "ARPING",
              "PING",
              "PING6",
              "UDHCPC",
              "UDHCPD",
              "MODPROBE",
              "INSMOD",
              "RMMOD",
              "LS",
              "CAT",
              "CP",
              "MV",
              "RM",
              "MKDIR",
              "READLINK",
              "GREP",
              "SED",
              "AWK",
              "SLEEP",
              "DATE",
              "LOGGER",
              "SH",
              "ASH",
              "ENV",
              "PRINTENV",
              "UNAME",
              "KILL",
              "PS",
          ]

          for symbol in symbols:
              pattern = re.compile(
                  rf"^(?:# CONFIG_{re.escape(symbol)} is not set|CONFIG_{re.escape(symbol)}=.*)$",
                  re.MULTILINE,
              )

              if pattern.search(text):
                  text = pattern.sub(
                      f"CONFIG_{symbol}=y",
                      text,
                      count=1,
                  )

          path.write_text(text)
          PY

          # BusyBox uses oldconfig rather than the kernel's olddefconfig target.
          yes "" | make oldconfig

      - name: Build BusyBox ARM64
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "${TOOLCHAIN}/aarch64-linux-android30-clang"

          cd "third_party/busybox/busybox-${BUSYBOX_VERSION}"

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC="${TOOLCHAIN}/aarch64-linux-android30-clang" \
            AR="${TOOLCHAIN}/llvm-ar" \
            RANLIB="${TOOLCHAIN}/llvm-ranlib" \
            STRIP="${TOOLCHAIN}/llvm-strip"

          test -f busybox

          "${TOOLCHAIN}/llvm-readelf" -h busybox |
            grep -q "Class:.*ELF64"

          "${TOOLCHAIN}/llvm-readelf" -h busybox |
            grep -q "Machine:.*AArch64"

          cp busybox \
            "${GITHUB_WORKSPACE}/app/src/main/assets/tools/arm64-v8a/busybox"

          chmod 755 \
            "${GITHUB_WORKSPACE}/app/src/main/assets/tools/arm64-v8a/busybox"

      - name: Build native ARM64 helper
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          SRC=""

          if [[ -f app/src/main/cpp/usb0-native.c ]]; then
            SRC="app/src/main/cpp/usb0-native.c"
          elif [[ -f app/src/main/cpp/usb0_helper.c ]]; then
            SRC="app/src/main/cpp/usb0_helper.c"
          elif [[ -f app/src/main/cpp/native_helper.c ]]; then
            SRC="app/src/main/cpp/native_helper.c"
          fi

          if [[ -n "${SRC}" ]]; then
            "${TOOLCHAIN}/aarch64-linux-android30-clang" \
              -O2 \
              -fPIE \
              -pie \
              -DANDROID \
              -Wall \
              -Wextra \
              "${SRC}" \
              -o app/src/main/assets/tools/arm64-v8a/usb0-native

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          else
            cat > app/src/main/assets/tools/arm64-v8a/usb0-native <<'EOF'
          #!/system/bin/sh
          HERE="${0%/*}"
          exec "${HERE}/busybox" "$@"
          EOF

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          fi

      - name: Create helper manifest
        shell: bash
        run: |
          set -euo pipefail

          cat > app/src/main/assets/tools/arm64-v8a/manifest.txt <<EOF
          USB0 Manager helper bundle
          ABI=arm64-v8a
          BUSYBOX=${BUSYBOX_VERSION}
          NATIVE_HELPER=usb0-native
          EOF

      - name: Create JVM compatibility configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > ci-jvm-targets.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          gradle.projectsEvaluated {
              allprojects { project ->
                  project.tasks.configureEach { task ->

                      if (task instanceof JavaCompile) {
                          task.sourceCompatibility = "17"
                          task.targetCompatibility = "17"

                          try {
                              task.options.release.set(17)
                          } catch (Throwable ignored) {
                          }
                      }

                      if (task.class.name.contains("KotlinCompile")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Throwable ignored) {
                          }
                      }
                  }
              }
          }
          EOF

      - name: Find project files
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          SETTINGS=""
          BUILD=""

          if [[ -f settings.gradle ]]; then
            SETTINGS="settings.gradle"
          elif [[ -f settings.gradle.kts ]]; then
            SETTINGS="settings.gradle.kts"
          fi

          if [[ -f build.gradle ]]; then
            BUILD="build.gradle"
          elif [[ -f build.gradle.kts ]]; then
            BUILD="build.gradle.kts"
          fi

          if [[ -z "${SETTINGS}" ]]; then
            echo "ERROR: settings.gradle/settings.gradle.kts not found"
            find . -maxdepth 3 -type f \
              \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
              -print
            exit 1
          fi

          if [[ -z "${BUILD}" ]]; then
            echo "ERROR: build.gradle/build.gradle.kts not found"
            find . -maxdepth 3 -type f \
              \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
              -print
            exit 1
          fi

          echo "Using ${SETTINGS}"
          echo "Using ${BUILD}"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          bash ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            -I "${GITHUB_WORKSPACE}/ci-jvm-targets.gradle"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          bash ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            -I "${GITHUB_WORKSPACE}/ci-jvm-targets.gradle"

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

          found=0

          while IFS= read -r -d '' apk; do
            echo "Found APK: ${apk}"
            cp "${apk}" "artifacts/$(basename "${apk}")"
            found=1
          done < <(
            find . \
              -type f \
              -path '*/build/outputs/apk/*.apk' \
              -print0
          )

          if [[ "${found}" -eq 0 ]]; then
            echo "ERROR: No APKs were produced"
            find . \
              -type f \
              -path '*/build/outputs/*' \
              -print || true
            exit 1
          fi

      - name: Verify embedded tools
        shell: bash
        run: |
          set -euo pipefail

          test -f app/src/main/assets/tools/arm64-v8a/busybox
          test -f app/src/main/assets/tools/arm64-v8a/usb0-native

          for apk in artifacts/*.apk; do
            echo "Checking ${apk}"

            unzip -l "${apk}" |
              grep -F "assets/tools/arm64-v8a/busybox"

            unzip -l "${apk}" |
              grep -F "assets/tools/arm64-v8a/usb0-native"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/**
            ~/.gradle/daemon/**
            third_party/busybox/busybox-${BUSYBOX_VERSION}/.config
          if-no-files-found: ignore
          retention-days: 7

  validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate workflow
        shell: bash
        run: |
          set -euo pipefail

          WORKFLOW=""

          for f in \
            .github/workflows/yaml.yml \
            .github/workflows/yaml.yaml \
            .github/workflows/build.yml \
            .github/workflows/build.yaml; do

            if [[ -f "${f}" ]]; then
              WORKFLOW="${f}"
              break
            fi
          done

          if [[ -z "${WORKFLOW}" ]]; then
            echo "ERROR: no workflow file found"
            find .github/workflows \
              -maxdepth 1 \
              -type f \
              -print 2>/dev/null || true
            exit 1
          fi

          echo "Workflow: ${WORKFLOW}"

          ! grep -nE \
            'packages:.*(^|[[:space:]])tools([[:space:]]|$)|^[[:space:]]*-[[:space:]]*tools[[:space:]]*$' \
            "${WORKFLOW}"

          grep -q "BUSYBOX_VERSION" "${WORKFLOW}"
          grep -q "make oldconfig" "${WORKFLOW}"
          grep -q "bash ./gradlew" "${WORKFLOW}"

      - name: Validate Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew
          chmod 755 ./gradlew
          test -x ./gradlew

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            bash -n "${file}"
          done < <(
            find . \
              -type f \
              \( -name '*.sh' -o -name '*.bash' \) \
              -not -path './.git/*' \
              -print0
          )
