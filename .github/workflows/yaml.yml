name: Build USB0 Manager v1.8.1

"on":
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      ANDROID_API_LEVEL: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "27.2.12479018"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-${ANDROID_API_LEVEL}"
          sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}"
          sdkmanager "ndk;${ANDROID_NDK_VERSION}"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./gradlew
          ./gradlew --version

      - name: Configure Java and Kotlin
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle")
          if not p.exists():
              raise SystemExit("app/build.gradle not found")

          s = p.read_text()

          s = s.replace("jvmTarget = '1.8'", "jvmTarget = '17'")
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')

          if "kotlinOptions" not in s:
              block = """
              kotlinOptions {
                  jvmTarget = '17'
              }
              """

              if "android {" in s:
                  s = s.replace("android {", "android {" + block, 1)
              else:
                  s += "\n" + block

          p.write_text(s)
          PY

          rm -f android-build-fix.gradle
          rm -f app/android-build-fix.gradle

      - name: Fix Kotlin compatibility
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          for p in Path("app/src").rglob("*.kt"):
              s = p.read_text()
              s = s.replace("singleLine = true", "isSingleLine = true")
              p.write_text(s)
          PY

      - name: Build BusyBox
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets/tools/arm64-v8a

          if [ -f scripts/build-busybox.sh ]; then
            chmod 755 scripts/build-busybox.sh
            ./scripts/build-busybox.sh
          else
            echo "BusyBox build script not found."
          fi

      - name: Build usb0-native
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets/tools/arm64-v8a

          if [ -f app/src/main/cpp/usb0-native.c ]; then
            NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
            TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

            "$TOOLCHAIN/aarch64-linux-android30-clang" \
              -O2 \
              -fPIE \
              -fstack-protector-strong \
              -DANDROID \
              -D__ANDROID_API__=30 \
              -pie \
              app/src/main/cpp/usb0-native.c \
              -o app/src/main/assets/tools/arm64-v8a/usb0-native

            "$TOOLCHAIN/llvm-strip" \
              app/src/main/assets/tools/arm64-v8a/usb0-native || true

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          fi

      - name: Check embedded files
        shell: bash
        run: |
          set -euo pipefail

          if [ -f app/src/main/assets/tools/arm64-v8a/busybox ]; then
            test -s app/src/main/assets/tools/arm64-v8a/busybox
            echo "BusyBox OK"
          fi

          if [ -f app/src/main/assets/tools/arm64-v8a/usb0-native ]; then
            test -s app/src/main/assets/tools/arm64-v8a/usb0-native
            echo "usb0-native OK"
          fi

      - name: Compile Kotlin
        shell: bash
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/kotlin.log"

          ./gradlew :app:compileDebugKotlin \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$LOG"

          rc=${PIPESTATUS[0]}

          echo "===== KOTLIN ERRORS ====="
          grep -E '(^e: |error:|\.kt:[0-9]+:[0-9]+)' "$LOG" || true
          echo "===== END KOTLIN ERRORS ====="

          exit "$rc"

      - name: Build debug APK
        shell: bash
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/debug.log"

          ./gradlew assembleDebug \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$LOG"

          rc=${PIPESTATUS[0]}

          echo "===== BUILD ERRORS ====="
          grep -E '(^e: |error:|FAILED|\.kt:[0-9]+:[0-9]+)' "$LOG" || true
          echo "===== END BUILD ERRORS ====="

          exit "$rc"

      - name: Build release APK
        shell: bash
        run: |
          set -uo pipefail

          LOG="$RUNNER_TEMP/release.log"

          ./gradlew assembleRelease \
            --no-daemon \
            --no-parallel \
            --stacktrace \
            --console=plain \
            2>&1 | tee "$LOG"

          rc=${PIPESTATUS[0]}

          echo "===== RELEASE ERRORS ====="
          grep -E '(^e: |error:|FAILED|\.kt:[0-9]+:[0-9]+)' "$LOG" || true
          echo "===== END RELEASE ERRORS ====="

          exit "$rc"

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -exec cp {} artifacts/ \;

          ls -lh artifacts

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.8.1
          path: artifacts/*.apk
          retention-days: 30

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-build-diagnostics
          path: |
            ${{ runner.temp }}/kotlin.log
            ${{ runner.temp }}/debug.log
            ${{ runner.temp }}/release.log
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
