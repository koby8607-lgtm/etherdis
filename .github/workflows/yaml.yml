name: Build USB0 Manager

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  BUSYBOX_VERSION: "1.37.0"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euxo pipefail

          test -f ./gradlew
          chmod 755 ./gradlew
          test -x ./gradlew

      - name: Prepare helper directories
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            app/src/main/assets/tools/arm64-v8a \
            third_party \
            build-tools

      - name: Download BusyBox
        shell: bash
        run: |
          set -euxo pipefail

          cd third_party
          rm -rf busybox
          mkdir -p busybox
          cd busybox

          curl -fL --retry 5 --retry-delay 2 --retry-all-errors \
            "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2" \
            -o "busybox-${BUSYBOX_VERSION}.tar.bz2"

          test -s "busybox-${BUSYBOX_VERSION}.tar.bz2"

          tar -xjf "busybox-${BUSYBOX_VERSION}.tar.bz2"

          test -d "busybox-${BUSYBOX_VERSION}"

      - name: Configure BusyBox
        shell: bash
        run: |
          set -euxo pipefail

          cd "third_party/busybox/busybox-${BUSYBOX_VERSION}"

          make defconfig

          ./scripts/config --enable STATIC
          ./scripts/config --enable FEATURE_PREFER_APPLETS

          ./scripts/config --enable IP
          ./scripts/config --enable FEATURE_IP_LINK
          ./scripts/config --enable FEATURE_IP_ROUTE
          ./scripts/config --enable FEATURE_IP_RULE
          ./scripts/config --enable FEATURE_IP_NEIGH
          ./scripts/config --enable FEATURE_IP_ADDRESS

          ./scripts/config --enable IFCONFIG
          ./scripts/config --enable IFUP
          ./scripts/config --enable IFDOWN
          ./scripts/config --enable ROUTE

          ./scripts/config --enable ARP
          ./scripts/config --enable ARPING
          ./scripts/config --enable PING
          ./scripts/config --enable PING6

          ./scripts/config --enable UDHCPC
          ./scripts/config --enable UDHCPD

          ./scripts/config --enable MODPROBE
          ./scripts/config --enable INSMOD
          ./scripts/config --enable RMMOD

          ./scripts/config --enable LS
          ./scripts/config --enable CAT
          ./scripts/config --enable CP
          ./scripts/config --enable MV
          ./scripts/config --enable RM
          ./scripts/config --enable MKDIR
          ./scripts/config --enable READLINK
          ./scripts/config --enable GREP
          ./scripts/config --enable SED
          ./scripts/config --enable AWK
          ./scripts/config --enable SLEEP
          ./scripts/config --enable DATE
          ./scripts/config --enable LOGGER
          ./scripts/config --enable SH
          ./scripts/config --enable ASH
          ./scripts/config --enable ENV
          ./scripts/config --enable PRINTENV
          ./scripts/config --enable UNAME
          ./scripts/config --enable KILL
          ./scripts/config --enable PS

          make olddefconfig

      - name: Build BusyBox ARM64
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "${TOOLCHAIN}/aarch64-linux-android30-clang"
          test -x "${TOOLCHAIN}/llvm-ar"
          test -x "${TOOLCHAIN}/llvm-ranlib"

          cd "third_party/busybox/busybox-${BUSYBOX_VERSION}"

          export PATH="${TOOLCHAIN}:${PATH}"

          make -j"$(nproc)" \
            ARCH=arm64 \
            CC="${TOOLCHAIN}/aarch64-linux-android30-clang" \
            AR="${TOOLCHAIN}/llvm-ar" \
            RANLIB="${TOOLCHAIN}/llvm-ranlib" \
            STRIP="${TOOLCHAIN}/llvm-strip"

          test -f busybox

          file busybox

          "${TOOLCHAIN}/llvm-readelf" -h busybox |
            grep -E "Class:.*ELF64|Machine:.*AArch64"

          cp busybox \
            "${GITHUB_WORKSPACE}/app/src/main/assets/tools/arm64-v8a/busybox"

          chmod 755 \
            "${GITHUB_WORKSPACE}/app/src/main/assets/tools/arm64-v8a/busybox"

      - name: Build native ARM64 helper
        shell: bash
        run: |
          set -euxo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME}}"
          NDK_ROOT="${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"
          TOOLCHAIN="${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p app/src/main/assets/tools/arm64-v8a

          SRC=""

          if [ -f app/src/main/cpp/usb0-native.c ]; then
            SRC="app/src/main/cpp/usb0-native.c"
          elif [ -f app/src/main/cpp/usb0_helper.c ]; then
            SRC="app/src/main/cpp/usb0_helper.c"
          elif [ -f app/src/main/cpp/native_helper.c ]; then
            SRC="app/src/main/cpp/native_helper.c"
          fi

          if [ -z "${SRC}" ]; then
            echo "No native helper source found; creating helper launcher"
            cat > app/src/main/assets/tools/arm64-v8a/usb0-native <<'EOF'
          #!/system/bin/sh
          exec "${0%/*}/busybox" "$@"
          EOF
            chmod 755 app/src/main/assets/tools/arm64-v8a/usb0-native
          else
            "${TOOLCHAIN}/aarch64-linux-android30-clang" \
              -O2 \
              -fPIE \
              -pie \
              -DANDROID \
              -Wall \
              -Wextra \
              "${SRC}" \
              -o app/src/main/assets/tools/arm64-v8a/usb0-native

            chmod 755 \
              app/src/main/assets/tools/arm64-v8a/usb0-native

            file \
              app/src/main/assets/tools/arm64-v8a/usb0-native

            "${TOOLCHAIN}/llvm-readelf" -h \
              app/src/main/assets/tools/arm64-v8a/usb0-native |
              grep -E "Class:.*ELF64|Machine:.*AArch64"
          fi

      - name: Write helper manifest
        shell: bash
        run: |
          set -euxo pipefail

          cat > app/src/main/assets/tools/arm64-v8a/manifest.txt <<EOF
          USB0 Manager helper bundle
          ABI=arm64-v8a
          BUSYBOX_VERSION=${BUSYBOX_VERSION}
          NATIVE_HELPER=usb0-native
          EOF

          test -s app/src/main/assets/tools/arm64-v8a/manifest.txt

      - name: Create JVM compatibility configuration
        shell: bash
        run: |
          set -euxo pipefail

          cat > ci-jvm-targets.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          gradle.projectsEvaluated {
              allprojects { project ->
                  project.tasks.configureEach { task ->

                      if (task instanceof JavaCompile) {
                          task.sourceCompatibility = "17"
                          task.targetCompatibility = "17"

                          try {
                              task.options.release.set(17)
                          } catch (Throwable ignored) {
                          }
                      }

                      if (task.class.name.contains("KotlinCompile")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Throwable ignored) {
                          }

                          try {
                              def compilerOptions = task.compilerOptions
                              def jvmTarget = compilerOptions.jvmTarget

                              def target17 = jvmTarget.get().class.enumConstants.find {
                                  it.toString() == "JVM_17"
                              }

                              if (target17 != null) {
                                  jvmTarget.set(target17)
                              }
                          } catch (Throwable ignored) {
                          }
                      }
                  }
              }
          }
          EOF

      - name: Verify project
        shell: bash
        run: |
          set -euxo pipefail

          test -f settings.gradle || test -f settings.gradle.kts
          test -f build.gradle || test -f build.gradle.kts

          test -f app/src/main/assets/tools/arm64-v8a/busybox
          test -f app/src/main/assets/tools/arm64-v8a/usb0-native

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail

          bash ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            -I "${GITHUB_WORKSPACE}/ci-jvm-targets.gradle"

      - name: Build release APK
        shell: bash
        run: |
          set -euxo pipefail

          bash ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace \
            -I "${GITHUB_WORKSPACE}/ci-jvm-targets.gradle"

      - name: Verify APKs
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p artifacts

          found=0

          while IFS= read -r -d '' apk; do
            echo "Found APK: ${apk}"

            name="$(basename "${apk}")"
            cp "${apk}" "artifacts/${name}"

            found=1
          done < <(
            find . \
              -type f \
              -path '*/build/outputs/apk/*.apk' \
              -print0
          )

          if [ "${found}" -eq 0 ]; then
            echo "ERROR: No APK files produced"
            find . -type f -path '*/build/outputs/*' -print || true
            exit 1
          fi

          for apk in artifacts/*.apk; do
            echo "Checking ${apk}"

            unzip -l "${apk}" |
              grep -F "assets/tools/arm64-v8a/busybox"

            unzip -l "${apk}" |
              grep -F "assets/tools/arm64-v8a/usb0-native"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/**
            ~/.gradle/daemon/**
          if-no-files-found: ignore
          retention-days: 7
