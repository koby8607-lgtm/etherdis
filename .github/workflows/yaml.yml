name: Build USB0 Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BUSYBOX_VERSION: "1.37.0"
  NDK_VERSION: "27.2.12479018"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platforms;android-30" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            git \
            make \
            binutils \
            python3 \
            unzip \
            zip

      - name: Download BusyBox
        shell: bash
        run: |
          set -euo pipefail

          rm -rf busybox-src
          rm -f busybox.tar.bz2

          curl -L --fail --retry 5 \
            "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2" \
            -o busybox.tar.bz2

          tar -xjf busybox.tar.bz2

          mv \
            "busybox-${BUSYBOX_VERSION}" \
            busybox-src

          rm -f busybox.tar.bz2

      - name: Apply ARM64 SHA1 compatibility patch
        shell: bash
        run: |
          set -euo pipefail

          cd busybox-src

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("libbb/hash_md5_sha.c")
          text = path.read_text()

          # BusyBox 1.37.0 has an x86-only SHA-NI symbol referenced from
          # sha1_end(). The upstream fix is to guard that reference with
          # i386/x86_64 checks. Patch the COMPLETE conditional block so that
          # repeated/previous patch attempts cannot create unmatched #endifs.
          pattern = re.compile(
              r'(\tif \(ctx->process_block == sha1_process_block64\s*\n)'
              r'(#if ENABLE_SHA1_HWACCEL\s*\n)'
              r'(\s*\\\|\| ctx->process_block == sha1_process_block64_shaNI\s*\n)'
              r'(#endif\s*\n)'
              r'(\s*\) \{)',
              re.MULTILINE
          )

          replacement = (
              r'\1'
              r'#if ENABLE_SHA1_HWACCEL' + "\n"
              r'# if defined(__GNUC__) && (defined(__i386__) || defined(__x86_64__))' + "\n"
              r'\3'
              r'# endif' + "\n"
              r'#endif' + "\n"
              r'\5'
          )

          new_text, count = pattern.subn(replacement, text, count=1)

          if count == 0:
              # Already correctly patched: leave it alone.
              required = (
                  "#if ENABLE_SHA1_HWACCEL\n"
                  "# if defined(__GNUC__) && (defined(__i386__) || defined(__x86_64__))\n"
                  "|| ctx->process_block == sha1_process_block64_shaNI\n"
                  "# endif\n"
                  "#endif\n"
              )

              if required not in text:
                  print("ERROR: could not locate BusyBox SHA1 conditional block")
                  sys.exit(1)

              new_text = text

          path.write_text(new_text)
          PY

          # Verify the resulting preprocessor structure around sha1_end().
          sed -n '/sha1_end(/,/hash_size = 5/p' libbb/hash_md5_sha.c

      - name: Configure BusyBox
        shell: bash
        run: |
          set -euo pipefail

          cd busybox-src

          make allnoconfig

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".config")
          lines = path.read_text().splitlines()

          wanted = {
              "CONFIG_DESKTOP": "y",
              "CONFIG_LONG_OPTS": "y",

              "CONFIG_FEATURE_SUID": "y",
              "CONFIG_FEATURE_SUID_CONFIG": "y",
              "CONFIG_FEATURE_SUID_CONFIG_QUIET": "y",

              "CONFIG_FEATURE_SH_STANDALONE": "y",
              "CONFIG_ASH": "y",
              "CONFIG_ASH_OPTIMIZE_FOR_SIZE": "y",

              "CONFIG_CAT": "y",
              "CONFIG_CHMOD": "y",
              "CONFIG_CHOWN": "y",
              "CONFIG_CP": "y",
              "CONFIG_CUT": "y",
              "CONFIG_ECHO": "y",
              "CONFIG_ENV": "y",
              "CONFIG_GREP": "y",
              "CONFIG_HEAD": "y",
              "CONFIG_KILL": "y",
              "CONFIG_LS": "y",
              "CONFIG_MKDIR": "y",
              "CONFIG_MV": "y",
              "CONFIG_PRINTF": "y",
              "CONFIG_PS": "y",
              "CONFIG_PWD": "y",
              "CONFIG_READLINK": "y",
              "CONFIG_RM": "y",
              "CONFIG_SLEEP": "y",
              "CONFIG_SORT": "y",
              "CONFIG_STAT": "y",
              "CONFIG_SYNC": "y",
              "CONFIG_TAIL": "y",
              "CONFIG_TEST": "y",
              "CONFIG_TOUCH": "y",
              "CONFIG_TR": "y",
              "CONFIG_UNAME": "y",
              "CONFIG_UNSET": "y",
              "CONFIG_USLEEP": "y",
              "CONFIG_WC": "y",

              "CONFIG_IP": "y",
              "CONFIG_FEATURE_IP_ADDRESS": "y",
              "CONFIG_FEATURE_IP_LINK": "y",
              "CONFIG_FEATURE_IP_ROUTE": "y",
              "CONFIG_FEATURE_IP_RULE": "y",
              "CONFIG_FEATURE_IP_NEIGH": "y",
              "CONFIG_FEATURE_IP_TUNNEL": "y",
              "CONFIG_FEATURE_IP_SHORT_FORMS": "y",

              "CONFIG_IFCONFIG": "y",
              "CONFIG_FEATURE_IFCONFIG_HW": "y",
              "CONFIG_ROUTE": "y",
              "CONFIG_ARP": "y",
              "CONFIG_ARPING": "y",
              "CONFIG_PING": "y",
              "CONFIG_PING6": "y",
              "CONFIG_UDHCPC": "y",
              "CONFIG_UDHCPC_DEFAULT_SCRIPT": "y",

              "CONFIG_MODPROBE": "y",
              "CONFIG_INSMOD": "y",
              "CONFIG_RMMOD": "y",

              "CONFIG_MOUNT": "y",
              "CONFIG_UMOUNT": "y",
              "CONFIG_DF": "y",
              "CONFIG_DMESG": "y",

              "CONFIG_STATIC": "n",
              "CONFIG_SHA1_HWACCEL": "n",
              "CONFIG_SHA256_HWACCEL": "n",
              "CONFIG_TC": "n",
              "CONFIG_HOSTID": "n",
              "CONFIG_NETSTAT": "n",
              "CONFIG_TRACEROUTE": "n",
              "CONFIG_NC": "n",

              "CONFIG_FEATURE_USE_BSS_TAIL": "n",
              "CONFIG_FLOAT_DURATION": "n",
              "CONFIG_FEATURE_RTMINMAX": "n",
              "CONFIG_FEATURE_BUFFERS_GO_ON_STACK": "n",
              "CONFIG_FEATURE_BUFFERS_USE_MALLOC": "n",
              "CONFIG_FEATURE_BUFFERS_GO_IN_BSS": "y",
              "CONFIG_PIVOT_ROOT": "n",
          }

          out = []
          seen = set()

          for line in lines:
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]

                  if key in wanted:
                      value = wanted[key]

                      if value == "n":
                          out.append(f"# {key} is not set")
                      else:
                          out.append(f"{key}={value}")

                      seen.add(key)
                      continue

              if line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  key = line[2:-11]

                  if key in wanted:
                      value = wanted[key]

                      if value == "n":
                          out.append(f"# {key} is not set")
                      else:
                          out.append(f"{key}={value}")

                      seen.add(key)
                      continue

              out.append(line)

          for key, value in wanted.items():
              if key not in seen:
                  if value == "n":
                      out.append(f"# {key} is not set")
                  else:
                      out.append(f"{key}={value}")

          path.write_text("\n".join(out) + "\n")
          PY

          # Non-interactive Kconfig normalization.
          # Unlike `yes | make oldconfig`, this cannot fail because the
          # `yes` process gets SIGPIPE after make exits.
          make silentoldconfig

          # Ensure the critical options survived normalization.
          grep -Eq '^# CONFIG_STATIC is not set$|^CONFIG_STATIC=n$' .config
          grep -Eq '^# CONFIG_SHA1_HWACCEL is not set$|^CONFIG_SHA1_HWACCEL=n$' .config
          grep -Eq '^CONFIG_FEATURE_BUFFERS_GO_IN_BSS=y$' .config
          grep -Eq '^# CONFIG_FEATURE_BUFFERS_GO_ON_STACK is not set$|^CONFIG_FEATURE_BUFFERS_GO_ON_STACK=n$' .config
          grep -Eq '^# CONFIG_FEATURE_BUFFERS_USE_MALLOC is not set$|^CONFIG_FEATURE_BUFFERS_USE_MALLOC=n$' .config
          grep -Eq '^# CONFIG_PIVOT_ROOT is not set$|^CONFIG_PIVOT_ROOT=n$' .config

      - name: Build BusyBox for Android ARM64
        shell: bash
        run: |
          set -euo pipefail

          cd busybox-src

          TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export PATH="${TOOLCHAIN}:${PATH}"

          export CC="${TOOLCHAIN}/aarch64-linux-android30-clang"
          export HOSTCC="cc"
          export AR="$(command -v ar)"
          export RANLIB="$(command -v ranlib)"
          export STRIP="${TOOLCHAIN}/llvm-strip"

          export CFLAGS="${CFLAGS:-}"
          export CXXFLAGS="${CXXFLAGS:-}"
          export LDFLAGS="${LDFLAGS:-}"

          CFLAGS="$(printf '%s' "$CFLAGS" \
            | sed 's/-static-libgcc//g; s/-static-libstdc++//g')"

          CXXFLAGS="$(printf '%s' "$CXXFLAGS" \
            | sed 's/-static-libgcc//g; s/-static-libstdc++//g')"

          LDFLAGS="$(printf '%s' "$LDFLAGS" \
            | sed 's/-static-libgcc//g; s/-static-libstdc++//g')"

          export CFLAGS
          export CXXFLAGS
          export LDFLAGS

          echo "Compiler: $CC"
          echo "Archiver: $AR"
          echo "Ranlib:   $RANLIB"
          echo "Strip:    $STRIP"

          "$CC" --version

          make V=1 -j1 \
            CC="$CC" \
            HOSTCC="$HOSTCC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP"

          test -x busybox

          file busybox

          readelf -h busybox | grep -E \
            "Class:.*ELF64|Machine:.*AArch64"

          readelf -l busybox \
            | grep -q "Requesting program interpreter"

      - name: Install embedded ARM64 tools
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p app/src/main/assets/tools/arm64-v8a

          cp \
            busybox-src/busybox \
            app/src/main/assets/tools/arm64-v8a/busybox

          chmod 755 \
            app/src/main/assets/tools/arm64-v8a/busybox

          if [ -f app/src/main/jni/arm64-v8a/usb0-native ]; then
            cp \
              app/src/main/jni/arm64-v8a/usb0-native \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          elif [ -f app/src/main/cpp/arm64-v8a/usb0-native ]; then
            cp \
              app/src/main/cpp/arm64-v8a/usb0-native \
              app/src/main/assets/tools/arm64-v8a/usb0-native
          else
            cat > app/src/main/assets/tools/arm64-v8a/usb0-native <<'EOF'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$SELF/busybox" "$@"
          EOF
          fi

          chmod 755 \
            app/src/main/assets/tools/arm64-v8a/usb0-native

          cat > \
            app/src/main/assets/tools/arm64-v8a/manifest.txt <<EOF
          ARCH=arm64-v8a
          ANDROID_API=30
          BUSYBOX_VERSION=${BUSYBOX_VERSION}
          STATIC=NO
          SHA1_HWACCEL=NO
          SHA256_HWACCEL=NO
          TC=NO
          PIVOT_ROOT=NO
          EOF

      - name: Prepare Gradle
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew \
            clean \
            assembleDebug \
            assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find . -type f -name "*.apk" | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No APK produced"
            exit 1
          fi

          for APK in "${APKS[@]}"; do
            echo "Checking $APK"

            unzip -l "$APK" \
              | grep -q "assets/tools/arm64-v8a/busybox"

            unzip -l "$APK" \
              | grep -q "assets/tools/arm64-v8a/usb0-native"

            unzip -l "$APK" \
              | grep -q "assets/tools/arm64-v8a/manifest.txt"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload BusyBox build
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-BusyBox-ARM64
          path: |
            busybox-src/busybox
            busybox-src/.config
            app/src/main/assets/tools/arm64-v8a/manifest.txt

  validate-workflow:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import sys

          directory = Path(".github/workflows")

          workflows = sorted(directory.glob("*.yml"))
          workflows += sorted(directory.glob("*.yaml"))

          if not workflows:
              print("No workflow files found")
              sys.exit(1)

          for workflow in workflows:
              text = workflow.read_text()

              forbidden = (
                  "sdkmanager tools",
                  "packages: 'tools",
                  'packages: "tools',
                  "android-actions/setup-android@v2",
              )

              for item in forbidden:
                  if item in text:
                      print(f"ERROR: {item!r} found in {workflow}")
                      sys.exit(1)

          print("Workflow validation passed")
          PY
