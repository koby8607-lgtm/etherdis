name: Build USB0 Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: "30"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  BUSYBOX_VERSION: "1.37.0"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "${GITHUB_ENV}"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            binutils \
            clang \
            curl \
            file \
            make \
            python3 \
            unzip \
            zip

      - name: Fix Gradle wrapper permissions
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew --version

      - name: Remove previous CI Gradle injection
        shell: bash
        run: |
          set -euo pipefail

          # The project already defines Java 17 and Kotlin JVM 17 in
          # app/build.gradle. The previous workflow created an external
          # android-build-fix.gradle file and applied a KotlinCompile import
          # before the Kotlin plugin was available, causing:
          #
          # unable to resolve class org.jetbrains.kotlin.gradle.tasks.KotlinCompile
          #
          # Do not inject that script.
          rm -f android-build-fix.gradle

          test ! -e android-build-fix.gradle

      - name: Verify project JVM configuration
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/build.gradle"

          test -f "${FILE}"

          grep -Eq \
            "sourceCompatibility[[:space:]]+JavaVersion\.VERSION_17" \
            "${FILE}"

          grep -Eq \
            "targetCompatibility[[:space:]]+JavaVersion\.VERSION_17" \
            "${FILE}"

          grep -Eq \
            "jvmTarget[[:space:]]*=[[:space:]]*['\"]17['\"]" \
            "${FILE}"

          echo "Project already targets Java 17 / Kotlin JVM 17."

      - name: Fix MonitorService Kotlin source
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/r36s/usb0manager/MonitorService.kt"

          test -f "${FILE}"

          python3 - "${FILE}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          bad = (
              'return out + if (err.isNotBlank()) '
              '"\\n[stderr]\\n$err" else ""'
          )

          good = (
              'return@runHelper out + if (err.isNotBlank()) '
              '"\\n[stderr]\\n$err" else ""'
          )

          if good not in text and bad in text:
              text = text.replace(bad, good, 1)

          if good not in text:
              marker = "private fun runHelper(command: String): String = try"

              if marker in text:
                  text = text.replace(
                      marker,
                      "private fun runHelper(command: String): String {\n"
                      "        return try",
                      1
                  )

          path.write_text(text)

          final = path.read_text()

          if "return out + if (err.isNotBlank())" in final:
              raise SystemExit(
                  "ERROR: invalid bare return still exists in runHelper()"
              )

          if (
              "private fun runHelper(command: String): String = try"
              in final
              and "return@runHelper" not in final
          ):
              raise SystemExit(
                  "ERROR: expression-body runHelper still exists"
              )

          print("MonitorService Kotlin source verified.")
          PY

      - name: Prepare embedded tool directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            app/src/main/assets/tools/arm64-v8a

      - name: Build usb0-native
        shell: bash
        run: |
          set -euo pipefail

          NDK="${ANDROID_NDK_ROOT}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          SOURCE=""

          if [ -f app/src/main/cpp/usb0-native.c ]; then
            SOURCE="app/src/main/cpp/usb0-native.c"
          elif [ -f app/src/main/cpp/usb0-native.cpp ]; then
            SOURCE="app/src/main/cpp/usb0-native.cpp"
          fi

          if [ -n "${SOURCE}" ]; then
            if [[ "${SOURCE}" == *.cpp ]]; then
              "${TOOLCHAIN}/aarch64-linux-android30-clang++" \
                -O2 \
                -fPIE \
                -fstack-protector-strong \
                -DANDROID \
                -pie \
                "${SOURCE}" \
                -o app/src/main/assets/tools/arm64-v8a/usb0-native
            else
              "${TOOLCHAIN}/aarch64-linux-android30-clang" \
                -O2 \
                -fPIE \
                -fstack-protector-strong \
                -DANDROID \
                -pie \
                "${SOURCE}" \
                -o app/src/main/assets/tools/arm64-v8a/usb0-native
            fi

            "${TOOLCHAIN}/llvm-strip" \
              app/src/main/assets/tools/arm64-v8a/usb0-native || true
          else
            cat > app/src/main/assets/tools/arm64-v8a/usb0-native <<'EOF'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$SELF/busybox" "$@"
          EOF
          fi

          chmod 755 \
            app/src/main/assets/tools/arm64-v8a/usb0-native

      - name: Create BusyBox builder
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p scripts

          cat > scripts/build-busybox.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          ROOT="$(CDPATH= cd -- "$(dirname -- "${BASH_SOURCE[0]}")/.." && pwd)"

          VERSION="${BUSYBOX_VERSION:-1.37.0}"
          WORK="${RUNNER_TEMP:-/tmp}/usb0-busybox"
          SRC="${WORK}/busybox-${VERSION}"

          OUTDIR="${ROOT}/app/src/main/assets/tools/arm64-v8a"
          OUT="${OUTDIR}/busybox"

          NDK="${ANDROID_NDK_ROOT}"
          TOOLCHAIN="${NDK}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CC="${TOOLCHAIN}/aarch64-linux-android30-clang"
          STRIP="${TOOLCHAIN}/llvm-strip"

          rm -rf "${WORK}"
          mkdir -p "${WORK}"
          mkdir -p "${OUTDIR}"

          curl -fsSL --retry 5 \
            "https://busybox.net/downloads/busybox-${VERSION}.tar.bz2" \
            -o "${WORK}/busybox.tar.bz2"

          tar -xjf "${WORK}/busybox.tar.bz2" -C "${WORK}"

          test -d "${SRC}"

          cd "${SRC}"

          # ARM64 SHA-NI compatibility.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("libbb/hash_md5_sha.c")
          text = p.read_text()

          target = "sha1_process_block64_shaNI"

          if target in text:
              lines = text.splitlines()

              for i, line in enumerate(lines):
                  if target not in line:
                      continue

                  nearby = "\n".join(
                      lines[max(0, i - 6):min(len(lines), i + 6)]
                  )

                  if "defined(__i386__)" not in nearby:
                      indent = line[:len(line) - len(line.lstrip())]

                      lines.insert(
                          i,
                          indent
                          + "#if defined(__GNUC__) && "
                          "(defined(__i386__) || defined(__x86_64__))"
                      )

                      lines.insert(
                          i + 2,
                          indent + "#endif"
                      )

                      p.write_text("\n".join(lines) + "\n")

                  break
          PY

          # Start from the smallest possible BusyBox.
          make allnoconfig

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".config")
          lines = path.read_text().splitlines()

          wanted = {
              # Shell
              "CONFIG_ASH": "y",
              "CONFIG_ASH_OPTIMIZE_FOR_SIZE": "y",
              "CONFIG_FEATURE_SH_STANDALONE": "y",

              # Basic tools
              "CONFIG_CAT": "y",
              "CONFIG_CHMOD": "y",
              "CONFIG_CP": "y",
              "CONFIG_ECHO": "y",
              "CONFIG_ENV": "y",
              "CONFIG_GREP": "y",
              "CONFIG_HEAD": "y",
              "CONFIG_KILL": "y",
              "CONFIG_LS": "y",
              "CONFIG_MKDIR": "y",
              "CONFIG_MV": "y",
              "CONFIG_PRINTF": "y",
              "CONFIG_PS": "y",
              "CONFIG_PWD": "y",
              "CONFIG_READLINK": "y",
              "CONFIG_RM": "y",
              "CONFIG_SLEEP": "y",
              "CONFIG_SORT": "y",
              "CONFIG_STAT": "y",
              "CONFIG_SYNC": "y",
              "CONFIG_TAIL": "y",
              "CONFIG_TEST": "y",
              "CONFIG_TOUCH": "y",
              "CONFIG_TR": "y",
              "CONFIG_UNAME": "y",
              "CONFIG_WC": "y",

              # USB0 network tools
              "CONFIG_IP": "y",
              "CONFIG_FEATURE_IP_ADDRESS": "y",
              "CONFIG_FEATURE_IP_LINK": "y",
              "CONFIG_FEATURE_IP_ROUTE": "y",
              "CONFIG_FEATURE_IP_RULE": "y",
              "CONFIG_FEATURE_IP_NEIGH": "y",
              "CONFIG_FEATURE_IP_TUNNEL": "y",
              "CONFIG_FEATURE_IP_SHORT_FORMS": "y",
              "CONFIG_ARP": "y",
              "CONFIG_UDHCPC": "y",
              "CONFIG_UDHCPC_DEFAULT_SCRIPT": "y",
              "CONFIG_PING": "y",

              # Kernel modules
              "CONFIG_MODPROBE": "y",
              "CONFIG_INSMOD": "y",
              "CONFIG_RMMOD": "y",

              # Diagnostics
              "CONFIG_DMESG": "y",

              # Dynamic Android/Bionic
              "CONFIG_STATIC": "n",

              # Disable problematic optional features
              "CONFIG_SHA1_HWACCEL": "n",
              "CONFIG_SHA256_HWACCEL": "n",
              "CONFIG_TC": "n",
              "CONFIG_HOSTID": "n",
              "CONFIG_NETSTAT": "n",
              "CONFIG_TRACEROUTE": "n",
              "CONFIG_NC": "n",

              # Do not compile Android-incompatible util-linux mount code.
              "CONFIG_MOUNT": "n",
              "CONFIG_UMOUNT": "n",
              "CONFIG_PIVOT_ROOT": "n",
              "CONFIG_SWAPONOFF": "n",
              "CONFIG_LOSETUP": "n",
              "CONFIG_READAHEAD": "n",
              "CONFIG_SETSERIAL": "n",
              "CONFIG_FSTRIM": "n",
              "CONFIG_BLOCKDEV": "n",
              "CONFIG_EJECT": "n",

              # These caused previous networking/interface failures.
              "CONFIG_IFCONFIG": "n",
              "CONFIG_ROUTE": "n",
              "CONFIG_ARPING": "n",
              "CONFIG_PING6": "n",

              # Unneeded archive/filesystem functions.
              "CONFIG_TAR": "n",
              "CONFIG_GZIP": "n",
              "CONFIG_BZIP2": "n",
              "CONFIG_XZ": "n",
              "CONFIG_CPIO": "n",
              "CONFIG_AR": "n",
              "CONFIG_UNZIP": "n",

              # Other optional features.
              "CONFIG_FEATURE_USE_BSS_TAIL": "n",
              "CONFIG_FLOAT_DURATION": "n",
              "CONFIG_FEATURE_RTMINMAX": "n",
              "CONFIG_FEATURE_BUFFERS_GO_ON_STACK": "n",
              "CONFIG_FEATURE_BUFFERS_USE_MALLOC": "n",
              "CONFIG_FEATURE_BUFFERS_GO_IN_BSS": "y",
          }

          def emit(key, value):
              if value == "n":
                  return f"# {key} is not set"
              return f"{key}={value}"

          result = []
          seen = set()

          for line in lines:
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]

                  if key in wanted:
                      result.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              if (
                  line.startswith("# CONFIG_")
                  and line.endswith(" is not set")
              ):
                  key = line[2:-11]

                  if key in wanted:
                      result.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              result.append(line)

          for key, value in wanted.items():
              if key not in seen:
                  result.append(emit(key, value))

          path.write_text("\n".join(result) + "\n")
          PY

          # Resolve remaining Kconfig dependencies.
          set +e

          yes "" | make oldconfig > "${WORK}/oldconfig.log" 2>&1

          pipe_status=("${PIPESTATUS[@]}")
          make_rc="${pipe_status[1]}"

          set -e

          cat "${WORK}/oldconfig.log"

          if [ "${make_rc}" -ne 0 ]; then
              echo "BusyBox oldconfig failed: ${make_rc}"
              exit "${make_rc}"
          fi

          # Hard checks before compiling.
          for symbol in \
              CONFIG_IFCONFIG \
              CONFIG_ROUTE \
              CONFIG_ARPING \
              CONFIG_PING6 \
              CONFIG_MOUNT \
              CONFIG_UMOUNT \
              CONFIG_PIVOT_ROOT; do

              if grep -Eq "^${symbol}=y$" .config; then
                  echo "ERROR: forbidden ${symbol}=y"
                  exit 1
              fi
          done

          for symbol in \
              CONFIG_IP \
              CONFIG_ARP \
              CONFIG_UDHCPC \
              CONFIG_PING; do

              if ! grep -Eq "^${symbol}=y$" .config; then
                  echo "ERROR: required ${symbol}=y missing"
                  exit 1
              fi
          done

          # IMPORTANT:
          # Do not add -D__ANDROID_API__=30.
          # The Android target compiler already defines this macro.
          export CC="${CC}"
          export HOSTCC="cc"
          export AR="$(command -v ar)"
          export RANLIB="$(command -v ranlib)"
          export STRIP="${STRIP}"

          export CFLAGS="-Os -fPIE"
          export LDFLAGS="-pie"

          make V=1 -j1 \
              CC="${CC}" \
              HOSTCC="${HOSTCC}" \
              AR="${AR}" \
              RANLIB="${RANLIB}" \
              STRIP="${STRIP}" \
              CFLAGS="${CFLAGS}" \
              LDFLAGS="${LDFLAGS}"

          test -f busybox
          test -f include/autoconf.h

          # Never execute the AArch64 binary on the x86_64 runner.
          for symbol in \
              IP \
              ARP \
              UDHCPC \
              PING; do

              grep -Eq \
                  "^#define ENABLE_${symbol} 1$" \
                  include/autoconf.h || {

                  echo "ERROR: BusyBox applet ${symbol} was not compiled"
                  exit 1
              }
          done

          for symbol in \
              IFCONFIG \
              ROUTE \
              ARPING \
              PING6; do

              if grep -Eq \
                  "^#define ENABLE_${symbol} 1$" \
                  include/autoconf.h; then

                  echo "ERROR: forbidden applet ${symbol} was compiled"
                  exit 1
              fi
          done

          mkdir -p "${OUTDIR}"

          cp busybox "${OUT}"
          chmod 755 "${OUT}"

          "${STRIP}" "${OUT}" || true

          file "${OUT}"

          "${TOOLCHAIN}/llvm-readelf" -h "${OUT}" \
              | grep -Eq "Class:.*ELF64"

          "${TOOLCHAIN}/llvm-readelf" -h "${OUT}" \
              | grep -Eq "Machine:.*AArch64"

          "${TOOLCHAIN}/llvm-readelf" -l "${OUT}" \
              | grep -q "Requesting program interpreter"

          echo "BusyBox ARM64 build verified."
          SCRIPT

          chmod 755 scripts/build-busybox.sh

          bash -n scripts/build-busybox.sh

      - name: Build BusyBox
        shell: bash
        run: |
          set -euo pipefail

          bash ./scripts/build-busybox.sh

      - name: Install helper scripts
        shell: bash
        run: |
          set -euo pipefail

          DIR="app/src/main/assets/tools/arm64-v8a"

          cat > "${DIR}/usb0-helper.sh" <<'EOF'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "${SELF}/busybox" "$@"
          EOF

          cat > "${DIR}/usb0-helper" <<'EOF'
          #!/system/bin/sh
          SELF="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "${SELF}/busybox" "$@"
          EOF

          chmod 755 \
              "${DIR}/usb0-helper.sh" \
              "${DIR}/usb0-helper"

          cat > "${DIR}/manifest.txt" <<EOF
          ARCH=arm64-v8a
          ANDROID_API=${ANDROID_API_LEVEL}
          BUSYBOX_VERSION=${BUSYBOX_VERSION}
          STATIC=NO
          IP=YES
          ARP=YES
          UDHCPC=YES
          PING=YES
          IFCONFIG=NO
          ROUTE=NO
          ARPING=NO
          PING6=NO
          MOUNT=NO
          UMOUNT=NO
          PIVOT_ROOT=NO
          TARGET_BINARY_MUST_NOT_RUN_ON_CI=YES
          EOF

      - name: Verify embedded tools
        shell: bash
        run: |
          set -euo pipefail

          DIR="app/src/main/assets/tools/arm64-v8a"

          test -s "${DIR}/busybox"
          test -s "${DIR}/usb0-native"
          test -s "${DIR}/usb0-helper"
          test -s "${DIR}/usb0-helper.sh"
          test -s "${DIR}/manifest.txt"

          file "${DIR}/busybox"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          # The project itself already has:
          # Java sourceCompatibility 17
          # Java targetCompatibility 17
          # Kotlin jvmTarget 17
          #
          # Therefore no external Kotlin Gradle class/import is needed.
          bash ./gradlew \
              clean \
              assembleDebug \
              --no-daemon \
              --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew \
              assembleRelease \
              --no-daemon \
              --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
              find app/build/outputs \
                -type f \
                -name "*.apk" \
                | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
              echo "ERROR: no APK produced"
              exit 1
          fi

          for apk in "${APKS[@]}"; do
              echo "Checking ${apk}"

              unzip -l "${apk}" \
                  | grep -q \
                    "assets/tools/arm64-v8a/busybox"

              unzip -l "${apk}" \
                  | grep -q \
                    "assets/tools/arm64-v8a/usb0-native"

              unzip -l "${apk}" \
                  | grep -q \
                    "assets/tools/arm64-v8a/usb0-helper"

              unzip -l "${apk}" \
                  | grep -q \
                    "assets/tools/arm64-v8a/usb0-helper.sh"

              unzip -l "${apk}" \
                  | grep -q \
                    "assets/tools/arm64-v8a/manifest.txt"

              echo "Verified ${apk}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APK
          path: |
              app/build/outputs/apk/debug/*.apk
              app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload BusyBox
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-BusyBox-ARM64
          path: |
              app/src/main/assets/tools/arm64-v8a/busybox
              app/src/main/assets/tools/arm64-v8a/manifest.txt
          if-no-files-found: error
          retention-days: 30

      # This job demonstrates job-to-job communication through artifacts.
      # Files created by "build" are not automatically available to another
      # GitHub Actions job, so future jobs should use upload/download artifacts.
      verify:
        name: Verify build outputs
        runs-on: ubuntu-24.04
        needs: build

        steps:
          - name: Download APK artifact
            uses: actions/download-artifact@v4
            with:
              name: USB0-Manager-APK
              path: verified-apks

          - name: Verify downloaded APK artifact
            shell: bash
            run: |
              set -euo pipefail

              mapfile -t APKS < <(
                  find verified-apks \
                    -type f \
                    -name "*.apk" \
                    | sort
              )

              if [ "${#APKS[@]}" -eq 0 ]; then
                  echo "ERROR: no APK was passed from build job"
                  exit 1
              fi

              for apk in "${APKS[@]}"; do
                  echo "Final artifact received:"
                  echo "${apk}"
                  file "${apk}"
              done

              echo "Build job -> verify job communication succeeded."

  validate-workflow:
    name: Validate workflow
    runs-on: ubuntu-24.04
    needs: build
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate all workflow files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          directory = Path(".github/workflows")

          files = sorted(directory.glob("*.yml"))
          files += sorted(directory.glob("*.yaml"))

          if not files:
              raise SystemExit("No workflow files found")

          forbidden = (
              "sdkmanager tools",
              "packages: 'tools",
              'packages: "tools',
              "android-actions/setup-android@v2",
              "android-build-fix.gradle",
              "busybox --list",
              "CONFIG_MOUNT=y",
              "CONFIG_UMOUNT=y",
              "CONFIG_PIVOT_ROOT=y",
          )

          for workflow in files:
              text = workflow.read_text()

              for pattern in forbidden:
                  if pattern in text:
                      raise SystemExit(
                          f"Forbidden pattern {pattern!r} found in {workflow}"
                      )

              print(f"Validated {workflow}")

          print("All workflow files passed validation.")
          PY
