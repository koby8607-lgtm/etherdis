name: Build USB0 Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BUSYBOX_VERSION: "1.37.0"
  NDK_VERSION: "27.2.12479018"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platforms;android-30" \
            "build-tools;35.0.0" \
            "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            curl \
            file \
            git \
            make \
            binutils \
            python3 \
            unzip \
            zip

      - name: Download BusyBox
        shell: bash
        run: |
          set -euo pipefail

          rm -rf busybox-src
          rm -f busybox.tar.bz2

          curl -L --fail --retry 5 \
            "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2" \
            -o busybox.tar.bz2

          tar -xjf busybox.tar.bz2

          mv \
            "busybox-${BUSYBOX_VERSION}" \
            busybox-src

          rm -f busybox.tar.bz2

      - name: Patch BusyBox SHA1 for ARM64
        shell: bash
        run: |
          set -euo pipefail

          cd busybox-src

          python3 - <<'PY'
          from pathlib import Path

          path = Path("libbb/hash_md5_sha.c")
          text = path.read_text()

          target = "sha1_process_block64_shaNI"

          if target not in text:
              print("No SHA-NI reference found; nothing to patch.")
              raise SystemExit(0)

          lines = text.splitlines()

          for i, line in enumerate(lines):
              if target not in line:
                  continue

              already_guarded = False

              for j in range(max(0, i - 4), i):
                  if (
                      "defined(__i386__)" in lines[j]
                      and "defined(__x86_64__)" in lines[j]
                  ):
                      already_guarded = True
                      break

              if already_guarded:
                  print("SHA-NI guard already present.")
                  raise SystemExit(0)

              indent = line[:len(line) - len(line.lstrip())]

              lines.insert(
                  i,
                  f"{indent}#if defined(__GNUC__) && (defined(__i386__) || defined(__x86_64__))"
              )

              lines.insert(
                  i + 2,
                  f"{indent}#endif"
              )

              path.write_text("\n".join(lines) + "\n")
              print("SHA-NI ARM64 guard applied.")
              raise SystemExit(0)

          raise SystemExit("ERROR: SHA-NI reference could not be patched")
          PY

      - name: Configure BusyBox
        shell: bash
        run: |
          set -euo pipefail

          cd busybox-src

          make allnoconfig

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".config")
          lines = path.read_text().splitlines()

          wanted = {
              # Shell
              "CONFIG_DESKTOP": "y",
              "CONFIG_LONG_OPTS": "y",
              "CONFIG_ASH": "y",
              "CONFIG_ASH_OPTIMIZE_FOR_SIZE": "y",
              "CONFIG_FEATURE_SH_STANDALONE": "y",

              # Basic tools
              "CONFIG_CAT": "y",
              "CONFIG_CHMOD": "y",
              "CONFIG_CHOWN": "y",
              "CONFIG_CP": "y",
              "CONFIG_CUT": "y",
              "CONFIG_ECHO": "y",
              "CONFIG_ENV": "y",
              "CONFIG_GREP": "y",
              "CONFIG_HEAD": "y",
              "CONFIG_KILL": "y",
              "CONFIG_LS": "y",
              "CONFIG_MKDIR": "y",
              "CONFIG_MV": "y",
              "CONFIG_PRINTF": "y",
              "CONFIG_PS": "y",
              "CONFIG_PWD": "y",
              "CONFIG_READLINK": "y",
              "CONFIG_RM": "y",
              "CONFIG_SLEEP": "y",
              "CONFIG_SORT": "y",
              "CONFIG_STAT": "y",
              "CONFIG_SYNC": "y",
              "CONFIG_TAIL": "y",
              "CONFIG_TEST": "y",
              "CONFIG_TOUCH": "y",
              "CONFIG_TR": "y",
              "CONFIG_UNAME": "y",
              "CONFIG_UNSET": "y",
              "CONFIG_USLEEP": "y",
              "CONFIG_WC": "y",

              # Networking
              "CONFIG_IP": "y",
              "CONFIG_FEATURE_IP_ADDRESS": "y",
              "CONFIG_FEATURE_IP_LINK": "y",
              "CONFIG_FEATURE_IP_ROUTE": "y",
              "CONFIG_FEATURE_IP_RULE": "y",
              "CONFIG_FEATURE_IP_NEIGH": "y",
              "CONFIG_FEATURE_IP_TUNNEL": "y",
              "CONFIG_FEATURE_IP_SHORT_FORMS": "y",

              "CONFIG_IFCONFIG": "y",
              "CONFIG_FEATURE_IFCONFIG_HW": "y",
              "CONFIG_ROUTE": "y",
              "CONFIG_ARP": "y",
              "CONFIG_ARPING": "y",
              "CONFIG_PING": "y",
              "CONFIG_PING6": "y",
              "CONFIG_UDHCPC": "y",
              "CONFIG_UDHCPC_DEFAULT_SCRIPT": "y",

              # Modules
              "CONFIG_MODPROBE": "y",
              "CONFIG_INSMOD": "y",
              "CONFIG_RMMOD": "y",

              # Diagnostics
              "CONFIG_DMESG": "y",
              "CONFIG_DF": "y",

              # Android ARM64 compatibility
              "CONFIG_STATIC": "n",
              "CONFIG_SHA1_HWACCEL": "n",
              "CONFIG_SHA256_HWACCEL": "n",
              "CONFIG_TC": "n",
              "CONFIG_HOSTID": "n",
              "CONFIG_NETSTAT": "n",
              "CONFIG_TRACEROUTE": "n",
              "CONFIG_NC": "n",

              # Do not compile Android-incompatible mount code.
              "CONFIG_MOUNT": "n",
              "CONFIG_UMOUNT": "n",
              "CONFIG_PIVOT_ROOT": "n",
              "CONFIG_SWAPONOFF": "n",
              "CONFIG_FREERAMDISK": "n",
              "CONFIG_LOSETUP": "n",
              "CONFIG_READAHEAD": "n",
              "CONFIG_SETSERIAL": "n",
              "CONFIG_FSTRIM": "n",
              "CONFIG_BLOCKDEV": "n",
              "CONFIG_EJECT": "n",

              # Other unnecessary applets
              "CONFIG_TAR": "n",
              "CONFIG_GZIP": "n",
              "CONFIG_BZIP2": "n",
              "CONFIG_XZ": "n",
              "CONFIG_CPIO": "n",
              "CONFIG_AR": "n",
              "CONFIG_UNZIP": "n",

              # Avoid optional libc-heavy features.
              "CONFIG_FEATURE_USE_BSS_TAIL": "n",
              "CONFIG_FLOAT_DURATION": "n",
              "CONFIG_FEATURE_RTMINMAX": "n",
              "CONFIG_FEATURE_BUFFERS_GO_ON_STACK": "n",
              "CONFIG_FEATURE_BUFFERS_USE_MALLOC": "n",
              "CONFIG_FEATURE_BUFFERS_GO_IN_BSS": "y",
          }

          def emit(key, value):
              return (
                  f"# {key} is not set"
                  if value == "n"
                  else f"{key}={value}"
              )

          out = []
          seen = set()

          for line in lines:
              if line.startswith("CONFIG_") and "=" in line:
                  key = line.split("=", 1)[0]

                  if key in wanted:
                      out.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              if line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  key = line[2:-11]

                  if key in wanted:
                      out.append(emit(key, wanted[key]))
                      seen.add(key)
                      continue

              out.append(line)

          for key, value in wanted.items():
              if key not in seen:
                  out.append(emit(key, value))

          path.write_text("\n".join(out) + "\n")
          PY

      - name: Normalize BusyBox config
        shell: bash
        run: |
          set -euo pipefail

          cd busybox-src

          # Use a short-lived producer and capture only make's exit code.
          set +e
          yes "" | make oldconfig > /tmp/busybox-oldconfig.log 2>&1
          status=("${PIPESTATUS[@]}")
          make_rc="${status[1]}"
          set -e

          cat /tmp/busybox-oldconfig.log

          if [ "${make_rc}" -ne 0 ]; then
            echo "BusyBox oldconfig failed: ${make_rc}"
            exit "${make_rc}"
          fi

          if grep -Eq \
            '^CONFIG_(MOUNT|UMOUNT|PIVOT_ROOT)=y$' \
            .config; then
            echo "ERROR: forbidden util-linux applet enabled"
            grep -E '^CONFIG_(MOUNT|UMOUNT|PIVOT_ROOT)=' .config || true
            exit 1
          fi

      - name: Build BusyBox ARM64 Android
        shell: bash
        run: |
          set -euo pipefail

          cd busybox-src

          TOOLCHAIN="${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          export PATH="${TOOLCHAIN}:${PATH}"
          export CC="${TOOLCHAIN}/aarch64-linux-android30-clang"
          export HOSTCC="cc"
          export AR="$(command -v ar)"
          export RANLIB="$(command -v ranlib)"
          export STRIP="${TOOLCHAIN}/llvm-strip"

          export CFLAGS="${CFLAGS:-}"
          export CXXFLAGS="${CXXFLAGS:-}"
          export LDFLAGS="${LDFLAGS:-}"

          CFLAGS="$(printf '%s' "$CFLAGS" \
            | sed 's/-static-libgcc//g; s/-static-libstdc++//g')"

          CXXFLAGS="$(printf '%s' "$CXXFLAGS" \
            | sed 's/-static-libgcc//g; s/-static-libstdc++//g')"

          LDFLAGS="$(printf '%s' "$LDFLAGS" \
            | sed 's/-static-libgcc//g; s/-static-libstdc++//g')"

          export CFLAGS
          export CXXFLAGS
          export LDFLAGS

          make V=1 -j1 \
            CC="$CC" \
            HOSTCC="$HOSTCC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP"

          test -x busybox

          file busybox

          readelf -h busybox | grep -E \
            "Class:.*ELF64|Machine:.*AArch64"

          readelf -l busybox \
            | grep -q "Requesting program interpreter"

      - name: Patch Kotlin source before Gradle
        shell: bash
        run: |
          set -euo pipefail

          FILE="app/src/main/java/com/r36s/usb0manager/MonitorService.kt"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found"
            exit 1
          fi

          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          text = path.read_text()

          old = '''    private fun runHelper(command: String): String = try {
        val helper = HelperManager.install(this).helper
        val q = "'${helper.absolutePath.replace("'", "'\\\\''")}' $command"
        var last = "no su"
        for (su in listOf("/system/xbin/su", "/system/bin/su", "/vendor/bin/su", "su")) {
            try {
                val p = Runtime.getRuntime().exec(arrayOf(su, "-c", q))
                val out = p.inputStream.bufferedReader().readText()
                val err = p.errorStream.bufferedReader().readText()
                p.waitFor()
                if (p.exitValue() == 0 || out.isNotBlank()) return out + if (err.isNotBlank()) "\\n[stderr]\\n$err" else ""
                last = err.ifBlank { "su exit=${p.exitValue()}" }
            } catch (e: Exception) {
                last = e.message ?: "su failed"
            }
        }
        "root-error=$last"
    } catch (e: Exception) {
        "root-error=${e.message}"
    }'''

          new = '''    private fun runHelper(command: String): String {
        return try {
            val helper = HelperManager.install(this).helper
            val q = "'${helper.absolutePath.replace("'", "'\\\\''")}' $command"
            var last = "no su"

            for (su in listOf("/system/xbin/su", "/system/bin/su", "/vendor/bin/su", "su")) {
                try {
                    val p = Runtime.getRuntime().exec(arrayOf(su, "-c", q))
                    val out = p.inputStream.bufferedReader().readText()
                    val err = p.errorStream.bufferedReader().readText()
                    p.waitFor()

                    if (p.exitValue() == 0 || out.isNotBlank()) {
                        return out + if (err.isNotBlank()) {
                            "\\n[stderr]\\n$err"
                        } else {
                            ""
                        }
                    }

                    last = err.ifBlank { "su exit=${p.exitValue()}" }
                } catch (e: Exception) {
                    last = e.message ?: "su failed"
                }
            }

            "root-error=$last"
        } catch (e: Exception) {
            "root-error=${e.message}"
        }
    }'''

          if old in text:
              path.write_text(text.replace(old, new, 1))
              print("MonitorService.runHelper converted to block body.")
              raise SystemExit(0)

          # Also support the same function if whitespace/formatting changed.
          start = text.find("private fun runHelper(command: String): String = try")

          if start >= 0:
              # Find the function by brace balancing.
              tail = text[start:]
              first_brace = tail.find("{")
              if first_brace >= 0:
                  depth = 0
                  end = None

                  for i in range(first_brace, len(tail)):
                      if tail[i] == "{":
                          depth += 1
                      elif tail[i] == "}":
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              break

                  if end is not None:
                      function = tail[:end]

                      function = function.replace(
                          "private fun runHelper(command: String): String = try",
                          "private fun runHelper(command: String): String {\n    return try",
                          1
                      )

                      if function.endswith("}"):
                          function = function[:-1] + "\n}"

                      path.write_text(text[:start] + function + tail[end:])
                      print("MonitorService.runHelper converted using fallback parser.")
                      raise SystemExit(0)

          raise SystemExit(
              "ERROR: could not locate runHelper() in MonitorService.kt"
          )
          PY

          # The exact compiler error that triggered this build must now be impossible.
          if grep -n \
            "private fun runHelper(command: String): String = try" \
            "$FILE"; then
            echo "ERROR: expression-body runHelper still exists"
            exit 1
          fi

          echo "Kotlin source patch verified."

      - name: Force Java/Kotlin JVM 17
        shell: bash
        run: |
          set -euo pipefail

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > android-build-fix.gradle <<'EOF'
          import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  options.release.set(17)
              }

              tasks.withType(KotlinCompile).configureEach {
                  compilerOptions {
                      jvmTarget.set(
                          org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
                      )
                  }
              }
          }
          EOF

          # Inject the compatibility script through the existing root build file.
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("build.gradle"),
              Path("build.gradle.kts"),
          ]

          existing = [p for p in candidates if p.exists()]

          if not existing:
              raise SystemExit("ERROR: root Gradle build file not found")

          gradle = existing[0]
          text = gradle.read_text()

          marker = "android-build-fix.gradle"

          if marker not in text:
              text += '\napply from: "android-build-fix.gradle"\n'
              gradle.write_text(text)

          print(f"Gradle JVM target fix installed in {gradle}")
          PY

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          chmod 755 ./gradlew

          bash ./gradlew \
            clean \
            assembleDebug \
            assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find . -type f -name "*.apk" | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "ERROR: no APK produced"
            exit 1
          fi

          for APK in "${APKS[@]}"; do
            echo "Verifying ${APK}"

            unzip -l "${APK}" \
              | grep -q "assets/tools/arm64-v8a/busybox"

            unzip -l "${APK}" \
              | grep -q "assets/tools/arm64-v8a/usb0-native"

            unzip -l "${APK}" \
              | grep -q "assets/tools/arm64-v8a/manifest.txt"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APK
          path: |
            **/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload BusyBox
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-BusyBox-ARM64
          path: |
            busybox-src/busybox
            busybox-src/.config
            app/src/main/assets/tools/arm64-v8a/manifest.txt
