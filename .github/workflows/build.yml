name: Build USB0 Manager

on:
  push:
    branches:
      - main
      - master
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"

          echo "ANDROID_SDK_ROOT=${SDK_ROOT}"
          export ANDROID_SDK_ROOT="${SDK_ROOT}"
          export ANDROID_HOME="${SDK_ROOT}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [[ ! -x "${SDKMANAGER}" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi

          if [[ -z "${SDKMANAGER}" ]]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager: ${SDKMANAGER}"
          "${SDKMANAGER}" --version

          "${SDKMANAGER}" \
            --sdk_root="${SDK_ROOT}" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"

          test -d "${SDK_ROOT}/platform-tools"
          test -d "${SDK_ROOT}/platforms/android-${ANDROID_API_LEVEL}"
          test -d "${SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}"
          test -d "${SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}"

          echo "Android SDK verification passed"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail

          test -f ./gradlew

          chmod 755 ./gradlew

          test -r ./gradlew
          test -x ./gradlew

          head -n 1 ./gradlew

      - name: Check Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew --version

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f settings.gradle && ! -f settings.gradle.kts ]]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found"
            exit 1
          fi

          if [[ ! -f build.gradle && ! -f build.gradle.kts ]]; then
            echo "ERROR: build.gradle or build.gradle.kts not found"
            exit 1
          fi

      - name: Validate native sources
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d app/src/main/cpp ]]; then
            while IFS= read -r -d '' file; do
              echo "Found native source: ${file}"
            done < <(
              find app/src/main/cpp \
                -type f \
                \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \) \
                -print0
            )
          fi

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            bash -n "${file}"
          done < <(
            find . \
              -type f \
              \( -name '*.sh' -o -name '*.bash' \) \
              -not -path './.git/*' \
              -print0
          )

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          bash ./gradlew \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail

          bash ./gradlew \
            assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          found=0

          while IFS= read -r -d '' apk; do
            echo "Collecting: ${apk}"
            cp "${apk}" artifacts/
            found=1
          done < <(
            find . \
              -type f \
              -path '*/build/outputs/apk/*.apk' \
              -print0
          )

          if [[ "${found}" -eq 0 ]]; then
            echo "ERROR: No APK files were produced"
            find . -type f -path '*/build/outputs/*' -print || true
            exit 1
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-APKs
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: USB0-Manager-build-diagnostics
          path: |
            **/build/outputs/**
            **/build/reports/**
            ~/.gradle/daemon/**
          if-no-files-found: ignore
          retention-days: 7
