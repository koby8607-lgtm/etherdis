name: Build USB0 Manager v1.7

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build private ARM64 networking engine
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          chmod +x "$CLANG"
          "$CLANG" -O2 -fPIE -pie -DANDROID app/src/main/cpp/usb0-native.c \
            -o app/src/main/assets/tools/arm64-v8a/usb0-native
          file app/src/main/assets/tools/arm64-v8a/usb0-native
          chmod 755 app/src/main/assets/tools/arm64-v8a/usb0-native

      - name: Build ARM64 helper launcher
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
          "$CLANG" -O2 -fPIE -pie -DANDROID app/src/main/cpp/usb0-helper.c \
            -o app/src/main/assets/tools/arm64-v8a/usb0-helper
          file app/src/main/assets/tools/arm64-v8a/usb0-helper
          chmod 755 app/src/main/assets/tools/arm64-v8a/usb0-helper

      - name: Verify bundled tools are present
        run: |
          test -s app/src/main/assets/tools/arm64-v8a/usb0-native
          test -s app/src/main/assets/tools/arm64-v8a/usb0-helper
          test -s app/src/main/assets/tools/arm64-v8a/usb0-helper.sh
          test -s app/src/main/assets/r36s/lineageos_r36s_defconfig.txt
          test -s app/src/main/assets/r36s/kernel-capabilities.txt

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod 755 ./gradlew
          test -r ./gradlew
          test -x ./gradlew

      - name: Build debug and release
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: usb0-manager-v1.7
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish release APK on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
